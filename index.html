    html += '<td style="color:var(--gm)">' + r.pct + '% into session</td>';
    html += '<td>' + r.len + ' strokes</td>';
    html += '<td class="td-spd">' + r.avgSpd.toFixed(2) + ' mph</td>';
    html += '<td class="td-spd">' + r.p95.toFixed(2) + ' mph</td>';
    html += '<td>' + (r.avgSR ? r.avgSR.toFixed(0) + ' spm' : '—') + '</td>';
    html += '<td style="font-weight:900;color:' + effCol + '">' + (r.eff ? r.eff.toFixed(2) : '—') + '</td>';
    html += '</tr>';
  });
  html += '</table></div>';
  html += '</div>';
  return html;
}


/* ═══════════════════════════════════════════
   TIDES — Local harmonic computation
   Station 9413745: Santa Cruz, Monterey Bay
   Constituents from NOAA CO-OPS published data.
   No API call needed — works offline + file://.
   Same algorithm NOAA uses for predictions.
   Accuracy: typically ±0.1ft, ±10min of NOAA.
═══════════════════════════════════════════ */

/* Constituent: [amplitude_ft, phase_degrees_from_epoch] */
var TIDE_CONST = {
  M2: [2.382,162.5], S2: [0.377,191.5], N2: [0.475,143.3], K1: [1.161,232.0],
  M4: [0.030,224.6], O1: [0.666,211.5], M6: [0.011,282.2], MK3:[0.018,343.0],
  MN4:[0.017,201.1], NU2:[0.089,140.8], '2N2':[0.058,122.6], OO1:[0.052,275.7],
  LAM2:[0.026,171.9],S1: [0.022,176.8], M1: [0.027,213.1], J1: [0.082,255.7],
  RHO:[0.070,204.3], Q1: [0.130,200.0], T2: [0.022,186.0], '2Q1':[0.017,191.8],
  P1: [0.383,228.8], M3: [0.003,215.8], L2: [0.044,190.2], K2: [0.103,190.3],
  MS4:[0.011,244.5], MU2:[0.058,120.8],
};
/* Angular speed deg/solar-hour */
var TIDE_SPEED = {
  M2:28.9841042, S2:30.0, N2:28.4397295, K1:15.0410686,
  M4:57.9682084, O1:13.9430356, M6:86.9523127, MK3:44.0251729,
  MN4:57.4238337, NU2:28.5125831, '2N2':27.8953548, OO1:16.1391017,
  LAM2:29.4556253, S1:15.0, M1:14.4966939, J1:15.5854433,
  RHO:13.4715145, Q1:13.3986609, T2:29.9589333, '2Q1':12.8542862,
  P1:14.9589314, M3:43.4761563, L2:29.5284789, K2:30.0821373,
  MS4:58.9841042, MU2:27.9682084,
};
var TIDE_EPOCH_MS = Date.UTC(1900,0,1);  /* Jan 1 1900 UTC */
var TIDE_DATUM_FT = 2.55;               /* MSL above MLLW, Santa Cruz */
var DEG = Math.PI / 180;

function tideHeightAt(utcMs) {
  var hrs = (utcMs - TIDE_EPOCH_MS) / 3600000;
  var h = TIDE_DATUM_FT;
  for (var name in TIDE_CONST) {
    var amp = TIDE_CONST[name][0], phase = TIDE_CONST[name][1];
    var speed = TIDE_SPEED[name];
    if (speed && amp) h += amp * Math.cos((speed * hrs - phase) * DEG);
  }
  return h;
}

function computeTidesForSession(session) {
  /* Parse session date + start time in PDT (UTC-7) */
  var y  = +session.date.slice(0,4);
  var mo = +session.date.slice(4,6) - 1;  /* 0-based month */
  var d  = +session.date.slice(6,8);

  var m = session.startTime.match(/(\d{2}):(\d{2}):\d{2}$/);
  var sh = m ? +m[1] : 12, sm = m ? +m[2] : 0;

  /* Session start in UTC */
  var startUtc = Date.UTC(y, mo, d, sh + 7, sm);

  /* Scan PDT day: midnight PDT (07:00 UTC) for 24 h, every 6 min */
  var t0 = Date.UTC(y, mo, d, 7, 0);
  var samples = [];
  for (var i = 0; i <= 240; i++) {
    var t = t0 + i * 6 * 60000;
    samples.push({ t: t, h: tideHeightAt(t) });
  }

  /* Find local extrema */
  var events = [];
  for (var i = 1; i < samples.length - 1; i++) {
    var prev = samples[i-1].h, cur = samples[i].h, next = samples[i+1].h;
    if (cur > prev && cur > next) events.push({ type:'H', t:samples[i].t, h:Math.round(cur*100)/100 });
    else if (cur < prev && cur < next) events.push({ type:'L', t:samples[i].t, h:Math.round(cur*100)/100 });
  }

  /* Helper: PDT time string from UTC ms */
  function pdtStr(utcMs) {
    var d = new Date(utcMs - 7*3600000);  /* shift to PDT */
    var hh = d.getUTCHours(), mm = d.getUTCMinutes();
    var suffix = hh >= 12 ? 'pm' : 'am';
    var h12 = hh % 12 || 12;
    return h12 + ':' + (mm < 10 ? '0'+mm : mm) + ' ' + suffix;
  }

  /* Minutes since PDT midnight for each event */
  function pdtMins(utcMs) {
    var d = new Date(utcMs - 7*3600000);
    return d.getUTCHours() * 60 + d.getUTCMinutes();
  }

  var startMins = sh * 60 + sm;
  events.forEach(function(e) { e.mins = pdtMins(e.t); e.timeStr = pdtStr(e.t); });

  /* Bracket session start */
  var before = null, after = null;
  for (var i = 0; i < events.length; i++) {
    if (events[i].mins <= startMins) before = events[i];
    else if (!after) after = events[i];
  }

  var state = 'unknown';
  if (before && after) state = before.type === 'L' ? 'rising' : 'falling';
  else if (before)     state = before.type === 'H' ? 'falling' : 'rising';
  else if (after)      state = after.type  === 'H' ? 'rising'  : 'falling';

  /* Interpolated height at session start */
  var interpH = null;
  if (before && after) {
    var frac = (startMins - before.mins) / (after.mins - before.mins);
    interpH = Math.round((before.h + frac * (after.h - before.h)) * 10) / 10;
  } else if (before) interpH = before.h;

  /* Named events */
  function lastBefore(type) { return events.filter(function(e){return e.type===type&&e.mins<=startMins;}).slice(-1)[0]||null; }
  function firstAfter(type) { return events.filter(function(e){return e.type===type&&e.mins>startMins;})[0]||null; }

  return {
    state:       state,
    interpH:     interpH,
    prevHigh:    lastBefore('H'),
    nextHigh:    firstAfter('H'),
    prevLow:     lastBefore('L'),
    nextLow:     firstAfter('L'),
    midLat:      session.midLat || session.startLat,
    midLon:      session.midLon || session.startLon,
  };
}

/* Populate _tide for all sessions synchronously — no fetch needed */
function computeAllTides() {
  SESSIONS.forEach(function(s) {
    if (!s._tide || s._tide.error) {
      try { s._tide = computeTidesForSession(s); }
      catch(e) { s._tide = { error: true }; }
    }
  });
}

/* ── Tide direction note ── */
function tideFlowNote(state) {
  if (state === 'rising')
    return 'Water is <b>flooding in toward shore</b> (rising tide). Paddling outbound (away from harbour) meets resistance from the incoming flow. Returning to shore is easier — you\'re with the current.';
  if (state === 'falling')
    return 'Water is <b>ebbing out to sea</b> (falling tide). Paddling outbound is with the flow — faster. Returning to shore meets resistance from the outgoing current.';
  return 'Tide state uncertain at session start time.';
}

function tideIcon(state) {
  return state === 'rising' ? '📈' : state === 'falling' ? '📉' : '〰️';
}

/* ── Render tide card ── */
function renderTideCard(session) {
  var tide = session._tide;
  var html = '<div class="card">';
  html += '<div class="ct-title">🌊 Tides at Session</div>';

  var locLabel = (session.midLat && session.midLon)
    ? 'Session midpoint: ' + session.midLat.toFixed(3) + '°N, ' + Math.abs(session.midLon).toFixed(3) + '°W'
    : 'Santa Cruz area';
  html += '<div class="ct-sub">NOAA constituents · station 9413745 Santa Cruz · ' + locLabel + '</div>';

  if (!tide || tide.error) {
    html += '<div class="notice n-butter" style="margin-bottom:0">⚠️ Could not compute tide data for this session.</div>';
    html += '</div>';
    return html;
  }

  var sc = tide.state === 'rising' ? '#2e7a4a' : tide.state === 'falling' ? '#a03060' : 'var(--gm)';
  var stateLabel = tide.state === 'rising' ? 'Rising (flooding in)' : tide.state === 'falling' ? 'Falling (ebbing out)' : 'Slack';

  html += '<div class="sg g3" style="margin-bottom:12px">';

  /* State */
  html += '<div class="sc" style="border-color:'+sc+'44">';
  html += '<div class="sl" style="color:'+sc+'">'+tideIcon(tide.state)+' Tide at session start</div>';
  html += '<div style="font-size:18px;font-weight:900;color:'+sc+'">'+stateLabel+'</div>';
  if (tide.interpH !== null)
    html += '<div class="sn" style="margin-top:4px;font-size:11px">~'+tide.interpH.toFixed(1)+' ft above MLLW</div>';
  html += '</div>';

  /* Highs */
  html += '<div class="sc">';
  html += '<div class="sl" style="color:var(--plum)">🔺 High tides</div>';
  if (tide.prevHigh) html += '<div style="margin-bottom:5px"><span style="font-weight:900;color:var(--plum);font-size:16px">'+tide.prevHigh.h.toFixed(1)+' ft</span> <span style="font-size:11px;color:var(--gm)">'+tide.prevHigh.timeStr+' (before)</span></div>';
  if (tide.nextHigh) html += '<div><span style="font-weight:900;color:var(--plum);font-size:16px">'+tide.nextHigh.h.toFixed(1)+' ft</span> <span style="font-size:11px;color:var(--gm)">'+tide.nextHigh.timeStr+' (next)</span></div>';
  if (!tide.prevHigh && !tide.nextHigh) html += '<div class="sn">No high tide on this day</div>';
  html += '</div>';

  /* Lows */
  html += '<div class="sc">';
  html += '<div class="sl" style="color:var(--gm)">🔻 Low tides</div>';
  if (tide.prevLow) html += '<div style="margin-bottom:5px"><span style="font-weight:900;color:var(--gt);font-size:16px">'+tide.prevLow.h.toFixed(1)+' ft</span> <span style="font-size:11px;color:var(--gm)">'+tide.prevLow.timeStr+' (before)</span></div>';
  if (tide.nextLow) html += '<div><span style="font-weight:900;color:var(--gt);font-size:16px">'+tide.nextLow.h.toFixed(1)+' ft</span> <span style="font-size:11px;color:var(--gm)">'+tide.nextLow.timeStr+' (next)</span></div>';
  if (!tide.prevLow && !tide.nextLow) html += '<div class="sn">No low tide on this day</div>';
  html += '</div>';

  html += '</div>';

  var noteBg = tide.state==='rising'?'var(--blush)':tide.state==='falling'?'var(--mint)':'var(--lilac)';
  html += '<div style="background:'+noteBg+';border-radius:10px;padding:11px 14px;font-size:12px;font-weight:700;color:var(--ink);line-height:1.7">';
  html += tideIcon(tide.state)+' <b>Current direction:</b> ';
  html += tideFlowNote(tide.state);
  html += '</div></div>';
  return html;
}

function tideCell(session) {
  var t = session._tide;
  if (!t || t.error) return '—';
  return tideIcon(t.state)+' '+(t.state==='rising'?'Rising':t.state==='falling'?'Falling':'?')
    +(t.interpH!==null?' '+t.interpH.toFixed(1)+'ft':'');
}

/* ═══════════════════════════════════════════
   DATE FILTER
═══════════════════════════════════════════ */
var FILTER_FROM = null;
var FILTER_TO   = null;

function filteredSessions() {
  return SESSIONS.filter(function(s) {
    if (FILTER_FROM && s.date < FILTER_FROM) return false;
    if (FILTER_TO   && s.date > FILTER_TO)   return false;
    return true;
  });
}

function renderDateFilter() {
  var ss = SESSIONS.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  if (ss.length < 2) return '';
  function toInput(d){ return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8); }
  var earliest = toInput(ss[0].date), latest = toInput(ss[ss.length-1].date);
  var active = FILTER_FROM || FILTER_TO;
  var showing = filteredSessions().length;

  var html = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;'
    +'background:var(--lilac2);border:1.5px solid var(--lav-lt);border-radius:12px;'
    +'padding:10px 14px;margin-bottom:16px">';
  html += '<span style="font-size:11px;font-weight:800;color:var(--plum);white-space:nowrap">📅 Filter by date</span>';
  html += '<label style="font-size:10px;font-weight:700;color:var(--gm)">From</label>';
  html += '<input type="date" id="filter-from" value="'+(FILTER_FROM?toInput(FILTER_FROM):'')+'"'
    +' min="'+earliest+'" max="'+latest+'" onchange="applyDateFilter()"'
    +' style="font-family:var(--font);font-size:11px;font-weight:700;padding:5px 8px;border-radius:8px;border:1.5px solid var(--lav);background:var(--white);color:var(--ink);cursor:pointer">';
  html += '<label style="font-size:10px;font-weight:700;color:var(--gm)">To</label>';
  html += '<input type="date" id="filter-to" value="'+(FILTER_TO?toInput(FILTER_TO):'')+'"'
    +' min="'+earliest+'" max="'+latest+'" onchange="applyDateFilter()"'
    +' style="font-family:var(--font);font-size:11px;font-weight:700;padding:5px 8px;border-radius:8px;border:1.5px solid var(--lav);background:var(--white);color:var(--ink);cursor:pointer">';
  html += '<span style="font-size:10px;font-weight:700;color:'+(active?'var(--plum)':'var(--gm)')+'">Showing '+showing+' of '+ss.length+' sessions</span>';
  if (active) {
    html += '<button onclick="clearDateFilter()" style="font-family:var(--font);font-size:10px;font-weight:800;'
      +'padding:4px 10px;border-radius:999px;border:1.5px solid var(--blush-dk);background:var(--blush);color:#8a3055;cursor:pointer">✕ Clear</button>';
  }
  html += '</div>';
  return html;
}

function applyDateFilter() {
  var f = document.getElementById('filter-from');
  var t = document.getElementById('filter-to');
  FILTER_FROM = f && f.value ? f.value.replace(/-/g,'') : null;
  FILTER_TO   = t && t.value ? t.value.replace(/-/g,'') : null;
  render();
}
function clearDateFilter() { FILTER_FROM = null; FILTER_TO = null; render(); }





/* ═══════════════════════════════════════════════════════════
   WEEKLY PLAN — Manual form editor, no image recognition.
   Each week's plan stored under 'clubby_weekly_plans'.
   getFocus() checks the session's week plan first, then
   falls back to the base PROGRAM definition.
═══════════════════════════════════════════════════════════ */

var PLAN_KEY    = 'clubby_weekly_plans';
var WEEKLY_PLANS = {};
var DOW_NAMES   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var ACTIVE_PLAN_WEEK = null;  // which week is open in the editor

/* Focus options the user can pick from */
var FOCUS_OPTIONS = [
  { id:'',               label:'— Rest / no session —',     icon:'',   bungee:false },
  { id:'intervals',      label:'Z2 Intervals',               icon:'⚡', bungee:false },
  { id:'easy',           label:'Easy Paddle',                icon:'🌿', bungee:false },
  { id:'bungee',         label:'Bungee Resistance',          icon:'🔴', bungee:true  },
  { id:'long-z2',        label:'Long Z2 / Downwind',         icon:'🌊', bungee:false },
  { id:'easy-benchmark', label:'Easy + Z3 Benchmark',        icon:'😌', bungee:false },
  { id:'race',           label:'Race',                       icon:'🏆', bungee:false },
  { id:'gym',            label:'Gym / Cross-training',       icon:'🏋️', bungee:false },
];

/* Days shown in the editor — only paddling days */
var PLAN_DAYS = [
  { dow:1, name:'Monday'    },
  { dow:2, name:'Tuesday'   },
  { dow:3, name:'Wednesday' },
  { dow:4, name:'Thursday'  },
  { dow:5, name:'Friday'    },
  { dow:6, name:'Saturday'  },
  { dow:0, name:'Sunday'    },
];

/* ── ISO week key ── */
function isoWeek(dateStr) {
  var y = +dateStr.slice(0,4), m = +dateStr.slice(4,6)-1, d = +dateStr.slice(6,8);
  var date  = new Date(y,m,d);
  var jan4  = new Date(date.getFullYear(), 0, 4);
  var start = new Date(jan4);
  start.setDate(jan4.getDate() - ((jan4.getDay()+6)%7));
  var wn = Math.floor(((date - start)/86400000 + 1)/7) + 1;
  return date.getFullYear() + 'W' + String(wn).padStart(2,'0');
}

function weekMonday(isoKey) {
  /* Return the Monday date string for display */
  var y = +isoKey.slice(0,4), wn = +isoKey.slice(5);
  var jan4 = new Date(y, 0, 4);
  var mon  = new Date(jan4);
  mon.setDate(jan4.getDate() - ((jan4.getDay()+6)%7) + (wn-1)*7);
  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mo[mon.getMonth()] + ' ' + mon.getDate() + ', ' + mon.getFullYear();
}

function loadWeeklyPlans() {
  try {
    var raw = _store[PLAN_KEY];
    if (raw) WEEKLY_PLANS = typeof raw === 'string' ? JSON.parse(raw) : raw;
    else WEEKLY_PLANS = {};
  } catch(e) { WEEKLY_PLANS = {}; }
}

function buildFocusFromDay(day, dow) {
  /* Build a focus object compatible with what the rest of the app expects */
  var base = PROGRAM[dow] || {};
  var opt  = FOCUS_OPTIONS.filter(function(o){ return o.id === day.id; })[0] || {};
  return {
    id:         day.id,
    label:      DOW_NAMES[dow] + ' · ' + (opt.label || day.id),
    shortLabel: opt.label || day.id,
    icon:       opt.icon  || base.icon  || '📅',
    color:      (FOCUS_STYLES[day.id]||{}).color   || base.color   || '#9b8bb8',
    colorLt:    (FOCUS_STYLES[day.id]||{}).colorLt || base.colorLt || '#f0eaf9',
    bungee:     opt.bungee   || false,
    srTargets:  day.srTargets || null,
    desc:       day.desc || '',
    note:       null,
  };
}

/* ── Render the Plans page ── */
function renderPlansPage(el) {
  var weeks  = Object.keys(WEEKLY_PLANS).sort().reverse();
  var html = '<div class="view"><div class="pt">📋 Weekly Plans</div>'
    + '<div class="ps">Set the workout schedule for each week. Sessions are automatically tagged by day — no manual tagging needed.</div>';

  /* Add new week button */
  html += renderUserPrefs();
  html += '<div style="display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap">';
  html += '<button onclick="openNewPlan()" style="font-family:var(--font);font-size:12px;font-weight:800;'
        + 'padding:10px 20px;border-radius:var(--r-pill);border:none;background:var(--lav);color:var(--plum);cursor:pointer">'
        + '＋ Add week plan</button>';
  if (weeks.length) {
    html += '<span style="font-size:11px;font-weight:600;color:var(--gm)">'
          + weeks.length + ' week' + (weeks.length>1?'s':'') + ' saved</span>';
  }
  html += '</div>';

  /* Editor slot (shown when adding/editing) */
  html += '<div id="plan-editor-slot"></div>';

  /* Saved plans list */
  if (weeks.length) {
    weeks.forEach(function(wk) {
      html += renderPlanCard(wk, WEEKLY_PLANS[wk]);
    });
  } else {
    html += '<div class="notice n-purple">No weekly plans saved yet. Click <b>Add week plan</b> to set up your first week.</div>';
  }

  html += '</div>';
  el.innerHTML = html;

  /* If a plan was being edited, re-open it */
  if (ACTIVE_PLAN_WEEK) openPlanEditor(ACTIVE_PLAN_WEEK);
}

function renderPlanCard(wk, plan) {
  var days = plan.days || {};
  var dayOrder = [1,2,3,4,5,6,0];
  var html = '<div class="card" id="plan-card-'+wk+'">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">';
  html += '<div>';
  html += '<div style="font-size:14px;font-weight:900;color:var(--plum)">Week of ' + weekMonday(wk) + '</div>';
  html += '<div style="font-size:10px;font-weight:600;color:var(--gm)">' + wk + '</div>';
  html += '</div>';
  html += '<div style="display:flex;gap:8px">';
  html += '<button onclick="openPlanEditor(\''+wk+'\')" style="font-family:var(--font);font-size:11px;font-weight:800;padding:5px 14px;border-radius:var(--r-pill);border:1.5px solid var(--lav-md);background:var(--lav-lt);color:var(--plum);cursor:pointer">✏️ Edit</button>';
  html += '<button onclick="deletePlan(\''+wk+'\')" style="font-family:var(--font);font-size:11px;font-weight:800;padding:5px 14px;border-radius:var(--r-pill);border:1.5px solid var(--blush-dk);background:var(--blush);color:#8a3055;cursor:pointer">Remove</button>';
  html += '</div></div>';

  /* Day tiles */
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">';
  dayOrder.forEach(function(dow) {
    var day = days[dow];
    var dayName = DOW_NAMES[dow];
    if (!day || !day.id) {
      html += '<div style="background:var(--cloud);border:1.5px dashed var(--lav-lt);border-radius:8px;padding:10px 12px;opacity:.5">';
      html += '<div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--gm)">' + dayName + '</div>';
      html += '<div style="font-size:11px;font-weight:600;color:var(--gm);margin-top:2px">Rest</div>';
      html += '</div>';
      return;
    }
    var base = PROGRAM[dow] || {};
    var opt  = FOCUS_OPTIONS.filter(function(o){ return o.id===day.id; })[0] || {};
    var col  = base.color   || '#9b8bb8';
    var colLt = base.colorLt || '#f0eaf9';
    html += '<div style="background:'+colLt+';border:1.5px solid '+col+'44;border-radius:8px;padding:10px 12px">';
    html += '<div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:'+col+'">' + dayName + '</div>';
    html += '<div style="font-size:12px;font-weight:800;color:var(--ink);margin-top:2px">' + (opt.icon||'') + ' ' + escHtml(opt.label||day.id) + '</div>';
    if (day.desc) html += '<div style="font-size:10px;font-weight:600;color:var(--gt);margin-top:3px;line-height:1.4">' + escHtml(day.desc.slice(0,80)) + (day.desc.length>80?'…':'') + '</div>';
    if (opt.bungee) html += '<div style="font-size:9px;font-weight:800;color:#f5a623;margin-top:2px">🔴 bungee</div>';
    if (day.srTargets) html += '<div style="font-size:9px;font-weight:700;color:var(--gm);margin-top:2px">SR: ' + day.srTargets.easy + '/' + day.srTargets.hard + ' spm</div>';
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

/* ── Editor ── */
function openNewPlan() {
  /* Default to current week */
  var now = new Date();
  var ds  = now.getFullYear()
          + String(now.getMonth()+1).padStart(2,'0')
          + String(now.getDate()).padStart(2,'0');
  ACTIVE_PLAN_WEEK = isoWeek(ds);
  openPlanEditor(ACTIVE_PLAN_WEEK);
}

function openPlanEditor(wk) {
  ACTIVE_PLAN_WEEK = wk;
  var slot = document.getElementById('plan-editor-slot');
  if (!slot) return;
  var plan = WEEKLY_PLANS[wk] || { days: {} };

  /* Week selector */
  /* Build a list of week options: current week ±8 weeks */
  var now = new Date();
  var weekOptions = '';
  for (var delta = -4; delta <= 8; delta++) {
    var d = new Date(now);
    d.setDate(d.getDate() - d.getDay() + 1 + delta*7);  /* Monday */
    var ds2 = d.getFullYear()
            + String(d.getMonth()+1).padStart(2,'0')
            + String(d.getDate()).padStart(2,'0');
    var wk2 = isoWeek(ds2);
    var lbl = 'Week of ' + weekMonday(wk2) + (delta===0?' (this week)':delta<0?' (past)':' (upcoming)');
    weekOptions += '<option value="'+wk2+'"'+(wk2===wk?' selected':'')+'>'+lbl+'</option>';
  }

  var html = '<div class="card" style="border-color:var(--lav-md);margin-bottom:16px">';
  html += '<div class="ct-title" style="margin-bottom:2px">✏️ ' + (WEEKLY_PLANS[wk] ? 'Edit' : 'New') + ' week plan</div>';

  /* Week picker */
  html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">';
  html += '<label style="font-size:11px;font-weight:800;color:var(--plum)">Week:</label>';
  html += '<select id="plan-week-select" onchange="switchPlanWeek(this.value)" style="font-family:var(--font);font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;border:1.5px solid var(--lav);background:var(--white);color:var(--ink)">';
  html += weekOptions + '</select>';
  html += '</div>';

  /* Day rows */
  html += '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">';
  PLAN_DAYS.forEach(function(d) {
    var day = (plan.days||{})[d.dow] || {};
    var focusOpts = FOCUS_OPTIONS.map(function(o) {
      return '<option value="'+o.id+'"'+(o.id===day.id?' selected':'')+'>'+o.icon+' '+o.label+'</option>';
    }).join('');

    html += '<div style="display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:start;padding:10px 12px;background:var(--lilac2);border-radius:10px;border:1.5px solid var(--lav-lt)">';
    html += '<div style="font-size:12px;font-weight:800;color:var(--ink);padding-top:6px">' + d.name + '</div>';
    html += '<div style="display:flex;flex-direction:column;gap:6px">';

    /* Focus type dropdown */
    html += '<select data-dow="'+d.dow+'" data-field="id" onchange="updatePlanDay(this)" '
          + 'style="font-family:var(--font);font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;border:1.5px solid var(--lav);background:var(--white);color:var(--ink)">'
          + focusOpts + '</select>';

    /* Description textarea — only shown if not rest */
    var isRest = !day.id;
    html += '<textarea data-dow="'+d.dow+'" data-field="desc" onchange="updatePlanDay(this)" '
          + 'placeholder="Session description, e.g. 70 min · 3×10 min bungee sets · Z2–Z3" rows="2" '
          + (isRest ? 'style="display:none;' : 'style="')
          + 'font-family:var(--font);font-size:11px;font-weight:600;padding:7px 10px;border-radius:8px;'
          + 'border:1.5px solid var(--lav);background:var(--white);color:var(--ink);resize:vertical;width:100%;box-sizing:border-box">'
          + escHtml(day.desc||'') + '</textarea>';

    /* SR targets (optional) — only for interval-type sessions */
    var showSR = (day.id==='intervals');
    html += '<div data-dow="'+d.dow+'" data-srrow="1" style="display:'+(showSR?'flex':'none')+';align-items:center;gap:6px;flex-wrap:wrap">';
    html += '<span style="font-size:10px;font-weight:700;color:var(--gm)">SR targets:</span>';
    html += '<input type="text" data-dow="'+d.dow+'" data-field="sr_easy" onchange="updatePlanDay(this)" '
          + 'placeholder="easy (e.g. 36)" value="'+escHtml(day.srTargets?String(day.srTargets.easy):'')+'" '
          + 'style="font-family:var(--font);font-size:11px;padding:4px 8px;border-radius:6px;border:1.5px solid var(--lav);width:90px">';
    html += '<span style="font-size:10px;font-weight:700;color:var(--gm)">/</span>';
    html += '<input type="text" data-dow="'+d.dow+'" data-field="sr_hard" onchange="updatePlanDay(this)" '
          + 'placeholder="hard (e.g. 40-42)" value="'+escHtml(day.srTargets?String(day.srTargets.hard):'')+'" '
          + 'style="font-family:var(--font);font-size:11px;padding:4px 8px;border-radius:6px;border:1.5px solid var(--lav);width:90px">';
    html += '</div>';

    html += '</div></div>';
  });
  html += '</div>';

  /* Save / Cancel buttons */
  html += '<div style="display:flex;gap:10px">';
  html += '<button onclick="savePlanFromEditor()" style="font-family:var(--font);font-size:12px;font-weight:800;padding:10px 24px;border-radius:var(--r-pill);border:none;background:var(--plum);color:var(--white);cursor:pointer">💾 Save plan</button>';
  html += '<button onclick="closePlanEditor()" style="font-family:var(--font);font-size:12px;font-weight:800;padding:10px 24px;border-radius:var(--r-pill);border:1.5px solid var(--lav);background:var(--white);color:var(--plum);cursor:pointer">Cancel</button>';
  if (WEEKLY_PLANS[wk]) {
    html += '<button onclick="deletePlan(\''+wk+'\')" style="font-family:var(--font);font-size:12px;font-weight:800;padding:10px 24px;border-radius:var(--r-pill);border:1.5px solid var(--blush-dk);background:var(--blush);color:#8a3055;cursor:pointer;margin-left:auto">Remove this week</button>';
  }
  html += '</div>';
  html += '</div>';
  slot.innerHTML = html;

  /* Scroll editor into view */
  slot.scrollIntoView({ behavior:'smooth', block:'start' });
}

function switchPlanWeek(newWk) {
  ACTIVE_PLAN_WEEK = newWk;
  openPlanEditor(newWk);
}

function updatePlanDay(el) {
  var dow   = +el.dataset.dow;
  var field = el.dataset.field;
  var val   = el.value;
  var plan  = WEEKLY_PLANS[ACTIVE_PLAN_WEEK] || { days:{} };
  if (!plan.days) plan.days = {};
  if (!plan.days[dow]) plan.days[dow] = {};

  if (field === 'id') {
    plan.days[dow].id = val;
    /* Show/hide desc textarea and SR row */
    var allDesc = document.querySelectorAll('textarea[data-dow="'+dow+'"]');
    var allSR   = document.querySelectorAll('[data-srrow][data-dow="'+dow+'"]');
    allDesc.forEach(function(t){ t.style.display = val ? '' : 'none'; });
    allSR.forEach(function(r){ r.style.display = (val==='intervals') ? 'flex' : 'none'; });
  } else if (field === 'desc') {
    plan.days[dow].desc = val;
  } else if (field === 'sr_easy') {
    if (!plan.days[dow].srTargets) plan.days[dow].srTargets = {};
    plan.days[dow].srTargets.easy = isNaN(+val) ? val : +val;
  } else if (field === 'sr_hard') {
    if (!plan.days[dow].srTargets) plan.days[dow].srTargets = {};
    plan.days[dow].srTargets.hard = val;
  }

  /* Remove day entirely if set back to rest */
  if (field === 'id' && !val) {
    delete plan.days[dow];
  }

  WEEKLY_PLANS[ACTIVE_PLAN_WEEK] = plan;
}

function savePlanFromEditor() {
  var wk   = ACTIVE_PLAN_WEEK;
  var plan = WEEKLY_PLANS[wk] || { days:{} };
  /* Read all current field values from DOM */
  document.querySelectorAll('[data-dow][data-field]').forEach(function(el) {
    updatePlanDay(el);
  });
  plan = WEEKLY_PLANS[wk] || { days:{} };
  /* Remove days with empty id */
  Object.keys(plan.days||{}).forEach(function(dow) {
    if (!plan.days[dow] || !plan.days[dow].id) delete plan.days[dow];
  });
  WEEKLY_PLANS[wk] = plan;
  saveWeeklyPlans();
  closePlanEditor();
  refresh();
  showToast('📋 Plan saved for week of ' + weekMonday(wk), 'success');
}

function closePlanEditor() {
  ACTIVE_PLAN_WEEK = null;
  var slot = document.getElementById('plan-editor-slot');
  if (slot) slot.innerHTML = '';
}

function deletePlan(wk) {
  if (!confirm('Remove plan for week of ' + weekMonday(wk) + '?')) return;
  delete WEEKLY_PLANS[wk];
  saveWeeklyPlans();
  ACTIVE_PLAN_WEEK = null;
  refresh();
}



/* ── Mobile helpers ── */
var _mobSessOpen = false;

function mobSelSess(date){ selSess(date); toggleMobSessions(); }
function toggleMobSessions() {
  _mobSessOpen = !_mobSessOpen;
  var drawer = document.getElementById('mob-sess-drawer');
  if (drawer) drawer.style.display = _mobSessOpen ? 'block' : 'none';
  /* Populate the mobile session list */
  if (_mobSessOpen) {
    var listEl = document.getElementById('mob-sess-list');
    if (listEl) {
      var h = '';
      SESSIONS.slice().reverse().forEach(function(s) {
        var f = getFocus(s); var fc = f ? f.color : '#9b8bb8';
        var active = (SEL===s.date && PAGE==='session') ? 'active' : '';
        h += '<div class="si '+active+'" data-date="'+s.date+'" onclick="mobSelSess(this.dataset.date)">'
           + '<span class="si-spd" style="color:'+fc+'">'+s.avgSpeed.toFixed(2)+'</span>'
           + '<div class="si-date">'+dateLabel(s.date)+'</div>'
           + '<div class="si-meta">'+(f?f.icon+' '+f.shortLabel:s.sessionType)+'</div>'
           + '</div>';
      });
      listEl.innerHTML = h;
    }
  }
}

/* Sync mobile bottom nav active state */
function updateMobNav() {
  document.querySelectorAll('.mob-nb').forEach(function(b) {
    b.classList.toggle('active', b.dataset.page === PAGE);
  });
  /* __sessions button active when drawer open */
  var sessBtn = document.querySelector('.mob-nb[data-page="__sessions"]');
  if (sessBtn) sessBtn.classList.toggle('active', _mobSessOpen);
}

/* Close sessions drawer on outside tap */
document.addEventListener('click', function(e) {
  if (!_mobSessOpen) return;
  var drawer = document.getElementById('mob-sess-drawer');
  var btn    = document.querySelector('.mob-nb[data-page="__sessions"]');
  if (drawer && !drawer.contains(e.target) && btn && !btn.contains(e.target)) {
    _mobSessOpen = false;
    drawer.style.display = 'none';
    updateMobNav();
  }
});

/* Patch nav() and selSess() to also update mobile nav */
var _navBase = nav;
nav = function(p) {
  _mobSessOpen = false;
  var d = document.getElementById('mob-sess-drawer');
  if (d) d.style.display = 'none';
  _navBase(p);
  updateMobNav();
};

var _selSessBase = selSess;
selSess = function(date) {
  _selSessBase(date);
  updateMobNav();
};











/* ══════════════════════════════════════════════════
   CRAFT TYPES + RACE FOCUS
══════════════════════════════════════════════════ */
var PREFS_KEY  = 'clubby_prefs';
var CRAFTS_KEY = 'clubby_crafts';

var CRAFT_OPTIONS = ['OC1','SS1','OC2','SS2','OC6'];

var USER_PREFS     = { defaultCraft: 'OC1' };
var SESSION_CRAFTS = {};

/* Focus colour palette for non-PROGRAM types (race, gym, etc.) */
var FOCUS_STYLES = {
  'race':          { color:'#c0406a', colorLt:'#fce8ef', icon:'\U0001f3c6' },
  'gym':           { color:'#7a6a50', colorLt:'#f5f0e8', icon:'\U0001f3cb\ufe0f' },
  'easy':          { color:'#5cb87a', colorLt:'#d4eedf', icon:'\U0001f33f' },
  'bungee':        { color:'#f5a623', colorLt:'#fef3dc', icon:'\U0001f534' },
  'long-z2':       { color:'#9bbdd4', colorLt:'#daeef8', icon:'\U0001f30a' },
  'intervals':     { color:'#7c6fa0', colorLt:'#ede8f7', icon:'\u26a1' },
  'easy-benchmark':{ color:'#c08bc0', colorLt:'#f5e6f5', icon:'\U0001f60c' },
};

function loadPrefs() {
  try {
    var raw = _store[PREFS_KEY];
    if (raw) USER_PREFS = typeof raw === 'string' ? JSON.parse(raw) : raw;
  } catch(e) {}
}

function savePrefs() {
  _store[PREFS_KEY] = USER_PREFS;
  sbScheduleWrite(PREFS_KEY, USER_PREFS);
}

function loadSessionCrafts() {
  try {
    var raw = _store[CRAFTS_KEY];
    if (raw) SESSION_CRAFTS = typeof raw === 'string' ? JSON.parse(raw) : raw;
  } catch(e) {}
}

function saveSessionCrafts() {
  _store[CRAFTS_KEY] = SESSION_CRAFTS;
  sbScheduleWrite(CRAFTS_KEY, SESSION_CRAFTS);
}

function getCraft(session) {
  return SESSION_CRAFTS[session.date] || USER_PREFS.defaultCraft || 'OC1';
}

function setSessionCraft(date, craft) {
  if (!craft || craft === (USER_PREFS.defaultCraft || 'OC1')) {
    delete SESSION_CRAFTS[date];
  } else {
    SESSION_CRAFTS[date] = craft;
  }
  saveSessionCrafts();
  refresh();
}

function setDefaultCraft(craft) {
  USER_PREFS.defaultCraft = craft;
  savePrefs();
  showToast('\U0001f6f6 Default craft set to ' + craft, 'success');
}

function renderCraftSelector(session) {
  var current = getCraft(session);
  var isOv = !!SESSION_CRAFTS[session.date];
  var date = session.date;
  var opts = CRAFT_OPTIONS.map(function(c){
    return '<option value="'+c+'"'+(c===current?' selected':'')+'>'+c+'</option>';
  }).join('');
  var ovPart = isOv
    ? '<span style="font-size:10px;font-weight:700;color:#f5a623">\u26a1 overridden</span>'
      +'<button id="craft-rst-'+date+'" style="font-family:var(--font);font-size:10px;font-weight:700;'
      +'padding:3px 8px;border-radius:999px;border:1.5px solid var(--lav);background:var(--white);'
      +'color:var(--gm);cursor:pointer">Reset to default</button>'
    : '<span style="font-size:10px;font-weight:600;color:var(--gm)">default</span>';
  setTimeout(function(){
    var sel=document.getElementById('craft-sel-'+date);
    if(sel) sel.onchange=function(){ setSessionCraft(date,this.value); };
    var rst=document.getElementById('craft-rst-'+date);
    if(rst) rst.onclick=function(){ setSessionCraft(date,''); };
  },0);
  return '<div style="display:flex;align-items:center;gap:10px;background:var(--lilac2);'
    +'border:1.5px solid var(--lav-lt);border-radius:10px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap">'
    +'<span style="font-size:11px;font-weight:800;color:var(--plum)">\U0001f6f6 Craft:</span>'
    +'<select id="craft-sel-'+date+'" style="font-family:var(--font);font-size:12px;font-weight:700;'
    +'padding:5px 10px;border-radius:8px;border:1.5px solid var(--lav);background:var(--white);color:var(--ink)">'
    +opts+'</select>'+ovPart+'</div>';
}

function renderUserPrefs() {
  var craft = USER_PREFS.defaultCraft || 'OC1';
  var craftOpts = CRAFT_OPTIONS.map(function(c){
    return '<option value="'+c+'"'+(c===craft?' selected':'')+'>'+c+'</option>';
  }).join('');
  setTimeout(function(){
    var sel=document.getElementById('default-craft-sel');
    if(sel) sel.onchange=function(){ setDefaultCraft(this.value); };
  },0);
  return '<div class="card">'
    +'<div class="ct-title">\u2699\ufe0f Your Preferences</div>'
    +'<div class="ct-sub">Defaults applied to all sessions unless overridden per-session.</div>'
    +'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
    +'<span style="font-size:12px;font-weight:800;color:var(--plum)">\U0001f6f6 Default craft:</span>'
    +'<select id="default-craft-sel" style="font-family:var(--font);font-size:12px;font-weight:700;'
    +'padding:7px 12px;border-radius:8px;border:1.5px solid var(--lav);background:var(--white);color:var(--ink)">'
    +craftOpts+'</select>'
    +'<span style="font-size:11px;font-weight:600;color:var(--gm)">Applied to all sessions without a per-session override.</span>'
    +'</div></div>';
}


</script>
