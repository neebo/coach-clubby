/* ═══════════════════════════════════════════════════════════
   DRAG-AND-DROP CARD REORDERING
   
   Applies to session detail cards only.
   Order persisted per-user under LAYOUT_KEY in Supabase.
   
   Default order:
     legs | tide | weather | notes | speed | intervals
   
   Mobile: touch-based drag with long-press activation.
   Desktop: mouse drag with handle icon.
═══════════════════════════════════════════════════════════ */

var LAYOUT_KEY   = 'clubby_layout';
var CARD_ORDER   = null;   /* loaded from storage — null means default */

var CARD_DEFS = [
  { id: 'legs',      label: 'Legs / Downwind',  icon: '🚣' },
  { id: 'tide',      label: 'Tide',              icon: '🌊' },
  { id: 'weather',   label: 'Weather',           icon: '🌤️' },
  { id: 'notes',     label: 'Notes',             icon: '📝' },
  { id: 'speed',     label: 'Speed Profile',     icon: '📈' },
  { id: 'intervals', label: 'Intervals',         icon: '⚡' },
];

function defaultCardOrder() {
  return CARD_DEFS.map(function(c) { return c.id; });
}

function getCardOrder() {
  return CARD_ORDER || defaultCardOrder();
}

function loadLayout() {
  try {
    var raw = _store[LAYOUT_KEY];
    if (raw) {
      var stored = typeof raw === 'string' ? JSON.parse(raw) : raw;
      /* Validate — only keep known card ids, append any new ones at end */
      var known  = defaultCardOrder();
      var valid  = stored.filter(function(id) { return known.indexOf(id) >= 0; });
      var missing = known.filter(function(id) { return valid.indexOf(id) < 0; });
      CARD_ORDER = valid.concat(missing);
    }
  } catch(e) { CARD_ORDER = null; }
}

function saveLayout() {
  _store[LAYOUT_KEY] = CARD_ORDER;
  sbScheduleWrite(LAYOUT_KEY, CARD_ORDER);
}

/* ── Render all session cards in the stored order ── */
function renderSessionCards(s, containerEl) {
  var order = getCardOrder();
  var __f   = getFocus(s);
  var isDownwind = __f && __f.id === 'long-z2';

  /* Build each card's HTML */
  function cardHTML(id) {
    switch(id) {
      case 'legs':
        return isDownwind ? renderDownwindCard(s) : renderLegsCard(s);
      case 'tide':
        return renderTideCard(s);
      case 'weather':
        return renderWeatherCard(s);
      case 'notes':
        return renderNotesEditor(s);
      case 'speed':
        return '<div class="card dnd-card" data-card-id="speed">'
          + '<div class="ct-title">Speed profile</div>'
          + '<div class="ct-sub">Per-stroke speed · interval dividers'
          + (s.hasHR ? ' · ♥ HR' : '') + '</div>'
          + '<canvas id="sc" height="175"></canvas>'
          + '</div>';
      case 'intervals':
        if (!s.intervals || s.intervals.length < 2) return '';
        return buildIntervalsTable(s);
      default: return '';
    }
  }

  /* Clear container and re-render in order */
  containerEl.innerHTML = '';
  order.forEach(function(id) {
    var h = cardHTML(id);
    if (!h) return;
    var wrap = document.createElement('div');
    wrap.className  = 'dnd-card-wrap';
    wrap.dataset.cardId = id;
    wrap.innerHTML  = addDragHandle(h);
    containerEl.appendChild(wrap);
  });

  /* Draw chart after render */
  setTimeout(function() { drawSessChart(s); }, 30);

  /* Attach drag behaviour */
  attachDragHandlers(containerEl, s);
}

/* Wrap card HTML with a drag handle */
function addDragHandle(cardHTML) {
  /* Inject drag handle as first child of .card */
  return cardHTML.replace(
    /(<div class="card[^"]*")/,
    '$1 style="position:relative"'
  ).replace(
    /(<div class="ct-title")/,
    '<div class="drag-handle" title="Drag to reorder">⠿</div><div class="ct-title"'
  );
}

/* ── Build intervals table (extracted from renderSession) ── */
function buildIntervalsTable(s) {
  var html = '<div class="card dnd-card" data-card-id="intervals">';
  html += '<div class="ct-title">Intervals</div>';
  html += '<div class="tw" style="margin-bottom:0"><table>';
  html += '<tr><th>#</th><th>Dist</th><th>Elapsed</th><th>Split</th><th>Speed</th><th>SR</th>';
  if (s.hasHR) html += '<th>HR</th>';
  html += '<th>Perf</th></tr>';
  s.intervals.forEach(function(iv) {
    var maxV  = Math.max.apply(null, s.intervals.map(function(x){ return x.v||0; }));
    var w     = ((iv.v||0)/maxV*100).toFixed(0);
    var col   = iv.v>5?'var(--mint-dk)':iv.v>4.5?'var(--plum)':'#c0406a';
    var flag  = s.date==='20260507' && iv.n==='2';
    html += '<tr'+(flag?' style="opacity:.55"':'')+'>'+
      '<td style="color:var(--gm)">'+iv.n+(flag?' ⚠️':'')+'</td>'+
      '<td>'+iv.d.toFixed(2)+' mi</td>'+
      '<td>'+(iv.el||'').split('.')[0]+'</td>'+
      '<td style="color:var(--gm)">'+(iv.sp||'—')+'</td>'+
      '<td class="td-spd">'+iv.v.toFixed(2)+'</td>'+
      '<td>'+iv.sr.toFixed(0)+' spm</td>'+
      (s.hasHR?'<td class="td-hr">'+(iv.hr?iv.hr.toFixed(0)+' bpm':'—')+'</td>':'')+
      '<td><div class="bb" style="width:110px"><div class="bf" style="width:'+w+'%;background:'+col+'"></div></div></td>'+
      '</tr>';
  });
  html += '</table></div></div>';
  return html;
}

/* ── Drag-and-drop handlers ── */
var _dragSrc = null, _dragDate = null;

function attachDragHandlers(container, s) {
  var wraps = container.querySelectorAll('.dnd-card-wrap');
  wraps.forEach(function(wrap) {
    var handle = wrap.querySelector('.drag-handle');
    if (!handle) return;

    /* Desktop: mousedown on handle activates dragging */
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      startDrag(wrap, container, s, e.clientY);
    });

    /* Mobile: touchstart on handle */
    handle.addEventListener('touchstart', function(e) {
      e.preventDefault();
      startDrag(wrap, container, s, e.touches[0].clientY);
    }, { passive: false });
  });
}

function startDrag(srcWrap, container, s, startY) {
  _dragSrc  = srcWrap;
  _dragDate = s.date;

  var origIdx = Array.from(container.children).indexOf(srcWrap);
  var srcRect = srcWrap.getBoundingClientRect();
  var offsetY = startY - srcRect.top;

  /* Visual: make source semi-transparent, create floating ghost */
  srcWrap.classList.add('dnd-dragging');

  var ghost = srcWrap.cloneNode(true);
  ghost.id  = 'dnd-ghost';
  ghost.style.cssText = 'position:fixed;z-index:9999;width:'+srcRect.width+'px;'
    + 'opacity:.85;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.25);'
    + 'border-radius:14px;top:'+(startY-offsetY)+'px;left:'+srcRect.left+'px;'
    + 'transition:none';
  document.body.appendChild(ghost);

  function onMove(clientY) {
    ghost.style.top = (clientY - offsetY) + 'px';

    /* Find which wrap the cursor is over */
    var wraps = Array.from(container.querySelectorAll('.dnd-card-wrap:not(.dnd-dragging)'));
    var target = null;
    wraps.forEach(function(w) {
      var r = w.getBoundingClientRect();
      if (clientY >= r.top && clientY <= r.bottom) target = w;
    });
    if (target && target !== srcWrap) {
      var targetIdx = Array.from(container.children).indexOf(target);
      var srcIdx    = Array.from(container.children).indexOf(srcWrap);
      if (targetIdx > srcIdx) {
        target.parentNode.insertBefore(srcWrap, target.nextSibling);
      } else {
        target.parentNode.insertBefore(srcWrap, target);
      }
    }
  }

  function onEnd() {
    srcWrap.classList.remove('dnd-dragging');
    var g = document.getElementById('dnd-ghost');
    if (g) g.remove();

    /* Save new order */
    var newOrder = Array.from(container.querySelectorAll('.dnd-card-wrap'))
      .map(function(w) { return w.dataset.cardId; })
      .filter(Boolean);
    if (newOrder.length) {
      CARD_ORDER = newOrder;
      saveLayout();
    }

    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup',   onMouseUp);
    document.removeEventListener('touchmove', onTouchMove);
    document.removeEventListener('touchend',  onTouchEnd);
  }

  function onMouseMove(e) { onMove(e.clientY); }
  function onMouseUp()    { onEnd(); }
  function onTouchMove(e) { e.preventDefault(); onMove(e.touches[0].clientY); }
  function onTouchEnd()   { onEnd(); }

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup',   onMouseUp);
  document.addEventListener('touchmove', onTouchMove,  { passive: false });
  document.addEventListener('touchend',  onTouchEnd);
}

function renderWeekPlanWidget(ss) {
  var today    = new Date();
  var todayDow = today.getDay();
  var ds = today.getFullYear()
         + String(today.getMonth()+1).padStart(2,'0')
         + String(today.getDate()).padStart(2,'0');
  var weekKey  = isoWeek(ds);
  var plan     = WEEKLY_PLANS[weekKey];
  var dayOrder = [1,2,3,4,5,6,0];
  var DOW_SHORT= ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var sessThisWeek = {};
  ss.forEach(function(s){
    if (isoWeek(s.date) === weekKey) sessThisWeek[getDOW(s.date)] = s;
  });
  var html = '<div class="week-plan-strip">'
    + '<div class="wps-title">\uD83D\uDCC5 This Week\'s Program'
    + '<span style="font-size:var(--fs-caption);font-weight:600;color:var(--gm);font-style:normal;'
    + 'text-transform:none;letter-spacing:0;margin-left:6px">'
    + weekMonday(weekKey) + '</span></div>';
  if (!plan || !plan.days || !Object.keys(plan.days).length) {
    html += '<div style="font-size:var(--fs-body);font-weight:600;color:var(--gm);text-align:center;padding:8px 0">'
      + 'No program set for this week. '
      + '<button onclick="nav(\'plans\')" style="font-family:var(--font);font-size:var(--fs-small);font-weight:800;'
      + 'padding:4px 12px;border-radius:999px;border:1.5px solid var(--lav);'
      + 'background:var(--lilac);color:var(--plum);cursor:pointer">Set up weekly plan \u2192</button>'
      + '</div></div>';
    return html;
  }
  html += '<div class="week-plan-days">';
  dayOrder.forEach(function(dow){
    var dayPlan = (plan.days||{})[dow];
    var sess    = sessThisWeek[dow];
    var isToday = (dow === todayDow);
    var base    = PROGRAM[dow] || {};
    var opt     = (typeof FOCUS_OPTIONS!=='undefined' && dayPlan)
                  ? FOCUS_OPTIONS.filter(function(o){ return o.id===dayPlan.id; })[0]||{} : {};
    var sty     = (typeof FOCUS_STYLES!=='undefined' && dayPlan && FOCUS_STYLES[dayPlan.id])
                  ? FOCUS_STYLES[dayPlan.id] : {};
    var col     = sty.color   || base.color   || '#b09dd4';
    var colLt   = sty.colorLt || base.colorLt || '#f0eaf9';
    var icon    = opt.icon  || sty.icon  || base.icon  || '';
    var label   = opt.label || base.shortLabel || '';
    if (!dayPlan || !dayPlan.id) {
      html += '<div class="wpd" style="background:var(--cloud);color:var(--gm)">'
        + '<div class="wpd-dow">'+DOW_SHORT[dow]+(isToday?' \u25CF':'')+'</div>'
        + '<div class="wpd-icon" style="opacity:.25">\u2014</div>'
        + '<div class="wpd-label" style="opacity:.4">Rest</div>'
        + '</div>';
      return;
    }
    var dateAttr = sess ? ' onclick="selSess(\''+sess.date+'\')"' : '';
    html += '<div class="wpd'+(sess?' has-session':'')+(isToday?' today':'')+'"'
      + dateAttr + ' style="background:'+colLt+';color:'+col+'">'
      + '<div class="wpd-dow" style="color:'+col+'">'+DOW_SHORT[dow]+(isToday?' \u25CF':'')+'</div>'
      + '<div class="wpd-icon">'+icon+'</div>'
      + '<div class="wpd-label">'+escHtml(label)+'</div>'
      + (sess ? '<div class="wpd-speed">'+sess.avgSpeed.toFixed(2)+'</div>' : '')
      + (sess ? '<div style="font-size:var(--fs-label);font-weight:700;margin-top:1px;opacity:.7">\u2713 done</div>' : '')
      + '</div>';
  });
  html += '</div></div>';
  return html;
}

function attachOvDrag(container) {
  Array.from(container.querySelectorAll('.ov-widget-wrap')).forEach(function(wrap){
    var handle = wrap.querySelector(':scope > .drag-handle');
    if (!handle) return;
    handle.addEventListener('mousedown', function(e){ e.preventDefault(); startOvDrag(wrap, container, e.clientY); });
    handle.addEventListener('touchstart', function(e){ e.preventDefault(); startOvDrag(wrap, container, e.touches[0].clientY); }, {passive:false});
  });
}

function startOvDrag(srcWrap, container, startY) {
  var srcRect = srcWrap.getBoundingClientRect();
  var offsetY = startY - srcRect.top;
  srcWrap.classList.add('dnd-dragging');
  var ghost = srcWrap.cloneNode(true);
  ghost.id  = 'dnd-ghost';
  ghost.style.cssText = 'position:fixed;z-index:9999;width:'+srcRect.width+'px;'
    +'opacity:.85;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.2);'
    +'border-radius:14px;top:'+(startY-offsetY)+'px;left:'+srcRect.left+'px;';
  document.body.appendChild(ghost);
  function onMove(y) {
    ghost.style.top = (y-offsetY)+'px';
    var target = null;
    Array.from(container.querySelectorAll('.ov-widget-wrap:not(.dnd-dragging)')).forEach(function(w){
      var r = w.getBoundingClientRect();
      if (y>=r.top && y<=r.bottom) target=w;
    });
    if (target) {
      var ti = Array.from(container.children).indexOf(target);
      var si = Array.from(container.children).indexOf(srcWrap);
      if (ti>si) container.insertBefore(srcWrap, target.nextSibling);
      else       container.insertBefore(srcWrap, target);
    }
  }
  function onEnd() {
    srcWrap.classList.remove('dnd-dragging');
    var g=document.getElementById('dnd-ghost'); if(g) g.remove();
    var newOrder = Array.from(container.querySelectorAll('.ov-widget-wrap'))
      .map(function(w){ return w.dataset.widgetId; }).filter(Boolean);
    if (newOrder.length) { OV_WIDGET_ORDER=newOrder; saveOvLayout(); }
    document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu);
    document.removeEventListener('touchmove',tm); document.removeEventListener('touchend',tu);
  }
  function mm(e){ onMove(e.clientY); } function mu(){ onEnd(); }
  function tm(e){ e.preventDefault(); onMove(e.touches[0].clientY); } function tu(){ onEnd(); }
  document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
  document.addEventListener('touchmove',tm,{passive:false}); document.addEventListener('touchend',tu);
}

function getStripConfig() { return STRIP_CONFIG || defaultStripConfig(); }

function getStripCellData(id) {
  var ss = SESSIONS;
  switch(id) {
    case 'sessions':
      if (!ss.length) return null;
      return { label:'Sessions', value:String(ss.length),
        sub: ss.length>1 ? dateLabel(ss[0].date)+' \u2192 '+dateLabel(ss[ss.length-1].date) : dateLabel(ss[0].date), badge:null };
    case 'bungee': {
      var b=(COMPUTED&&COMPUTED.byFocus['bungee'])||[];
      if (!b.length) return { label:'Thu Bungee', value:'—', sub:'no bungee sessions yet', badge:null };
      var bl=b[b.length-1];
      if (b.length<2) return { label:'Thu Bungee', value:bl.avgSpeed.toFixed(2)+' mph', sub:dateLabel(bl.date)+' \u00B7 1 session', badge:null };
      var bp=(bl.avgSpeed-b[0].avgSpeed)/b[0].avgSpeed*100;
      return { label:'Thu Bungee', value:bl.avgSpeed.toFixed(2)+' mph', sub:'latest vs '+dateLabel(b[0].date),
        badge:{cls:bp>=0?'b-up':'b-dn', text:(bp>=0?'\u25B2 ':'\u25BC ')+Math.abs(bp).toFixed(1)+'%'} };
    }
    case 'intervals': {
      var t=(COMPUTED&&COMPUTED.byFocus['intervals'])||[];
      if (!t.length) return { label:'Tue Intervals', value:'—', sub:'no interval sessions yet', badge:null };
      var tl=t[t.length-1];
      return { label:'Tue Intervals', value:tl.avgSpeed.toFixed(2)+' mph', sub:dateLabel(tl.date)+(t.length>1?' \u00B7 '+t.length+' sessions':''), badge:null };
    }
    case 'long-z2': {
      var sat=(COMPUTED&&COMPUTED.byFocus['long-z2'])||[];
      if (!sat.length) return { label:'Sat Long Z2', value:'—', sub:'no long Z2 sessions yet', badge:null };
      var sl=sat[sat.length-1];
      return { label:'Sat Long Z2', value:sl.avgSpeed.toFixed(2)+' mph', sub:dateLabel(sl.date)+(sat.length>1?' \u00B7 '+sat.length+' sessions':''), badge:null };
    }
    case 'hrm': {
      var hrSess=ss.filter(function(s){ return s.hasHR; });
      return { label:'HRM Sessions', value:hrSess.length+' / '+ss.length,
        sub:hrSess.length ? '\u2665 '+hrSess.map(function(s){ return dateLabel(s.date); }).join(', ') : 'no HRM yet', badge:null };
    }
    case 'dist': {
      var td=ss.reduce(function(a,s){ return a+s.totalDist; },0);
      return { label:'Total Distance', value:td.toFixed(1)+' mi', sub:ss.length+' sessions', badge:null };
    }
    case 'race': {
      var r=(COMPUTED&&COMPUTED.byFocus['race'])||[];
      if (!r.length) return { label:'Race Speed', value:'—', sub:'no races yet', badge:null };
      var rl=r[r.length-1];
      return { label:'Race Speed', value:rl.avgSpeed.toFixed(2)+' mph', sub:dateLabel(rl.date), badge:null };
    }
    case 'best': {
      var nb=ss.filter(function(s){ var f=getFocus(s); return !f||!f.bungee; });
      if (!nb.length) return null;
      var best=nb.reduce(function(m,s){ return s.avgSpeed>m.avgSpeed?s:m; });
      return { label:'Best Session', value:best.avgSpeed.toFixed(2)+' mph', sub:dateLabel(best.date), badge:null };
    }
  }
  return null;
}

function attachStripDrag(strip) {
  Array.from(strip.querySelectorAll('.ic[data-cell-id]')).forEach(function(cell) {
    var handle = cell.querySelector('.ic-handle');
    if (!handle) return;
    handle.addEventListener('mousedown', function(e){ e.preventDefault(); startStripDrag(cell, strip, e.clientX); });
    handle.addEventListener('touchstart', function(e){ e.preventDefault(); startStripDrag(cell, strip, e.touches[0].clientX); }, {passive:false});
  });
}

function startStripDrag(src, strip, x0) {
  var r0=src.getBoundingClientRect(), ox=x0-r0.left;
  src.classList.add('ic-dragging');
  var ghost=src.cloneNode(true); ghost.id='strip-ghost';
  ghost.style.cssText='position:fixed;z-index:9999;width:'+r0.width+'px;height:'+r0.height+'px;'
    +'opacity:.85;pointer-events:none;box-shadow:0 4px 20px rgba(140,110,180,.3);'
    +'background:var(--white);border-radius:10px;top:'+r0.top+'px;left:'+(x0-ox)+'px;padding:10px 16px;';
  document.body.appendChild(ghost);
  function move(x) {
    ghost.style.left=(x-ox)+'px';
    var tgt=null;
    Array.from(strip.querySelectorAll('.ic[data-cell-id]:not(.ic-dragging)')).forEach(function(c){
      var cr=c.getBoundingClientRect(); if(x>=cr.left&&x<=cr.right) tgt=c;
    });
    if (tgt) {
      var ti=Array.from(strip.children).indexOf(tgt), si=Array.from(strip.children).indexOf(src);
      if(ti>si) strip.insertBefore(src,tgt.nextSibling); else strip.insertBefore(src,tgt);
    }
  }
  function end() {
    src.classList.remove('ic-dragging');
    var g=document.getElementById('strip-ghost'); if(g) g.remove();
    var cfg=getStripConfig();
    cfg.order=Array.from(strip.querySelectorAll('.ic[data-cell-id]')).map(function(c){ return c.dataset.cellId; }).filter(Boolean);
    STRIP_CONFIG=cfg; saveStripConfig();
    document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu);
    document.removeEventListener('touchmove',tm); document.removeEventListener('touchend',tu);
  }
  function mm(e){ move(e.clientX); } function mu(){ end(); }
  function tm(e){ e.preventDefault(); move(e.touches[0].clientX); } function tu(){ end(); }
  document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
  document.addEventListener('touchmove',tm,{passive:false}); document.addEventListener('touchend',tu);
}

var _stripEditorOpen = false;
function openStripEditor() {
  if (_stripEditorOpen){ closeStripEditor(); return; }
  _stripEditorOpen = true;
  var cfg=getStripConfig();
  var chips=STRIP_DEFS.map(function(def){
    var on=cfg.order.indexOf(def.id)>=0;
    return '<button class="strip-chip'+(on?' on':'')+'" id="chip-'+def.id+'" '
      +'data-chip-id="'+def.id+'" onclick="toggleStripCell(this.dataset.chipId)">'
      +(on?'\u2713':'+') +' '+def.icon+' '+def.label+'</button>';
  }).join('');
  var ed=document.createElement('div');
  ed.id='strip-editor'; ed.className='strip-editor';
  ed.innerHTML='<div class="strip-editor-title"><span>\u2736 Customise stats strip</span>'
    +'<button onclick="closeStripEditor()" style="font-family:var(--font);font-size:var(--fs-small);font-weight:800;'
    +'padding:5px 14px;border-radius:999px;border:1.5px solid var(--lav);background:var(--white);'
    +'color:var(--plum);cursor:pointer">Done</button></div>'
    +'<div style="font-size:var(--fs-small);font-weight:600;color:var(--gm);margin-bottom:10px">'
    +'Tap to show/hide \u00B7 drag \u2807 in the strip to reorder</div>'
    +'<div class="strip-chips">'+chips+'</div>';
  var hdr=document.querySelector('.hdr');
  if(hdr&&hdr.parentNode) hdr.parentNode.insertBefore(ed,hdr.nextSibling);
  else document.body.insertBefore(ed,document.body.firstChild);
  setTimeout(function(){ document.addEventListener('click',_stripOutside); },0);
}
function closeStripEditor(){
  _stripEditorOpen=false;
  var ed=document.getElementById('strip-editor'); if(ed) ed.remove();
  document.removeEventListener('click',_stripOutside);
}
function _stripOutside(e){
  var ed=document.getElementById('strip-editor'); if(!ed) return;
  if(!ed.contains(e.target)&&!e.target.closest('.ic-edit-end')) closeStripEditor();
}
function toggleStripCell(id){
  var cfg=getStripConfig();
  var idx=cfg.order.indexOf(id);
  if(idx>=0){
    if(cfg.order.length<=1) return;
    cfg.order.splice(idx,1);
    if(cfg.hidden.indexOf(id)<0) cfg.hidden.push(id);
  } else {
    cfg.order.push(id);
    cfg.hidden=cfg.hidden.filter(function(h){ return h!==id; });
  }
  STRIP_CONFIG=cfg; saveStripConfig(); renderStrip();
  var chip=document.getElementById('chip-'+id);
  if(chip){ var on=cfg.order.indexOf(id)>=0; chip.className='strip-chip'+(on?' on':''); chip.childNodes[0].textContent=(on?'\u2713':'+'); }
}


/* ═══════════════════════════════════════════════════════
   SESSION TRIM
   Adds a "Trim session" card to session detail.
   Shows the speed profile with draggable start/end handles.
   Trimming slices s.strokes and recomputes avgSpeed,
   totalDist, elapsed, avgHR, avgStrokeRate.
═══════════════════════════════════════════════════════ */

function renderTrimCard(s) {
  if (!s.strokes || s.strokes.length < 4) return '';
  var cardId = 'trim-' + s.date;
  return '<div class="card dnd-card" data-card-id="trim">'
    + '<div class="ct-title">✂️ Trim Session</div>'
    + '<div class="ct-sub">Drag the handles to remove warm-up and cool-down</div>'
    + '<canvas id="' + cardId + '" height="110" style="width:100%;display:block;border-radius:8px;cursor:crosshair"></canvas>'
    + '<div class="trim-controls">'
    +   '<div class="trim-stat"><span class="trim-stat-label">Start</span><span class="trim-stat-val" id="trim-start-' + s.date + '">0:00</span></div>'
    +   '<div class="trim-btns">'
    +     '<button class="btn-pill btn-pill-sm" onclick="applyTrim(\'' + s.date + '\')">✂️ Apply trim</button>'
    +     '<button class="btn-pill btn-pill-sm" style="margin-left:6px" onclick="resetTrim(\'' + s.date + '\')">↺ Reset</button>'
    +   '</div>'
    +   '<div class="trim-stat trim-stat-r"><span class="trim-stat-label">End</span><span class="trim-stat-val" id="trim-end-' + s.date + '">—</span></div>'
    + '</div>'
    + '</div>';
}

/* Trim state per session date */
var _trimState = {};  /* { date: { startIdx, endIdx } } */

function getTrimState(s) {
  if (!_trimState[s.date]) {
    _trimState[s.date] = { startIdx: 0, endIdx: (s.strokes||[]).length - 1 };
  }
  return _trimState[s.date];
}

function drawTrimChart(s) {
  var c = document.getElementById('trim-' + s.date);
  if (!c) return;
  var strokes = (s.strokes || []).filter(function(x) { return x.s && x.s > 0.1; });
  if (!strokes.length) return;

  var W = 0, el = c;
  while (el && W === 0) { W = el.offsetWidth; el = el.parentElement; }
  if (!W) W = 600;
  var H = 110;
  c.width = W; c.height = H;

  var state = getTrimState(s);
  /* Clamp to strokes length */
  state.endIdx = Math.min(state.endIdx, strokes.length - 1);

  var ctx = c.getContext('2d');
  var pad = { t: 8, r: 12, b: 8, l: 12 };
  var cW = W - pad.l - pad.r;
  var cH = H - pad.t - pad.b;
  var n = strokes.length;

  var speeds = strokes.map(function(x) { return x.s; });
  var maxSP = Math.max.apply(null, speeds) * 1.1 || 5;
  var xOf = function(i) { return pad.l + (n < 2 ? cW / 2 : i / (n-1) * cW); };
  var yOf = function(v) { return pad.t + cH - (v / maxSP) * cH; };

  var f = getFocus(s);
  var col = f ? f.color : '#9b8bb4';

  /* Background */
  ctx.fillStyle = '#f7f4fb';
  ctx.fillRect(0, 0, W, H);

  /* Trimmed-out zones (greyed) */
  var x0 = xOf(0);
  var xs = xOf(state.startIdx);
  var xe = xOf(state.endIdx);
  var x1 = xOf(n - 1);

  ctx.fillStyle = 'rgba(180,170,200,0.25)';
  ctx.fillRect(x0, pad.t, xs - x0, cH);
  ctx.fillStyle = 'rgba(180,170,200,0.25)';
  ctx.fillRect(xe, pad.t, x1 - xe, cH);

  /* Speed gradient fill — full range, dimmed outside trim */
  function drawSpeedLine(from, to, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    var gr = ctx.createLinearGradient(0, pad.t, 0, pad.t + cH);
    gr.addColorStop(0, col + '44');
    gr.addColorStop(1, col + '00');
    ctx.beginPath();
    for (var i = from; i <= to; i++) {
      var x = xOf(i), y = yOf(strokes[i].s);
      if (i === from) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(xOf(to), pad.t + cH);
    ctx.lineTo(xOf(from), pad.t + cH);
    ctx.closePath();
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.beginPath();
    for (var i = from; i <= to; i++) {
      var x = xOf(i), y = yOf(strokes[i].s);
      if (i === from) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  }

  /* Full line dim */
  drawSpeedLine(0, n - 1, 0.3);
  /* Active range bright */
  if (state.startIdx <= state.endIdx) {
    drawSpeedLine(state.startIdx, state.endIdx, 1);
  }

  /* Handle lines */
  function drawHandle(xi, label, isStart) {
    var x = xOf(xi);
    ctx.strokeStyle = isStart ? '#5cb87a' : '#c0406a';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + cH); ctx.stroke();
    ctx.setLineDash([]);
    /* Knob */
    var ky = H / 2;
    ctx.fillStyle = isStart ? '#5cb87a' : '#c0406a';
    ctx.beginPath(); ctx.arc(x, ky, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 8px Nunito,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x, ky);
  }

  drawHandle(state.startIdx, '▶', true);
  drawHandle(state.endIdx,   '■', false);

  /* Update labels */
  var startEl = document.getElementById('trim-start-' + s.date);
  var endEl   = document.getElementById('trim-end-'   + s.date);
  if (startEl) startEl.textContent = strokes[state.startIdx].e ? strokes[state.startIdx].e.split('.')[0] : '0:00';
  if (endEl)   endEl.textContent   = strokes[state.endIdx].e   ? strokes[state.endIdx].e.split('.')[0]   : '—';
}

function attachTrimHandlers(s) {
  var c = document.getElementById('trim-' + s.date);
  if (!c) return;
  var strokes = (s.strokes || []).filter(function(x) { return x.s && x.s > 0.1; });
  if (!strokes.length) return;

  var dragging = null; /* 'start' | 'end' */

  function strokeIdxAt(clientX) {
    var rect = c.getBoundingClientRect();
    var pad = 12;
    var cW = c.width - pad * 2;
    var t = Math.max(0, Math.min(1, (clientX - rect.left - pad) / cW));
    return Math.round(t * (strokes.length - 1));
  }

  function onDown(clientX) {
    var state = getTrimState(s);
    var rect  = c.getBoundingClientRect();
    var pad2  = 12;
    var cW    = c.width - pad2 * 2;
    var n     = strokes.length;
    var xOf   = function(i) { return rect.left + pad2 + (n < 2 ? cW / 2 : i / (n-1) * cW); };
    var xs    = xOf(state.startIdx);
    var xe    = xOf(state.endIdx);
    /* Pick nearest handle */
    dragging = Math.abs(clientX - xs) < Math.abs(clientX - xe) ? 'start' : 'end';
  }

  function onMove(clientX) {
    if (!dragging) return;
    var state = getTrimState(s);
    var idx   = strokeIdxAt(clientX);
    if (dragging === 'start') {
      state.startIdx = Math.min(idx, state.endIdx - 1);
    } else {
      state.endIdx = Math.max(idx, state.startIdx + 1);
    }
    drawTrimChart(s);
  }

  function onUp() { dragging = null; }

  c.addEventListener('mousedown',  function(e) { onDown(e.clientX); });
  window.addEventListener('mousemove', function(e) { if (dragging) onMove(e.clientX); });
  window.addEventListener('mouseup',   onUp);
  c.addEventListener('touchstart', function(e) { e.preventDefault(); onDown(e.touches[0].clientX); }, { passive: false });
  window.addEventListener('touchmove', function(e) { if (dragging) { e.preventDefault(); onMove(e.touches[0].clientX); } }, { passive: false });
  window.addEventListener('touchend',  onUp);
}

function applyTrim(date) {
  var s = SESSIONS.find(function(x) { return x.date === date; });
  if (!s || !s.strokes) return;
  var strokes = s.strokes.filter(function(x) { return x.s && x.s > 0.1; });
  var state   = getTrimState(s);

  var trimmed = strokes.slice(state.startIdx, state.endIdx + 1);
  if (trimmed.length < 2) { showToast('Trim range too short', 'warn'); return; }

  /* Recompute session stats from trimmed strokes */
  var speeds = trimmed.map(function(x) { return x.s; }).filter(Boolean);
  var hrs    = trimmed.map(function(x) { return x.h; }).filter(function(h) { return h != null && h > 0; });
  var srs    = trimmed.map(function(x) { return x.r; }).filter(function(r) { return r != null && r > 0; });

  s.strokes       = trimmed;
  s.avgSpeed      = speeds.length ? speeds.reduce(function(a,b){return a+b;},0)/speeds.length : s.avgSpeed;
  s.avgHR         = hrs.length   ? Math.round(hrs.reduce(function(a,b){return a+b;},0)/hrs.length) : s.avgHR;
  s.avgStrokeRate = srs.length   ? Math.round(srs.reduce(function(a,b){return a+b;},0)/srs.length) : s.avgStrokeRate;
  s.hasHR         = hrs.length > 0;

  /* Elapsed from first/last stroke elapsed time */
  var firstE = trimmed[0].e || '0:00:00.0';
  var lastE  = trimmed[trimmed.length-1].e || firstE;
  function parseSecs(eStr) {
    var p = (eStr||'0:00:00.0').split(':');
    return parseInt(p[0]||0)*3600 + parseInt(p[1]||0)*60 + parseFloat(p[2]||0);
  }
  var durationSecs = parseSecs(lastE) - parseSecs(firstE);
  if (durationSecs > 0) {
    var h=Math.floor(durationSecs/3600), m=Math.floor((durationSecs%3600)/60), ss2=Math.floor(durationSecs%60);
    s.elapsed = h+':'+String(m).padStart(2,'0')+':'+String(ss2).padStart(2,'0')+'.0';
    s.totalDist = s.avgSpeed * durationSecs / 3600;
  }

  /* Recompute midpoint GPS */
  var gps = trimmed.filter(function(x) { return x.lt && x.ln; });
  if (gps.length) {
    var mid = gps[Math.floor(gps.length/2)];
    s.midLat = mid.lt; s.midLon = mid.ln;
  }

  /* Reset trim state and save */
  delete _trimState[date];
  saveToStorage();
  recompute();
  refresh();
  showToast('Session trimmed ✓', 'success');
}

function resetTrim(date) {
  delete _trimState[date];
  var s = SESSIONS.find(function(x) { return x.date === date; });
  if (!s) return;
  /* Reload original strokes from Supabase */
  sbGet(sessionDetailKey(date), sbToken(), function(err, val) {
    if (!err && val && val.strokes) {
      s.strokes   = val.strokes;
      s.intervals = val.intervals || s.intervals || [];
    }
    recompute();
    refresh();
    showToast('Session reset to original', 'success');
  });
}



/* ═══════════════════════════════════════════════════════
   NATIVE FIT PARSER — no CDN, handles Garmin + Suunto
   Suunto uses big-endian, marks 4-byte fields as float32
   but stores uint32. All 4-byte fields read as uint32.
═══════════════════════════════════════════════════════ */

function parseFIT(arrayBuffer, filename, cb) {
  try {
    var bytes = new Uint8Array(arrayBuffer);
    var view  = new DataView(arrayBuffer);
    var result = _parseFITBuffer(view, bytes, filename);
    cb(null, result);
  } catch(e) {
    console.error('FIT parse error:', e);
    cb(e, null);
  }
}

function _parseFITBuffer(view, bytes, filename) {
  var headerSize = bytes[0];
  var dataSize   = view.getUint32(4, true);
  var pos = headerSize;
  var end = headerSize + dataSize;
  var definitions = {};
  var sessions=[], records=[], laps=[];
  var FIT_EPOCH_MS = 631065600000;

  function readVal(pos, size, base, be) {
    if (pos < 0 || pos + size > bytes.length) return null;
    var b = base & 0x9F;
    try {
      if (size===1) { if(b===0x01) return view.getInt8(pos); var v=bytes[pos]; return v===0xFF?null:v; }
      if (size===2) {
        if(b===0x83||b===0x8C||b===0x03){var v=view.getInt16(pos,!be);return v===0x7FFF?null:v;}
        var v=view.getUint16(pos,!be);return v===0xFFFF?null:v;
      }
      if (size===4) {
        if(b===0x83){var v=view.getInt32(pos,!be);return v===0x7FFFFFFF?null:v;}
        /* Treat all other 4-byte as uint32 (Suunto marks timestamps/elapsed as float32 but stores uint32) */
        var v=view.getUint32(pos,!be);return v===0xFFFFFFFF?null:v;
      }
      if (size===8) return null;
      if (b===0x07){var s='';for(var i=0;i<size;i++){var c=bytes[pos+i];if(c===0)break;s+=String.fromCharCode(c);}return s;}
      if (size>=4){var v=view.getUint32(pos,!be);return v===0xFFFFFFFF?null:v;}
      return bytes[pos];
    } catch(e) { return null; }
  }

  while (pos < end) {
    if (pos >= bytes.length) break;
    var hdr = bytes[pos];
    if (hdr & 0x80) { pos++; continue; }
    var isDef = !!(hdr & 0x40), hasDevFi = !!(hdr & 0x20), localNum = hdr & 0x0F;
    pos++;
    if (isDef) {
      pos++;
      var be = bytes[pos]===1; pos++;
      var gn = be ? view.getUint16(pos,false) : view.getUint16(pos,true); pos+=2;
      var fc = bytes[pos++];
      var fields=[];
      for(var fi=0;fi<fc;fi++){fields.push({num:bytes[pos],size:bytes[pos+1],base:bytes[pos+2]});pos+=3;}
      if(hasDevFi){var dc=bytes[pos++];pos+=dc*3;}
      definitions[localNum]={gn:gn,be:be,fields:fields};
    } else {
      var def=definitions[localNum];
      if(!def){pos++;continue;}
      var rowSize=0;for(var fi=0;fi<def.fields.length;fi++)rowSize+=def.fields[fi].size;
      if(pos+rowSize>bytes.length){pos+=rowSize;continue;}
      var row={};
      for(var fi=0;fi<def.fields.length;fi++){
        var f=def.fields[fi];row[f.num]=readVal(pos,f.size,f.base,def.be);pos+=f.size;
      }
      if(def.gn===20)records.push(row);
      else if(def.gn===18)sessions.push(row);
      else if(def.gn===19)laps.push(row);
    }
  }
  return fitDataToSession({sessions:sessions,records:records,laps:laps,_raw:true},filename);
}

function fitDataToSession(data, filename) {
  /* ── Normalize raw field-number records ── */
  if (data._raw) {
    if (data.records) {
      data.records = data.records.map(function(r) {
        var lat=r[0],lon=r[1];
        if(lat!=null&&lat>0x7FFFFFFF)lat-=0x100000000;
        if(lon!=null&&lon>0x7FFFFFFF)lon-=0x100000000;
        var spd=r[6];if(spd!=null&&spd>0)spd=spd/1000;
        var ts=r[253];
        return {
          position_lat:lat,position_long:lon,altitude:r[2],
          heart_rate:r[3],
          cadence:(r[4]!=null&&r[4]>0&&r[4]<120)?r[4]:null,
          stroke_rate:(r[4]!=null&&r[4]>0&&r[4]<120)?r[4]:null,
          distance:r[5],
          speed:(spd!=null&&spd>0&&spd<50)?spd:null,
          timestamp:ts!=null?new Date(631065600000+ts*1000):null,
        };
      });
    }
    if(data.sessions&&data.sessions[0]){
      var s0=data.sessions[0];
      var startTs=s0[2]||null,endTs=s0[253]||null;
      var elapsedSecs=(startTs&&endTs&&endTs>startTs)?(endTs-startTs):(s0[9]!=null?Math.round(s0[9]/1000):null);
      var avgSpd=s0[14]!=null?s0[14]/1000:null;
      data.sessions[0]={
        start_time:startTs?new Date(631065600000+startTs*1000):null,
        total_elapsed_time:elapsedSecs,total_distance:null,
        avg_speed:avgSpd,avg_heart_rate:s0[16],avg_cadence:s0[20],
        sport:null,sub_sport:null,
      };
    }
  }

  /* ── Helpers ── */
  function semicirclesToDeg(sc){if(sc==null)return null;if(sc>0x7FFFFFFF)sc-=0x100000000;return sc*(180/Math.pow(2,31));}
  function msToMph(ms){return(ms||0)*2.23694;}
  function mToMi(m){return(m||0)/1609.344;}
  function secsToElapsed(s){s=Math.round(s||0);var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'.0';}
  function fitDateToKey(d){if(!d)return String(Date.now());var dt=(d instanceof Date)?d:new Date(631065600000+d*1000);return String(dt.getFullYear())+String(dt.getMonth()+1).padStart(2,'0')+String(dt.getDate()).padStart(2,'0');}
  function fitDateToString(d){if(!d)return '';var dt=(d instanceof Date)?d:new Date(631065600000+d*1000);return String(dt.getMonth()+1).padStart(2,'0')+'/'+String(dt.getDate()).padStart(2,'0')+'/'+dt.getFullYear()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')+':'+String(dt.getSeconds()).padStart(2,'0');}

  var sum=(data.sessions&&data.sessions[0])||{};
  var startTime=sum.start_time||null;
  var dateKey=fitDateToKey(startTime);

  /* Elapsed */
  var totalSecs=0;
  if(sum.total_elapsed_time!=null&&sum.total_elapsed_time>0){
    totalSecs=data._raw?sum.total_elapsed_time:sum.total_elapsed_time/1000;
  }

  /* Records */
  var rawRecords=data.records||[];
  var recSpeeds=[],recHRs=[],recTimestamps=[],recCadences=[];
  rawRecords.forEach(function(r){
    var spd=r.speed;if(spd!=null&&spd>0&&spd<50)recSpeeds.push(spd);
    var hr=r.heart_rate;if(hr!=null&&hr>0&&hr<250)recHRs.push(hr);
    var cad=r.cadence||r.stroke_rate;if(cad!=null&&cad>0&&cad<120)recCadences.push(cad);
    var ts=r.timestamp;
    if(ts instanceof Date)recTimestamps.push(ts.getTime());
    else if(typeof ts==='number'&&ts>0)recTimestamps.push(ts*1000);
  });

  if(recTimestamps.length>=2){
    var recElapsed=(Math.max.apply(null,recTimestamps)-Math.min.apply(null,recTimestamps))/1000;
    if(recElapsed>totalSecs)totalSecs=recElapsed;
    if(!startTime&&recTimestamps.length){startTime=new Date(Math.min.apply(null,recTimestamps));dateKey=fitDateToKey(startTime);}
  }

  var avgSpeedMs=recSpeeds.length?recSpeeds.reduce(function(a,b){return a+b;},0)/recSpeeds.length:(sum.avg_speed||0);
  var avgSpeedMph=msToMph(avgSpeedMs);
  var totalDistMi=0;
  if(sum.total_distance!=null&&sum.total_distance>100)totalDistMi=mToMi(sum.total_distance);
  else totalDistMi=avgSpeedMs*totalSecs/1609.344;

  var avgHR=recHRs.length?Math.round(recHRs.reduce(function(a,b){return a+b;},0)/recHRs.length):(sum.avg_heart_rate||null);
  var hasHR=recHRs.length>0||!!(sum.avg_heart_rate);
  var avgSR=recCadences.length?Math.round(recCadences.reduce(function(a,b){return a+b;},0)/recCadences.length):(sum.avg_cadence||0);

  /* GPS */
  var startLat=0,startLon=0;
  var firstGPS=rawRecords.find(function(r){return r.position_lat!=null&&r.position_long!=null;});
  if(firstGPS){startLat=semicirclesToDeg(firstGPS.position_lat)||0;startLon=semicirclesToDeg(firstGPS.position_long)||0;}

  /* Strokes */
  var SAMPLE=Math.max(1,Math.round(rawRecords.length/300));
  var strokes=[];
  var recStart=recTimestamps.length?Math.min.apply(null,recTimestamps):0;
  rawRecords.forEach(function(r,i){
    if(i%SAMPLE!==0)return;
    var lt=semicirclesToDeg(r.position_lat),ln=semicirclesToDeg(r.position_long);
    var spd=(r.speed!=null&&r.speed<50)?msToMph(r.speed):null;
    var hr=(r.heart_rate&&r.heart_rate<250)?r.heart_rate:null;
    var sr=r.cadence||r.stroke_rate||null;
    var tsMs=0;
    if(r.timestamp instanceof Date)tsMs=r.timestamp.getTime();
    else if(typeof r.timestamp==='number')tsMs=r.timestamp*1000;
    var elapsedS=recStart>0&&tsMs>0?(tsMs-recStart)/1000:i*SAMPLE;
    strokes.push({e:secsToElapsed(elapsedS),s:spd,r:sr,h:hr,lt:lt,ln:ln,i:1});
  });

  var validStrokes=strokes.filter(function(s){return s.lt&&s.ln;});
  var mid=validStrokes.length?validStrokes[Math.floor(validStrokes.length/2)]:null;

  /* Sport type */
  var sessionType='Paddling';
  if(filename){
    var fn=filename.toLowerCase();
    if(fn.indexOf('canoe')>=0)sessionType='Canoeing';
    else if(fn.indexOf('kayak')>=0)sessionType='Kayaking';
    else if(fn.indexOf('sup')>=0)sessionType='SUP';
    else if(fn.indexOf('row')>=0)sessionType='Rowing';
  }

  return {
    date:dateKey,startTime:fitDateToString(startTime),sessionType:sessionType,
    programName:filename||'',avgSpeed:avgSpeedMph,totalDist:totalDistMi,
    elapsed:secsToElapsed(totalSecs),avgStrokeRate:avgSR,avgHR:avgHR,
    startLat:startLat,startLon:startLon,
    midLat:mid?mid.lt:null,midLon:mid?mid.ln:null,
    hasHR:hasHR,intervals:[],strokes:strokes,_source:'fit',
  };
}



function isoWeek(dateStr) {
  var y = +dateStr.slice(0,4), m = +dateStr.slice(4,6)-1, d = +dateStr.slice(6,8);
  var date  = new Date(y,m,d);
  var jan4  = new Date(date.getFullYear(), 0, 4);
  var start = new Date(jan4);
  start.setDate(jan4.getDate() - ((jan4.getDay()+6)%7));
  var wn = Math.floor(((date - start)/86400000 + 1)/7) + 1;
  return date.getFullYear() + 'W' + String(wn).padStart(2,'0');
}

function weekMonday(isoKey) {
  /* Return the Monday date string for display */
  var y = +isoKey.slice(0,4), wn = +isoKey.slice(5);
  var jan4 = new Date(y, 0, 4);
  var mon  = new Date(jan4);
  mon.setDate(jan4.getDate() - ((jan4.getDay()+6)%7) + (wn-1)*7);
  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mo[mon.getMonth()] + ' ' + mon.getDate() + ', ' + mon.getFullYear();
}

function loadAllSessionDetails(sessions, cb) {
  if (!sessions || !sessions.length) { cb(); return; }
  var pending = sessions.length;
  sessions.forEach(function(s) {
    sbGet(sessionDetailKey(s.date), sbToken(), function(err, val) {
      if (!err && val && val.strokes) {
        s.strokes   = val.strokes;
        s.intervals = val.intervals || s.intervals || [];
      }
      if (!--pending) cb();
    });
  });
}

  var now = new Date();

          + String(now.getMonth()+1).padStart(2,'0')
          + String(now.getDate()).padStart(2,'0');
  ACTIVE_PLAN_WEEK = isoWeek(ds);
  openPlanEditor(ACTIVE_PLAN_WEEK);
}

function openPlanEditor(wk) {
  ACTIVE_PLAN_WEEK = wk;
  var slot = document.getElementById('plan-editor-slot');
  if (!slot) return;
  var plan = WEEKLY_PLANS[wk] || { days: {} };

  /* Week selector */
  /* Build a list of week options: current week ±8 weeks */
  var now = new Date();
  var weekOptions = '';
  for (var delta = -4; delta <= 8; delta++) {
    var d = new Date(now);
    d.setDate(d.getDate() - d.getDay() + 1 + delta*7);  /* Monday */
    var ds2 = d.getFullYear()
            + String(d.getMonth()+1).padStart(2,'0')
            + String(d.getDate()).padStart(2,'0');
    var wk2 = isoWeek(ds2);
    var lbl = 'Week of ' + weekMonday(wk2) + (delta===0?' (this week)':delta<0?' (past)':' (upcoming)');
    weekOptions += '<option value="'+wk2+'"'+(wk2===wk?' selected':'')+'>'+lbl+'</option>';
  }

  var html = '<div class="card" style="border-color:var(--lav-md);margin-bottom:16px">';
  html += '<div class="ct-title" style="margin-bottom:2px">✏️ ' + (WEEKLY_PLANS[wk] ? 'Edit' : 'New') + ' week plan</div>';

  /* Week picker */
  html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">';
  html += '<label style="font-size:11px;font-weight:800;color:var(--plum)">Week:</label>';
  html += '<select id="plan-week-select" onchange="switchPlanWeek(this.value)" style="font-family:var(--font);font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;border:1.5px solid var(--lav);background:var(--white);color:var(--ink)">';
  html += weekOptions + '</select>';
  html += '</div>';

  /* Day rows */
  html += '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">';
  PLAN_DAYS.forEach(function(d) {
    var day = (plan.days||{})[d.dow] || {};
    var focusOpts = FOCUS_OPTIONS.map(function(o) {
      return '<option value="'+o.id+'"'+(o.id===day.id?' selected':'')+'>'+o.icon+' '+o.label+'</option>';
    }).join('');

    html += '<div style="display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:start;padding:10px 12px;background:var(--lilac2);border-radius:10px;border:1.5px solid var(--lav-lt)">';
    html += '<div style="font-size:12px;font-weight:800;color:var(--ink);padding-top:6px">' + d.name + '</div>';
    html += '<div style="display:flex;flex-direction:column;gap:6px">';

    /* Focus type dropdown */
    html += '<select data-dow="'+d.dow+'" data-field="id" onchange="updatePlanDay(this)" '
          + 'style="font-family:var(--font);font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;border:1.5px solid var(--lav);background:var(--white);color:var(--ink)">'
          + focusOpts + '</select>';

    /* Description textarea — only shown if not rest */
    var isRest = !day.id;
    html += '<textarea data-dow="'+d.dow+'" data-field="desc" onchange="updatePlanDay(this)" '
          + 'placeholder="Session description, e.g. 70 min · 3×10 min bungee sets · Z2–Z3" rows="2" '
          + (isRest ? 'style="display:none;' : 'style="')
          + 'font-family:var(--font);font-size:11px;font-weight:600;padding:7px 10px;border-radius:8px;'
          + 'border:1.5px solid var(--lav);background:var(--white);color:var(--ink);resize:vertical;width:100%;box-sizing:border-box">'
          + escHtml(day.desc||'') + '</textarea>';

    /* SR targets (optional) — only for interval-type sessions */
    var showSR = (day.id==='intervals');
    html += '<div data-dow="'+d.dow+'" data-srrow="1" style="display:'+(showSR?'flex':'none')+';align-items:center;gap:6px;flex-wrap:wrap">';
    html += '<span style="font-size:10px;font-weight:700;color:var(--gm)">SR targets:</span>';
    html += '<input type="text" data-dow="'+d.dow+'" data-field="sr_easy" onchange="updatePlanDay(this)" '
          + 'placeholder="easy (e.g. 36)" value="'+escHtml(day.srTargets?String(day.srTargets.easy):'')+'" '
          + 'style="font-family:var(--font);font-size:11px;padding:4px 8px;border-radius:6px;border:1.5px solid var(--lav);width:90px">';
    html += '<span style="font-size:10px;font-weight:700;color:var(--gm)">/</span>';
    html += '<input type="text" data-dow="'+d.dow+'" data-field="sr_hard" onchange="updatePlanDay(this)" '
          + 'placeholder="hard (e.g. 40-42)" value="'+escHtml(day.srTargets?String(day.srTargets.hard):'')+'" '
          + 'style="font-family:var(--font);font-size:11px;padding:4px 8px;border-radius:6px;border:1.5px solid var(--lav);width:90px">';
    html += '</div>';

    html += '</div></div>';
  });
  html += '</div>';

  /* Save / Cancel buttons */
  html += '<div style="display:flex;gap:10px">';
  html += '<button onclick="savePlanFromEditor()" style="font-family:var(--font);font-size:12px;font-weight:800;padding:10px 24px;border-radius:var(--r-pill);border:none;background:var(--plum);color:var(--white);cursor:pointer">💾 Save plan</button>';
  html += '<button onclick="closePlanEditor()" style="font-family:var(--font);font-size:12px;font-weight:800;padding:10px 24px;border-radius:var(--r-pill);border:1.5px solid var(--lav);background:var(--white);color:var(--plum);cursor:pointer">Cancel</button>';
  if (WEEKLY_PLANS[wk]) {
    html += '<button onclick="deletePlan(\''+wk+'\')" style="font-family:var(--font);font-size:12px;font-weight:800;padding:10px 24px;border-radius:var(--r-pill);border:1.5px solid var(--blush-dk);background:var(--blush);color:#8a3055;cursor:pointer;margin-left:auto">Remove this week</button>';
  }
  html += '</div>';
  html += '</div>';
  slot.innerHTML = html;

  /* Scroll editor into view */
  slot.scrollIntoView({ behavior:'smooth', block:'start' });
}

function closePlanEditor() {
  ACTIVE_PLAN_WEEK = null;
  var slot = document.getElementById('plan-editor-slot');
  if (slot) slot.innerHTML = '';
}

function deletePlan(wk) {
  if (!confirm('Remove plan for week of ' + weekMonday(wk) + '?')) return;
  delete WEEKLY_PLANS[wk];
  saveWeeklyPlans();
  ACTIVE_PLAN_WEEK = null;
  refresh();
}

function savePlanFromEditor() {
  var wk   = ACTIVE_PLAN_WEEK;
  var plan = WEEKLY_PLANS[wk] || { days:{} };
  /* Read all current field values from DOM */
  document.querySelectorAll('[data-dow][data-field]').forEach(function(el) {
    updatePlanDay(el);
  });
  plan = WEEKLY_PLANS[wk] || { days:{} };
  /* Remove days with empty id */
  Object.keys(plan.days||{}).forEach(function(dow) {
    if (!plan.days[dow] || !plan.days[dow].id) delete plan.days[dow];
  });
  WEEKLY_PLANS[wk] = plan;
  saveWeeklyPlans();
  closePlanEditor();
  refresh();
  showToast('📋 Plan saved for week of ' + weekMonday(wk), 'success');
}

function switchPlanWeek(newWk) {
  ACTIVE_PLAN_WEEK = newWk;
  openPlanEditor(newWk);
}

function updatePlanDay(el) {
  var dow   = +el.dataset.dow;
  var field = el.dataset.field;
  var val   = el.value;
  var plan  = WEEKLY_PLANS[ACTIVE_PLAN_WEEK] || { days:{} };
  if (!plan.days) plan.days = {};
  if (!plan.days[dow]) plan.days[dow] = {};

  if (field === 'id') {
    plan.days[dow].id = val;
    /* Show/hide desc textarea and SR row */
    var allDesc = document.querySelectorAll('textarea[data-dow="'+dow+'"]');
    var allSR   = document.querySelectorAll('[data-srrow][data-dow="'+dow+'"]');
    allDesc.forEach(function(t){ t.style.display = val ? '' : 'none'; });
    allSR.forEach(function(r){ r.style.display = (val==='intervals') ? 'flex' : 'none'; });
  } else if (field === 'desc') {
    plan.days[dow].desc = val;
  } else if (field === 'sr_easy') {
    if (!plan.days[dow].srTargets) plan.days[dow].srTargets = {};
    plan.days[dow].srTargets.easy = isNaN(+val) ? val : +val;
  } else if (field === 'sr_hard') {
    if (!plan.days[dow].srTargets) plan.days[dow].srTargets = {};
    plan.days[dow].srTargets.hard = val;
  }

  /* Remove day entirely if set back to rest */
  if (field === 'id' && !val) {
    delete plan.days[dow];
  }

  WEEKLY_PLANS[ACTIVE_PLAN_WEEK] = plan;
}

function handleAuthRedirect(cb) {
  /* Supabase email confirmation lands with hash params:
     #access_token=...&refresh_token=...&type=signup  (or recovery) */
  var hash = window.location.hash;
  if (!hash) { cb(false); return; }

  var params = {};
  hash.slice(1).split('&').forEach(function(p) {
    var kv = p.split('=');
    params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
  });

  if (params.access_token && (params.type === 'signup' || params.type === 'recovery' || params.type === 'magiclink')) {
    /* Build a session object from the hash params */
    var sess = {
      access_token:  params.access_token,
      refresh_token: params.refresh_token || '',
      token_type:    params.token_type || 'bearer',
    };
    /* Decode user from JWT */
    try {
      var payload = JSON.parse(atob(params.access_token.split('.')[1]));
      sess.user = { id: payload.sub, email: payload.email };
    } catch(e) {}

    SB_SESSION = sess;
    try { localStorage.setItem('sb_session', JSON.stringify(sess)); } catch(e) {}

    /* Clean the hash from the URL so it doesn't re-trigger on reload */
    history.replaceState(null, '', window.location.pathname + window.location.search);

    if (params.type === 'recovery') {
      /* Password reset flow — show update password form */
      showUpdatePasswordScreen(sess);
      cb(true);
    } else {
      /* Email verified — go straight into the app */
      cb(true);
    }
    return;
  }
  cb(false);
}

function _loadUserData(cb) {

}

function drawDownwindTrend(g){
  var c=document.getElementById('ft-'+g.focus.id);if(!c)return;
  var ctx=c.getContext('2d'),W=c.offsetWidth,H=140;c.width=W;c.height=H;
  var f=g.focus;
  var sess=g.sessions; // oldest first
  var n=sess.length;
  var pad={t:22,r:18,b:28,l:50},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;

  /* Collect efficiency + avg speed per session */
  var data=sess.map(function(s){
    var dw=detectDownwindRuns(s);
    return {date:s.date,eff:dw?dw.eff:null,spd:dw?dw.avgSpd:null,sr:dw?dw.avgSR:null};
  }).filter(function(d){return d.eff!==null;});
  if(data.length<1) return;

  var effs=data.map(function(d){return d.eff;});
  var spds=data.map(function(d){return d.spd;});
  var minE=Math.min.apply(null,effs)*0.95, maxE=Math.max.apply(null,effs)*1.05;
  /* Extend range to show target line at 12 */
  maxE=Math.max(maxE,12.5); minE=Math.min(minE,9.5);

  var nd=data.length;
  var xOf=function(i){return pad.l+(nd<2?cW/2:i/(nd-1)*cW);};
  var yOf=function(v){return pad.t+cH-((v-minE)/(maxE-minE))*cH;};

  drawGrid(ctx,W,H,pad,minE,maxE,3);

  /* Target line at efficiency=12 */
  if(12>=minE&&12<=maxE){
    var ty=yOf(12);
    ctx.beginPath();ctx.strokeStyle='rgba(92,184,122,0.5)';ctx.lineWidth=1.5;ctx.setLineDash([6,4]);
    ctx.moveTo(pad.l,ty);ctx.lineTo(W-pad.r,ty);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(92,184,122,0.8)';ctx.font='bold 9px Nunito';ctx.textAlign='left';
    ctx.fillText('target 12',pad.l+4,ty-3);
  }

  /* Avg speed (secondary, dashed, right axis implied by colour) */
  if(spds.length>=2){
    var minS=Math.min.apply(null,spds)*0.97,maxS=Math.max.apply(null,spds)*1.02;
    var yS=function(v){return pad.t+cH-((v-minS)/(maxS-minS))*cH;};
    ctx.beginPath();ctx.strokeStyle=f.color+'55';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);ctx.lineJoin='round';
    data.forEach(function(d,i){if(i===0)ctx.moveTo(xOf(i),yS(d.spd));else ctx.lineTo(xOf(i),yS(d.spd));});
    ctx.stroke();ctx.setLineDash([]);
  }

  /* Efficiency line + fill */
  if(nd>1){
    var gr=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);
    gr.addColorStop(0,f.color+'33');gr.addColorStop(1,f.color+'00');
    ctx.beginPath();
    data.forEach(function(d,i){if(i===0)ctx.moveTo(xOf(i),yOf(d.eff));else ctx.lineTo(xOf(i),yOf(d.eff));});
    ctx.lineTo(xOf(nd-1),pad.t+cH);ctx.lineTo(xOf(0),pad.t+cH);ctx.closePath();
    ctx.fillStyle=gr;ctx.fill();
    ctx.beginPath();ctx.strokeStyle=f.color;ctx.lineWidth=2.5;ctx.lineJoin='round';
    data.forEach(function(d,i){if(i===0)ctx.moveTo(xOf(i),yOf(d.eff));else ctx.lineTo(xOf(i),yOf(d.eff));});
    ctx.stroke();
  }

  /* Data points */
  data.forEach(function(d,i){
    var x=xOf(i),y=yOf(d.eff);
    var effCol=d.eff>12?'var(--mint-dk)':d.eff>10.5?f.color:'#a03060';
    ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);
    ctx.fillStyle=effCol;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.fill();ctx.stroke();
    ctx.fillStyle='#3d2f5a';ctx.font='bold 10px Nunito';ctx.textAlign='center';
    ctx.fillText(d.eff.toFixed(2),x,y-12);
    xLbl(ctx,H,x,dateLabel(d.date));
  });

  /* Legend */
  ctx.fillStyle=f.color;ctx.font='bold 9px Nunito';ctx.textAlign='right';
  ctx.fillText('— efficiency (speed÷SR×100)',W-pad.r,pad.t-6);
  ctx.fillStyle=f.color+'88';
  ctx.fillText('- - avg run speed',W-pad.r,pad.t+5);
}

function drawGPSMap(s, strokes, canvasEl) {
  var c = canvasEl||document.getElementById(s._mapId||('sess-map-'+s.date));
  if (!c) return;
  var W=0,wEl=c; while(wEl&&W===0){W=wEl.offsetWidth;wEl=wEl.parentElement;} if(!W)W=600;
  var H=260; c.width=W; c.height=H;
  var ctx=c.getContext('2d');
  ctx.fillStyle='#e8f0f8'; ctx.fillRect(0,0,W,H);
  var lats=strokes.map(function(st){return st.lt;}),lons=strokes.map(function(st){return st.ln;});
  var minLat=Math.min.apply(null,lats),maxLat=Math.max.apply(null,lats);
  var minLon=Math.min.apply(null,lons),maxLon=Math.max.apply(null,lons);
  var latSpan=maxLat-minLat||0.001,lonSpan=maxLon-minLon||0.001;
  var latRad=(minLat+maxLat)/2*Math.PI/180,lonScale=Math.cos(latRad);
  var aspectRatio=W/H,geographicAspect=(lonSpan*lonScale)/latSpan;
  if(geographicAspect>aspectRatio){var ns=(lonSpan*lonScale)/aspectRatio,lm=(minLat+maxLat)/2;minLat=lm-ns/2;maxLat=lm+ns/2;latSpan=ns;}
  else{var nl=(latSpan*aspectRatio)/lonScale,lonMid=(minLon+maxLon)/2;minLon=lonMid-nl/2;maxLon=lonMid+nl/2;lonSpan=nl;}
  var pad=28,dW=W-pad*2,dH=H-pad*2;
  var toX=function(ln){return pad+(ln-minLon)/lonSpan*dW;};
  var toY=function(lt){return pad+(1-(lt-minLat)/latSpan)*dH;};
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;
  for(var gi=0;gi<=4;gi++){var gx=pad+gi*dW/4,gy=pad+gi*dH/4;
    ctx.beginPath();ctx.moveTo(gx,pad);ctx.lineTo(gx,pad+dH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pad,gy);ctx.lineTo(pad+dW,gy);ctx.stroke();}
  var speeds=strokes.map(function(st){return st.s||0;}),maxSpd=Math.max.apply(null,speeds)||5;
  var f=getFocus(s),baseCol=f?f.color:'#7c6fa0';
  ctx.beginPath();strokes.forEach(function(st,i){var x=toX(st.ln),y=toY(st.lt);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=5;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
  for(var i=1;i<strokes.length;i++){
    var st0=strokes[i-1],st1=strokes[i],t=Math.min(1,(st0.s||0)/maxSpd);
    var r0=180,g0=180,b0=190,r1=parseInt(baseCol.slice(1,3)||'7c',16),g1=parseInt(baseCol.slice(3,5)||'6f',16),b1=parseInt(baseCol.slice(5,7)||'a0',16);
    ctx.beginPath();ctx.moveTo(toX(st0.ln),toY(st0.lt));ctx.lineTo(toX(st1.ln),toY(st1.lt));
    ctx.strokeStyle='rgb('+(Math.round(r0+(r1-r0)*t))+','+(Math.round(g0+(g1-g0)*t))+','+(Math.round(b0+(b1-b0)*t))+')';
    ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
  var sx=toX(strokes[0].ln),sy=toY(strokes[0].lt);
  ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);ctx.fillStyle='#4caf74';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  var ex=toX(strokes[strokes.length-1].ln),ey=toY(strokes[strokes.length-1].lt);
  ctx.beginPath();ctx.arc(ex,ey,6,0,Math.PI*2);ctx.fillStyle='#c0406a';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  var mid=strokes[Math.floor(strokes.length/2)],mid2=strokes[Math.min(Math.floor(strokes.length/2)+3,strokes.length-1)];
  if(mid&&mid2){var mx=toX(mid.ln),my=toY(mid.lt),angle=Math.atan2(toY(mid2.lt)-my,toX(mid2.ln)-mx);
    ctx.save();ctx.translate(mx,my);ctx.rotate(angle);ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-4,-5);ctx.lineTo(-4,5);ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fill();ctx.restore();}
}



var FOCUS_ORDER = null;
function attachFocusDrag(container) {
  Array.from(container.querySelectorAll('.focus-group-wrap')).forEach(function(wrap) {
    var handle = wrap.querySelector(':scope > .drag-handle');
    if (!handle) return;
    handle.addEventListener('mousedown', function(e){e.preventDefault();startFocusDrag(wrap,container,e.clientY);});
    handle.addEventListener('touchstart', function(e){e.preventDefault();startFocusDrag(wrap,container,e.touches[0].clientY);},{passive:false});
  });
}
function startFocusDrag(srcWrap, container, startY) {
  var srcRect=srcWrap.getBoundingClientRect(),offsetY=startY-srcRect.top;
  srcWrap.classList.add('dnd-dragging');
  var ghost=srcWrap.cloneNode(true);ghost.id='dnd-ghost';
  ghost.style.cssText='position:fixed;z-index:9999;width:'+srcRect.width+'px;opacity:.85;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.2);border-radius:14px;top:'+(startY-offsetY)+'px;left:'+srcRect.left+'px;';
  document.body.appendChild(ghost);
  function onMove(y){
    ghost.style.top=(y-offsetY)+'px';
    var target=null;
    Array.from(container.querySelectorAll('.focus-group-wrap:not(.dnd-dragging)')).forEach(function(w){
      var r=w.getBoundingClientRect();if(y>=r.top&&y<=r.bottom)target=w;
    });
    if(target){var ti=Array.from(container.children).indexOf(target),si=Array.from(container.children).indexOf(srcWrap);
      if(ti>si)container.insertBefore(srcWrap,target.nextSibling);else container.insertBefore(srcWrap,target);}
  }
  function onEnd(){
    srcWrap.classList.remove('dnd-dragging');var g=document.getElementById('dnd-ghost');if(g)g.remove();
    FOCUS_ORDER=Array.from(container.querySelectorAll('.focus-group-wrap')).map(function(w){return w.dataset.focusId;}).filter(Boolean);
    saveFocusOrder();
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
    document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',tu);
  }
  function mm(e){onMove(e.clientY);}function mu(){onEnd();}
  function tm(e){e.preventDefault();onMove(e.touches[0].clientY);}function tu(){onEnd();}
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
  document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',tu);
}
