<style>













































































@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cloud);color:var(--ink);}
:root{
  --fs-label: 9px; --fs-caption: 10px; --fs-small: 11px; --fs-body: 12px;
  --fs-ui: 13px; --fs-card-title: 14px; --fs-page-title: 21px;
  --fs-stat: 24px; --fs-insight: 19px;
  --lav:#c9b8e8; --lav-lt:#ede8f7; --lav-md:#b09dd4;
  --lilac:#f0eaf9; --lilac2:#faf7fe;
  --plum:#6b5c8c; --blush:#f5d6e0; --blush-dk:#e8a4bd;
  --mint:#d4eedf; --mint-dk:#5cb87a;
  --butter:#fdf0cc; --butter-dk:#c9973d;
  --cloud:#f7f4fb; --gt:#6e6080; --gm:#a898bb; --ink:#3d2f5a; --white:#ffffff;
  --sh:0 2px 12px rgba(140,110,180,.10);
  --r-pill:999px; --r-lg:18px; --r-md:12px;
  --font:'Nunito',sans-serif;
}

/* ── Layout ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.hdr{display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;
  background:var(--white);border-bottom:2px solid var(--lav-lt);flex-shrink:0;z-index:100;}
.logo{font-size:var(--fs-card-title);font-weight:900;color:var(--plum);display:flex;align-items:center;gap:6px;}
.logo-sub{font-size:var(--fs-small);font-weight:700;color:var(--gm);letter-spacing:.3px;}
.storage-badge{font-size:var(--fs-label);font-weight:800;padding:3px 8px;border-radius:var(--r-pill);
  background:var(--lilac);color:var(--plum);cursor:pointer;transition:background .15s;}
.storage-badge:hover{background:var(--lav-lt);}
.istrip{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:stretch;
  background:var(--lilac);border-bottom:2px solid var(--lav-lt);
  overflow-x:auto;-webkit-overflow-scrolling:touch;user-select:none;position:relative;}
.ic{flex:0 0 auto;min-width:110px;padding:10px 16px;border-right:1.5px solid var(--lav-lt);
  position:relative;cursor:default;transition:background .15s;}
.ic:last-child{border-right:none;}
.ic.ic-dragging{opacity:.3;}
.ic-edit-end{flex:0 0 44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:.4;font-size:14px;transition:opacity .15s;}
.ic-edit-end:hover{opacity:.9;}
.il{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--gm);margin-bottom:3px;}
.iv{font-size:var(--fs-insight);font-weight:900;color:var(--plum);line-height:1.1;}
.is{font-size:var(--fs-caption);font-weight:600;color:var(--gm);margin-top:2px;}
.body{display:flex;flex:1;overflow:hidden;}
.sb{width:220px;flex-shrink:0;background:var(--white);border-right:2px solid var(--lav-lt);
  display:flex;flex-direction:column;overflow:hidden;}
.sb-nav{display:flex;flex-direction:column;gap:4px;padding:12px 10px;}
.nb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);
  font-size:var(--fs-body);font-weight:700;color:var(--gt);cursor:pointer;transition:all .15s;border:none;
  background:none;font-family:var(--font);text-align:left;width:100%;}
.nb:hover{background:var(--lilac);color:var(--plum);}
.nb.active{background:var(--lilac);color:var(--plum);font-weight:800;}
.sb-div{height:1px;background:var(--lav-lt);margin:6px 10px;}
.add-sess{display:block;margin:0 10px;padding:9px 12px;background:var(--lilac);
  border-radius:var(--r-md);font-size:var(--fs-body);font-weight:800;color:var(--plum);
  cursor:pointer;text-align:center;border:1.5px solid var(--lav-lt);}
.add-sess:hover{background:var(--lav-lt);}
.clear-btn{margin:6px 10px 10px;padding:7px 12px;font-size:var(--fs-caption);font-weight:700;
  color:var(--gm);cursor:pointer;text-align:center;border-radius:var(--r-md);border:none;
  background:none;font-family:var(--font);}
.clear-btn:hover{background:var(--blush);color:#8a3055;}
.ct{flex:1;overflow-y:auto;padding:20px;}
.view{max-width:900px;margin:0 auto;}
.pt{font-size:var(--fs-page-title);font-weight:900;color:var(--plum);margin-bottom:4px;}
.ps{font-size:var(--fs-body);color:var(--gt);margin-bottom:14px;line-height:1.5;}

/* ── Cards ── */
.card{background:var(--white);border-radius:var(--r-lg);border:2px solid var(--lav-lt);
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh);}
.ct-title{font-size:var(--fs-card-title);font-weight:800;color:var(--plum);margin-bottom:3px;}
.ct-sub{font-size:var(--fs-small);font-weight:600;color:var(--gt);margin-bottom:12px;}

/* ── Stat grids ── */
.sg{display:grid;gap:12px;margin-bottom:16px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.sc{background:var(--white);border-radius:var(--r-md);border:2px solid var(--lav-lt);
  padding:14px 16px;box-shadow:var(--sh);}
.sl{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--gm);margin-bottom:4px;}
.sv{font-size:var(--fs-stat);font-weight:900;color:var(--plum);line-height:1.1;}
.su2{font-size:var(--fs-body);font-weight:700;color:var(--gm);}
.sn{font-size:var(--fs-caption);font-weight:600;color:var(--gm);margin-top:3px;}

/* ── Tables ── */
.tw{overflow-x:auto;border-radius:var(--r-lg);border:2px solid var(--lav-lt);margin-bottom:16px;}
table{border-collapse:collapse;width:100%;}
th{padding:9px 13px;font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1px;color:var(--gm);background:var(--lilac);text-align:left;
  border-bottom:2px solid var(--lav-lt);}
td{padding:9px 13px;font-size:var(--fs-body);border-bottom:1px solid var(--lav-lt);}
tr:last-child td{border-bottom:none;}
tr.sess-row:hover td{background:var(--lilac);}
.td-spd{font-weight:900;color:var(--plum);}
.td-hr{font-weight:700;color:#c0406a;}

/* ── Focus pills & badges ── */
.focus-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:var(--r-pill);font-size:var(--fs-caption);font-weight:800;}
.badge{display:inline-flex;align-items:center;font-size:var(--fs-caption);
  font-weight:800;padding:2px 8px;border-radius:var(--r-pill);margin-top:4px;}
.b-up{background:var(--mint);color:#2d7a4a;}
.b-dn{background:var(--blush);color:#8a3055;}

/* ── Notices ── */
.notice{padding:10px 14px;border-radius:var(--r-md);font-size:var(--fs-body);
  font-weight:600;margin-bottom:14px;}
.n-orange{background:#fff3e0;color:#8a5c00;border:1.5px solid #ffe0a0;}
.n-blue{background:#e3f0ff;color:#1a5ca0;border:1.5px solid #b3d4ff;}
.n-green{background:var(--mint);color:#2d7a4a;border:1.5px solid var(--mint-dk);}

/* ── Sidebar session items ── */
.si{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--lav-lt);
  border-left:3px solid transparent;transition:all .15s;}
.si:hover,.si.active{background:var(--lilac);border-left-color:var(--plum);}
.si-spd{font-size:var(--fs-card-title);font-weight:900;line-height:1;}
.si-date{font-size:var(--fs-body);font-weight:700;color:var(--ink);margin-top:2px;}
.si-meta{font-size:var(--fs-caption);font-weight:600;color:var(--gm);margin-top:1px;}

/* ── Charts ── */
canvas{display:block;width:100%;}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:var(--fs-caption);font-weight:700;}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* ── Bar chart ── */
.bb{height:8px;background:var(--lav-lt);border-radius:4px;overflow:hidden;}
.bf{height:100%;border-radius:4px;transition:width .3s;}

/* ── Auth tabs ── */
.tabs{display:flex;background:var(--lav-lt);padding:4px;border-radius:var(--r-pill);
  width:100%;margin-bottom:24px;}
.tab{flex:1;text-align:center;padding:9px 8px;font-size:var(--fs-body);font-weight:700;
  color:var(--gm);background:none;border:none;border-radius:calc(var(--r-pill) - 3px);
  cursor:pointer;font-family:var(--font);transition:all .15s;}
.tab.active{background:var(--white);color:var(--plum);font-weight:800;
  box-shadow:0 1px 5px rgba(140,110,180,.14);}
.tab:hover:not(.active){color:var(--plum);}

/* ── Segment compare ── */
.seg-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.seg-tab{padding:6px 14px;border-radius:var(--r-pill);font-size:var(--fs-small);
  font-weight:800;border:1.5px solid var(--lav);background:var(--white);
  color:var(--gt);cursor:pointer;font-family:var(--font);}
.seg-tab.active{background:var(--plum);color:var(--white);border-color:var(--plum);}
.compare-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:var(--lilac);border-radius:var(--r-md);border:1.5px solid var(--lav-lt);
  margin-bottom:14px;flex-wrap:wrap;}
.wleg{padding:8px 12px;border-radius:var(--r-md);cursor:pointer;
  border:1.5px solid transparent;transition:all .15s;font-size:var(--fs-small);}
.wleg.active,.wleg:hover{border-color:var(--lav);}
.zone-bar{height:12px;border-radius:6px;margin:2px 0;}

/* ── Date filter ── */
.date-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.df-chip{padding:4px 12px;border-radius:var(--r-pill);font-size:var(--fs-caption);
  font-weight:800;border:1.5px solid var(--lav);background:var(--white);
  color:var(--gt);cursor:pointer;font-family:var(--font);}
.df-chip.active{background:var(--plum);color:var(--white);border-color:var(--plum);}

/* ── DnD — unified ── */
.dnd-card-wrap,.ov-widget-wrap,.focus-group-wrap{position:relative;}
.dnd-card-wrap>.drag-handle,.ov-widget-wrap>.drag-handle,.focus-group-wrap>.drag-handle,.ic>.drag-handle{
  position:absolute;top:14px;right:14px;z-index:20;font-size:18px;line-height:1;
  color:var(--lav-md);cursor:grab;user-select:none;opacity:0;transition:opacity .15s,color .15s;padding:4px;border-radius:4px;}
.dnd-card-wrap:hover>.drag-handle,.ov-widget-wrap:hover>.drag-handle,
.focus-group-wrap:hover>.drag-handle,.ic:hover>.drag-handle{opacity:.5;}
.dnd-card-wrap>.drag-handle:hover,.ov-widget-wrap>.drag-handle:hover,
.focus-group-wrap>.drag-handle:hover,.ic>.drag-handle:hover{opacity:1;color:var(--plum);background:var(--lilac2);}
.dnd-card-wrap>.drag-handle:active,.ov-widget-wrap>.drag-handle:active,
.focus-group-wrap>.drag-handle:active,.ic>.drag-handle:active{cursor:grabbing;}
.dnd-card-wrap.dnd-dragging,.ov-widget-wrap.dnd-dragging,.focus-group-wrap.dnd-dragging,.ic.dnd-dragging{
  opacity:.35;outline:2px dashed var(--lav-md);outline-offset:2px;border-radius:14px;}
#dnd-ghost>.drag-handle{display:none;}

/* ── Overview widget DnD ── */
.ov-widget-wrap{margin-bottom:16px;}
.ov-widget-wrap>.drag-handle{position:absolute;top:10px;right:10px;font-size:16px;}

/* ── Focus group DnD ── */
.focus-group-wrap{position:relative;margin-bottom:0;}

/* ── Strip editor ── */
.strip-editor{position:fixed;top:62px;left:0;right:0;background:var(--white);
  border-bottom:2px solid var(--lav-lt);z-index:150;padding:14px 24px 18px;
  box-shadow:0 8px 32px rgba(140,110,180,.15);}
.strip-editor-title{font-size:var(--fs-label);font-weight:800;color:var(--plum);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;}
.strip-chips{display:flex;flex-wrap:wrap;gap:8px;}
.strip-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;
  border-radius:var(--r-pill);font-size:var(--fs-small);font-weight:700;
  border:1.5px solid var(--lav);background:var(--lilac2);color:var(--plum);
  cursor:pointer;transition:all .15s;}
.strip-chip.on{background:var(--plum);color:var(--white);border-color:var(--plum);}
.strip-chip:hover{transform:translateY(-1px);}

/* ── Weekly plan strip ── */
.week-plan-strip{background:linear-gradient(135deg,var(--lilac2) 0%,var(--white) 100%);
  border:2px solid var(--lav-lt);border-radius:var(--r-lg);padding:14px 16px 14px;
  margin-top:4px;margin-bottom:18px;}
.wps-title{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--gm);display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.week-plan-days{display:flex;flex-direction:row;gap:6px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;padding:4px 2px 6px;scrollbar-width:none;}
.week-plan-days::-webkit-scrollbar{display:none;}
.wpd{flex:0 0 calc((100% - 6*6px)/7);min-width:68px;border-radius:10px;padding:8px 6px;
  text-align:center;border:1.5px solid transparent;transition:all .15s;box-sizing:border-box;}
.wpd.today{border-color:currentColor;box-shadow:0 2px 10px rgba(0,0,0,.1);transform:translateY(-1px);}
.wpd.has-session{cursor:pointer;}
.wpd.has-session:hover{transform:translateY(-2px);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.wpd-dow{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.wpd-icon{font-size:18px;line-height:1.2;margin-bottom:2px;}
.wpd-label{font-size:var(--fs-caption);font-weight:700;line-height:1.3;}
.wpd-speed{font-size:var(--fs-small);font-weight:900;margin-top:3px;}

/* ── Session detail ── */
.sess-hdr{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.craft-sel{font-family:var(--font);font-size:var(--fs-small);font-weight:700;
  padding:5px 10px;border-radius:var(--r-md);border:1.5px solid var(--lav);
  background:var(--white);color:var(--ink);cursor:pointer;}
#sess-map{width:100%;display:block;}

/* ── Map ── */
#sess-map{width:100%;display:block;}

/* ── Plans page ── */
.plan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px;}
.plan-day{border-radius:var(--r-md);border:1.5px solid var(--lav-lt);padding:10px 8px;background:var(--white);}
.plan-day-label{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--gm);margin-bottom:6px;}

/* ── Buttons ── */
.btn-pill{font-family:var(--font);font-size:var(--fs-small);font-weight:800;
  padding:7px 16px;border-radius:var(--r-pill);border:1.5px solid var(--lav);
  background:var(--white);color:var(--plum);cursor:pointer;transition:opacity .15s;}
.btn-pill:hover{opacity:.8;}
.btn-pill-sm{font-size:var(--fs-caption);padding:4px 12px;}
.btn-up{background:none;border:none;font-family:var(--font);font-size:var(--fs-body);
  font-weight:800;color:var(--plum);cursor:pointer;padding:8px 16px;
  border-radius:var(--r-pill);transition:background .15s;}
.btn-up.active{background:var(--white);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.btn-up:hover{background:#b09dd4;color:var(--white);transform:translateY(-1px);}

/* ── Mobile ── */
@media(max-width:640px){
  .sb{display:none;}
  .mob-nav{display:flex!important;}
  .mob-fab{display:flex!important;}
  .pt{font-size:calc(var(--fs-page-title) - 3px);}
  .g4{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(2,1fr);}
  .week-plan-days .wpd{min-width:60px;}
  .ic-edit-end{display:none;}
  .istrip{display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;}
  .ic{flex:0 0 auto;min-width:100px;}
  .il{font-size:8px;}
  .strip-editor{padding:10px 14px 14px;}
  .tabs{margin-bottom:16px;} .tab{font-size:var(--fs-caption);padding:6px 8px;}
}
@media(min-width:641px) and (max-width:900px){
  .sb{width:64px;}
  .nb span{display:none;}
  .logo-sub{display:none;}
  .add-sess{font-size:0;padding:10px;}
}

/* ── Mobile nav ── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;
  background:var(--white);border-top:2px solid var(--lav-lt);z-index:200;
  justify-content:space-around;align-items:center;}
.mob-nb{display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:var(--fs-label);font-weight:800;color:var(--gm);cursor:pointer;
  padding:4px 12px;border-radius:var(--r-md);transition:color .15s;}
.mob-nb.active{color:var(--plum);}
.mob-fab{display:none;position:fixed;bottom:68px;right:16px;z-index:199;
  width:52px;height:52px;border-radius:50%;background:var(--plum);
  color:var(--white);font-size:24px;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(107,92,140,.4);cursor:pointer;border:none;font-family:var(--font);}

/* ── Animations ── */
@keyframes su{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes auth-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ── Utility ── */
.section-label{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--plum);margin-bottom:8px;}
.meta-text{font-size:var(--fs-caption);font-weight:600;color:var(--gm);}
.divider{border-top:1.5px solid var(--lav-lt);margin:14px 0;}


/* ── Mobile nav inner layout ── */
.mob-nav-inner{display:flex;height:56px;}
.mob-nb{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:var(--fs-label);font-weight:800;
  color:var(--gm);cursor:pointer;padding:4px 8px;border-radius:var(--r-md);
  transition:color .15s;border:none;background:none;font-family:var(--font);}
.mob-nb.active{color:var(--plum);}
.mob-nb-icon{font-size:20px;line-height:1;}
.mob-nb-label{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:.5px;}

/* ── Sessions drawer (mobile) ── */
.sess-drawer{
  display:none;position:fixed;bottom:56px;left:0;right:0;
  max-height:60vh;overflow-y:auto;background:var(--white);
  border-top:2px solid var(--lav-lt);z-index:198;
  box-shadow:0 -4px 20px rgba(140,110,180,.15);}

/* ── Header right ── */
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px;}

/* ── Sidebar nav items ── */
.sb-title{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--gm);padding:10px 12px 4px;display:block;}
.nb-icon{font-size:16px;line-height:1;flex-shrink:0;}
.nb-label{font-size:var(--fs-body);font-weight:700;line-height:1.2;}
.nb-meta{font-size:var(--fs-label);font-weight:600;color:var(--gm);}

/* ── Trim card ── */
.trim-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  flex-wrap: wrap;
  gap: 8px;
}
.trim-stat { text-align: center; min-width: 60px; }
.trim-stat-r { text-align: right; }
.trim-stat-label {
  display: block;
  font-size: var(--fs-label);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gm);
}
.trim-stat-val {
  font-size: var(--fs-card-title);
  font-weight: 900;
  color: var(--plum);
}
.trim-btns { display: flex; align-items: center; }













































































</style>

/* ═══════════════════════════════════════════════════════════

     PRIMARY KEY (user_id, key)
   );

   CREATE POLICY "users own their data" ON user_data
     FOR ALL USING (auth.uid() = user_id)
     WITH CHECK (auth.uid() = user_id);
═══════════════════════════════════════════════════════════ */

var SUPABASE_URL  = 'https://uepsvomcafyjxsuzdhsx.supabase.co';
var SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlcHN2b21jYWZ5anhzdXpkaHN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NTYxNzIsImV4cCI6MjA5NTMzMjE3Mn0.748_xFf5FUiUvAICfUFmkkwhm3tTLLhvZBM98oxfUOY';

/* ── Supabase REST helpers (no SDK needed — plain fetch) ── */
function sbHeaders(token) {
  var h = {
    'Content-Type': 'application/json',
    'apikey':       SUPABASE_KEY,
  };
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}

function sbGet(key, token, cb) {
  var uid = SB_SESSION && SB_SESSION.user ? SB_SESSION.user.id : null;
  var url = SUPABASE_URL + '/rest/v1/user_data?key=eq.' + encodeURIComponent(key) + '&select=value';
  if (uid) url += '&user_id=eq.' + encodeURIComponent(uid);
  fetch(url, { headers: sbHeaders(token) })
  .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(rows) { cb(null, rows.length ? rows[0].value : null); })
  .catch(function(e) { cb(e, null); });
}

function sbSet(key, value, token, cb) {
  fetch(SUPABASE_URL + '/rest/v1/user_data', {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(token), {
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    }),
    body: JSON.stringify({
      user_id:    SB_SESSION && SB_SESSION.user ? SB_SESSION.user.id : undefined,
      key:        key,
      value:      value,
      updated_at: new Date().toISOString()
    })
  })
  .then(function(r) { if (!r.ok) throw new Error(r.status); cb && cb(null); })
  .catch(function(e) { console.error('sbSet error:', e); cb && cb(e); });
}

function sbDel(key, token, cb) {
  fetch(SUPABASE_URL + '/rest/v1/user_data?key=eq.' + encodeURIComponent(key), {
    method: 'DELETE',
    headers: sbHeaders(token)
  })
  .then(function(r) { if (!r.ok) throw new Error(r.status); cb && cb(null); })
  .catch(function(e) { cb && cb(e); });
}

/* ── Auth state ── */
var SB_SESSION = null;   // { access_token, refresh_token, user: { id, email } }
var _sbSavePending = null;

function sbToken() { return SB_SESSION ? SB_SESSION.access_token : null; }

/* Sign up */
function sbSignUp(email, password, cb) {
  fetch(SUPABASE_URL + '/auth/v1/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_AUTH, 'Authorization': 'Bearer ' + SUPABASE_AUTH },
    body: JSON.stringify({ email: email, password: password })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) { cb(d.error.message || d.error, null); return; }
    cb(null, d);
  })
  .catch(function(e) { cb(e.message, null); });
}

/* Sign in */
function sbSignIn(email, password, cb) {
  fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_AUTH },
    body: JSON.stringify({ email: email, password: password })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error || d.error_description) { cb(d.error_description || d.error, null); return; }
    SB_SESSION = d;
    try { localStorage.setItem('sb_session', JSON.stringify(d)); } catch(e) {}
    cb(null, d);
  })
  .catch(function(e) { cb(e.message, null); });
}

/* Sign out */
function sbSignOut(cb) {
  fetch(SUPABASE_URL + '/auth/v1/logout', {
    method: 'POST',
    headers: sbHeaders(sbToken())
  })
  .then(function() {
    SB_SESSION = null;
    try { localStorage.removeItem('sb_session'); } catch(e) {}
    cb && cb();
  })
  .catch(function() {
    SB_SESSION = null;
    try { localStorage.removeItem('sb_session'); } catch(e) {}
    cb && cb();
  });
}

/* Refresh token */
function sbRefresh(refreshToken, cb) {
  fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_AUTH },
    body: JSON.stringify({ refresh_token: refreshToken })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) { cb(d.error, null); return; }
    SB_SESSION = d;
    try { localStorage.setItem('sb_session', JSON.stringify(d)); } catch(e) {}
    cb(null, d);
  })
  .catch(function(e) { cb(e.message, null); });
}

/* Restore session from localStorage on page load */
function sbRestoreSession(cb) {
  try {
    var raw = localStorage.getItem('sb_session');
    if (raw) {
      var sess = JSON.parse(raw);
      /* Check if access token is still fresh (JWT exp claim) */
      var parts = (sess.access_token || '').split('.');
      if (parts.length === 3) {
        var payload = JSON.parse(atob(parts[1]));
        var expiresAt = payload.exp * 1000;
        if (Date.now() < expiresAt - 60000) {
          SB_SESSION = sess;
          cb(null, sess);
          return;
        }
      }
      /* Token expired — try refresh */
      if (sess.refresh_token) {
        sbRefresh(sess.refresh_token, cb);
        return;
      }
    }
  } catch(e) {}
  cb(null, null);  /* no session */
}

/* ── Replace storage layer with Supabase ── */

/* Debounced save: batch rapid changes into one write per key */
var _sbPendingWrites = {};
function sbScheduleWrite(key, value) {
  _sbPendingWrites[key] = value;
  clearTimeout(_sbSavePending);
  _sbSavePending = setTimeout(function() {
    var writes = _sbPendingWrites;
    _sbPendingWrites = {};
    Object.keys(writes).forEach(function(k) {
      sbSet(k, writes[k], sbToken());
    });
  }, 500);
}

var _authMode = 'signin';
function authTab(mode) {
  _authMode = mode;
  ['signin','signup'].forEach(function(m) {
    var tab = document.getElementById('tab-'+m);
    if (tab) tab.classList.toggle('active', m === mode);
  });
  var form = document.getElementById('auth-form');
  if (form) form.innerHTML = renderAuthForm(mode);
}

function authError(msg) {
  var el = document.getElementById('auth-err');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function authSubmit(mode) {
  var email = (document.getElementById('auth-email')||{}).value || '';
  var pw    = (document.getElementById('auth-pw')||{}).value || '';
  var pw2   = (document.getElementById('auth-pw2')||{}).value || '';
  var btn   = document.getElementById('auth-btn');

  if (!email || !pw) { authError('Please enter your email and password.'); return; }
  if (mode === 'signup' && pw !== pw2) { authError('Passwords do not match.'); return; }
  if (pw.length < 6) { authError('Password must be at least 6 characters.'); return; }

  if (btn) { btn.textContent = '…'; btn.disabled = true; }

  if (mode === 'signup') {
    sbSignUp(email, pw, function(err) {
      if (err) { authError(err); if(btn){btn.textContent='Create account';btn.disabled=false;} return; }
      /* Auto sign in after signup */
      sbSignIn(email, pw, function(err2) {
        if (err2) { authError(err2); if(btn){btn.textContent='Create account';btn.disabled=false;} return; }
        bootApp();
      });
    });
  } else {
    sbSignIn(email, pw, function(err) {
      if (err) { authError(err); if(btn){btn.textContent='Sign in';btn.disabled=false;} return; }
      bootApp();
    });
  }
}

function authForgot() {
  var email = (document.getElementById('auth-email')||{}).value || '';
  if (!email) { authError('Enter your email address first.'); return; }
  fetch(SUPABASE_URL + '/auth/v1/recover', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_AUTH, 'Authorization': 'Bearer ' + SUPABASE_AUTH },
    body: JSON.stringify({ email: email })
  }).then(function() {
    authError('✓ Check your email for a password reset link.');
  });
}

function getDOW(dateStr){
  var y=+dateStr.slice(0,4),m=+dateStr.slice(4,6)-1,d=+dateStr.slice(6,8);
  return new Date(y,m,d).getDay();
}
function getFocus(s){
  if(!s) return null;
  /* Session-level override takes priority */
  if(SESSION_TAGS.hasOwnProperty(s.date)){
    var ov=SESSION_TAGS[s.date];
    if(ov===null||ov==='') return null; /* explicitly untagged */
    /* Find in FOCUS_OPTIONS first, then PROGRAM */
    var fo=FOCUS_OPTIONS.find(function(f){return f.id===ov;});
    if(fo) return fo;
    /* Fallback: search PROGRAM values */
    var pv=Object.values(PROGRAM).find(function(p){return p.id===ov;});
    if(pv) return pv;
  }
  /* Default: day-of-week from PROGRAM */
  return PROGRAM[getDOW(s.date)]||null;
}
function dateLabel(d){
  if(DLABELS[d])return DLABELS[d];
  var months=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return DLABELS[d]=months[+d.slice(4,6)]+' '+(+d.slice(6,8));
}

   COMPUTE ENGINE
═══════════════════════════════════════════ */
function recompute(){
  console.log('[recompute] SESSIONS='+SESSIONS.length);
  if(!SESSIONS.length){COMPUTED=null;return;}
  SESSIONS.sort(function(a,b){return a.date.localeCompare(b.date);});
  var dates=SESSIONS.map(function(s){return s.date;});
  var cellCount=new Map();
  SESSIONS.forEach(function(s){
    var seen=new Set();
    (s.strokes||[]).forEach(function(st){
      if(st.lt&&st.ln){var c=cellKey(st.lt,st.ln);if(!seen.has(c)){seen.add(c);cellCount.set(c,(cellCount.get(c)||0)+1);}}
    });
  });
  var corrThresh=Math.max(2,SESSIONS.length>=4?SESSIONS.length-1:2);

  function statsFor(strokes){
    var spds=strokes.map(function(s){return s.s;}).filter(function(v){return v!=null&&v>0.3;});
    var srs=strokes.map(function(s){return s.r;}).filter(function(v){return v!=null;});
    var hrs=strokes.map(function(s){return s.h;}).filter(function(v){return v!=null;});
    if(spds.length<3)return null;
    spds.sort(function(a,b){return a-b;});
    var n=spds.length;
    var mean=spds.reduce(function(a,b){return a+b;},0)/n;
    var median=n%2?spds[Math.floor(n/2)]:(spds[n/2-1]+spds[n/2])/2;
    var p25=spds[Math.floor(n*0.25)],p75=spds[Math.floor(n*0.75)];
    var std=Math.sqrt(spds.reduce(function(a,v){return a+(v-mean)*(v-mean);},0)/n);
    var hist=new Array(HIST_BINS.length-1).fill(0);
    spds.forEach(function(v){for(var i=0;i<HIST_BINS.length-1;i++){if(v>=HIST_BINS[i]&&v<HIST_BINS[i+1]){hist[i]++;break;}}});
    return{n:n,avg:mean,med:median,p25:p25,p75:p75,std:std,hist:hist,
      sr:srs.length?srs.reduce(function(a,b){return a+b;},0)/srs.length:null,
      hr:hrs.length?hrs.reduce(function(a,b){return a+b;},0)/hrs.length:null};
  }

  var corridor={};
  SESSIONS.forEach(function(s){
    var match=(s.strokes||[]).filter(function(st){
      return st.lt&&st.ln&&st.lt>=CORR_LAT_LO&&st.lt<=CORR_LAT_HI&&(cellCount.get(cellKey(st.lt,st.ln))||0)>=corrThresh;
    });
    var st=statsFor(match);
    if(st&&st.n>=5)corridor[s.date]=st;
  });

  var segments=ZONE_DEFS.map(function(zone){
    var sessions={};
    SESSIONS.forEach(function(s){
      var match=(s.strokes||[]).filter(function(st){
        return st.lt&&st.ln&&st.lt>=zone.latLo&&st.lt<zone.latHi&&(cellCount.get(cellKey(st.lt,st.ln))||0)>=2;
      });
      var st=statsFor(match);
      if(st&&st.n>=8)sessions[s.date]=st;
    });
    return{id:zone.id,label:zone.label,color:zone.color,sessions:sessions};
  });

  var byFocus={};
  SESSIONS.forEach(function(s){
    var f=getFocus(s);
    if(!f)return;
    if(!byFocus[f.id])byFocus[f.id]=[];
    byFocus[f.id].push(s);
    var craft=getCraft(s);var craftKey=f.id+'|'+craft;
    if(!byFocus[craftKey])byFocus[craftKey]=[];
    byFocus[craftKey].push(s);
  });

  COMPUTED={dates:dates,cellCount:cellCount,corridor:corridor,segments:segments,byFocus:byFocus};
  console.log('[recompute] COMPUTED set, byFocus keys:', Object.keys(byFocus));
}

function drawGrid(ctx,W,H,pad,minV,maxV,steps){
  steps=steps||4;var cH=H-pad.t-pad.b;
  ctx.strokeStyle='rgba(180,155,212,0.09)';ctx.lineWidth=1;
  for(var g=0;g<=steps;g++){
    var y=pad.t+(g/steps)*cH;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#a898bb';ctx.font='bold 10px Nunito';ctx.textAlign='right';
    ctx.fillText((maxV-(g/steps)*(maxV-minV)).toFixed(2),pad.l-5,y+4);
  }
}
function xLbl(ctx,H,x,label){ctx.fillStyle='#a898bb';ctx.font='bold 10px Nunito';ctx.textAlign='center';ctx.fillText(label,x,H-5);}
function bungee_diamond(ctx,x,y,r){ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();}
function datePill(date){var c=dateColor(date);return '<span class="pill" style="background:'+c+'22;color:'+c+'">'+dateLabel(date)+'</span>';}
function focusPill(s){var f=getFocus(s);if(!f)return '<span class="pill" style="background:var(--lav-lt);color:var(--plum)">'+s.sessionType+'</span>';return '<span class="focus-tag" style="background:'+f.colorLt+';color:'+f.color+';border-color:'+f.color+'40">'+f.icon+' '+f.shortLabel+'</span>';}

function renderOverview(el){

      +'<p style="color:var(--gm);margin-top:8px">Upload a SpeedCoach CSV or Suunto FIT file to get started.</p></div>';
    return;

  var bOnly     = ss.filter(function(s){return getFocus(s)&&getFocus(s).bungee;});
  var bestNB    = nonB.length ? nonB.reduce(function(m,s){return s.avgSpeed>m.avgSpeed?s:m;}) : null;
  var bestB     = bOnly.length? bOnly.reduce(function(m,s){return s.avgSpeed>m.avgSpeed?s:m;}) : null;
  var totalDist = ss.reduce(function(a,s){return a+s.totalDist;},0);

  /* Build sessions table rows */
  var rows='';
  ss.forEach(function(s){
    var f=getFocus(s);
    var sCraft=getCraft(s);
    var sameType=f?ss.filter(function(x){
      var xf=getFocus(x);return xf&&xf.id===f.id&&x.date!==s.date&&getCraft(x)===sCraft;
    }):[]; 
    rows+='<tr class="sess-row" data-date="'+s.date+'" style="cursor:pointer">';

    rows+='<td>'+getCraft(s)+'</td>';

    rows+='<td>'+s.elapsed.split('.')[0]+'</td>';
    rows+='<td class="td-spd" style="color:'+(f?f.color:'var(--plum)')+'">'+s.avgSpeed.toFixed(2)+' mph</td>';
    rows+='<td>'+s.avgStrokeRate.toFixed(0)+' spm</td>';
    rows+='<td class="td-hr">'+(s.avgHR?s.avgHR.toFixed(0)+' bpm':'—')+'</td>';
    /* Tide column */
    var tideStr='—';
    if(s._tide&&s._tide.interpHeight!=null){
      tideStr=s._tide.interpHeight.toFixed(1)+'ft '+(s._tide.trend==='rising'?'↑':'↓');
    }
    rows+='<td style="font-size:10px;color:var(--gt)">'+tideStr+'</td>';
    /* Conditions column */
    var wxStr='—';
    if(s._wx){
      var wspd=s._wx.windSpeed!=null?Math.round(s._wx.windSpeed)+'mph':'?';
      var wdir=s._wx.windDir!=null?windDirLabel(s._wx.windDir):'';
      wxStr=wspd+(wdir?' '+wdir:'');
    }
    rows+='<td style="font-size:10px;color:var(--gt)">'+wxStr+'</td>';

function drawOvSpeed(ss){
  var c=document.getElementById('ov-c');if(!c)return;
  var ctx=c.getContext('2d');var W=c.offsetWidth,H=175;c.width=W;c.height=H;
  var pad={t:22,r:18,b:30,l:50},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  var speeds=ss.map(function(s){return s.avgSpeed;});
  var minV=Math.min.apply(null,speeds)*0.95,maxV=Math.max.apply(null,speeds)*1.03;
  var n=ss.length;
  var xOf=function(i){return pad.l+(n<2?cW/2:i/(n-1)*cW);};
  var yOf=function(v){return pad.t+cH-((v-minV)/(maxV-minV))*cH;};
  drawGrid(ctx,W,H,pad,minV,maxV);
  var groups={};
  ss.forEach(function(s){var f=getFocus(s);var k=f?f.id:'other';if(!groups[k])groups[k]=[];groups[k].push(s);});

    ctx.stroke();ctx.setLineDash([]);
  });

function renderByFocus(el){

      +'<div class="ps">No sessions could be matched to a focus type. '

    if(hasTrend){
      cardHtml+='<div style="font-size:var(--fs-small);font-weight:700;color:var(--gm)">First: '
        +sess[sess.length-1].avgSpeed.toFixed(2)+' mph → Latest: '+sess[0].avgSpeed.toFixed(2)+' mph</div>';

  attachFocusDrag(bfContainer);

function drawFocusTrend(g,c){
  if(!c)c=document.getElementById('ft-'+g.focus.id.replace(/[^a-z0-9]/gi,'-')+'-'+(g.craft||''));
  if(!c)return;
  var ctx=c.getContext('2d');var W=c.offsetWidth,H=125;c.width=W;c.height=H;
  var sess=g.sessions,n=sess.length,f=g.focus;
  var pad={t:18,r:18,b:28,l:50},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  var speeds=sess.map(function(s){return s.avgSpeed;});
  var corrV=sess.map(function(s){return COMPUTED&&COMPUTED.corridor[s.date]?COMPUTED.corridor[s.date].avg:null;}).filter(function(v){return v;});
  var allV=speeds.concat(corrV);
  var minV=Math.min.apply(null,allV)*0.96,maxV=Math.max.apply(null,allV)*1.03;
  var xOf=function(i){return pad.l+(n<2?cW/2:i/(n-1)*cW);};
  var yOf=function(v){return pad.t+cH-((v-minV)/(maxV-minV))*cH;};
  drawGrid(ctx,W,H,pad,minV,maxV,3);
  if(corrV.length>=2){
    ctx.beginPath();ctx.strokeStyle=f.color+'44';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);
    sess.forEach(function(s,i){var cv=COMPUTED&&COMPUTED.corridor[s.date]?COMPUTED.corridor[s.date].avg:null;if(!cv)return;if(i===0)ctx.moveTo(xOf(i),yOf(cv));else ctx.lineTo(xOf(i),yOf(cv));});
    ctx.stroke();ctx.setLineDash([]);
  }
  if(n>1){
    var gr=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);gr.addColorStop(0,f.color+'22');gr.addColorStop(1,f.color+'00');
    ctx.beginPath();sess.forEach(function(s,i){if(i===0)ctx.moveTo(xOf(i),yOf(s.avgSpeed));else ctx.lineTo(xOf(i),yOf(s.avgSpeed));});
    ctx.lineTo(xOf(n-1),pad.t+cH);ctx.lineTo(xOf(0),pad.t+cH);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
    ctx.beginPath();ctx.strokeStyle=f.color;ctx.lineWidth=2.5;ctx.lineJoin='round';
    sess.forEach(function(s,i){if(i===0)ctx.moveTo(xOf(i),yOf(s.avgSpeed));else ctx.lineTo(xOf(i),yOf(s.avgSpeed));});ctx.stroke();
  }
  sess.forEach(function(s,i){
    var x=xOf(i),y=yOf(s.avgSpeed);
    ctx.beginPath();if(f.bungee)bungee_diamond(ctx,x,y,8);else ctx.arc(x,y,7,0,Math.PI*2);
    ctx.fillStyle=f.color;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.fill();ctx.stroke();
    ctx.fillStyle='#3d2f5a';ctx.font='bold 10px Nunito';ctx.textAlign='center';
    ctx.fillText(s.avgSpeed.toFixed(2),x,y-12);xLbl(ctx,H,x,dateLabel(s.date));
  });
}

function drawSessChart(s){
  var c=document.getElementById('sc-'+s.date)||document.getElementById('sc');if(!c)return;
  var W=0,wEl=c;while(wEl&&W===0){W=wEl.offsetWidth;wEl=wEl.parentElement;}if(!W)W=600;
  var ctx=c.getContext('2d');c.width=W;var H=175;c.height=H;
  var strokes=(s.strokes||[]).filter(function(x){return x.s&&x.s>0.3;});
  if(!strokes.length){
    /* Strokes not yet loaded — fetch and redraw */
    if(!s._loadingStrokes){
      s._loadingStrokes=true;
      sbGet(sessionDetailKey(s.date),sbToken(),function(err,detail){
        s._loadingStrokes=false;
        if(!err&&detail){s.strokes=detail.strokes||[];s.intervals=detail.intervals||[];}
        if(s.strokes.length) drawSessChart(s);
      });
    }
    return;
  }
  var pad={t:20,r:18,b:26,l:50},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  var speeds=strokes.map(function(x){return x.s;});
  var hrs=strokes.map(function(x){return x.h;}).filter(function(h){return h!=null;});
  var hasHR=hrs.length>0;
  var maxSP=Math.max.apply(null,speeds)*1.05;
  var minHR=hasHR?Math.min.apply(null,hrs)*0.97:60,maxHR=hasHR?Math.max.apply(null,hrs)*1.02:200;
  var n=strokes.length;
  var xOf=function(i){return pad.l+(n<2?cW/2:i/(n-1)*cW);};
  var yOf=function(v){return pad.t+cH-(v/maxSP)*cH;};
  var yHR=function(h){return pad.t+cH-((h-minHR)/(maxHR-minHR))*cH;};
  drawGrid(ctx,W,H,pad,0,maxSP);
  if(hasHR){ctx.beginPath();ctx.strokeStyle='rgba(192,64,106,0.33)';ctx.lineWidth=1.5;ctx.lineJoin='round';var stHR=false;strokes.forEach(function(s2,i){if(s2.h==null)return;var x=xOf(i),y=yHR(s2.h);if(stHR)ctx.lineTo(x,y);else ctx.moveTo(x,y);stHR=true;});ctx.stroke();}
  var f=getFocus(s);var col=f?f.color:'#9b8bb8';
  var gr=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);gr.addColorStop(0,col+'22');gr.addColorStop(1,col+'00');
  ctx.beginPath();strokes.forEach(function(s2,i){if(i===0)ctx.moveTo(xOf(i),yOf(s2.s));else ctx.lineTo(xOf(i),yOf(s2.s));});
  ctx.lineTo(xOf(n-1),pad.t+cH);ctx.lineTo(xOf(0),pad.t+cH);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineJoin='round';
  strokes.forEach(function(s2,i){if(i===0)ctx.moveTo(xOf(i),yOf(s2.s));else ctx.lineTo(xOf(i),yOf(s2.s));});ctx.stroke();
  if(s.intervals.length>1){
    var cur=strokes[0]?strokes[0].i:null;
    strokes.forEach(function(s2,i){if(s2.i!==cur){var x=xOf(i);ctx.strokeStyle='rgba(180,155,212,0.35)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+cH);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(124,111,160,0.45)';ctx.font='bold 9px Nunito';ctx.textAlign='center';ctx.fillText('I'+s2.i,x,pad.t+9);cur=s2.i;}});
  }
}

function parseCSV(text){
  var lines=text.split('\n');var meta={};var ss_start,is_start,ps_start;
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(l.indexOf('Start Time:')>=0)meta.startTime=(l.split(',')[1]||'').trim();
    if(l.indexOf('Type:')==0)meta.type=(l.split(',')[1]||'').trim();
    if(l.indexOf('Name:')==0)meta.name=(l.split(',')[1]||'').trim().replace(/^"|"$/g,'');
    if(l.indexOf('Session Summary:')>=0)ss_start=i;
    if(l.indexOf('Interval Summaries:')>=0)is_start=i;
    if(l.indexOf('Per-Stroke Data:')>=0){ps_start=i;break;}
  }
  if(ss_start==null||is_start==null||ps_start==null)return null;
  var ssH=(lines[ss_start+2]||'').split(',');var ssD=(lines[ss_start+4]||'').split(',');
  var ss={};ssH.forEach(function(h,i){ss[h.trim()]=ssD[i]?(ssD[i].trim()):null;});
  var intH=(lines[is_start+2]||'').split(',').map(function(h){return h.trim();});
  var intervals=lines.slice(is_start+4,ps_start-2).filter(function(l){return l.trim()&&l.indexOf('(')<0;}).map(function(row){
    var cells=row.split(',');var obj={};intH.forEach(function(h,i){obj[h]=cells[i]?(cells[i].trim()):null;});
    return{n:obj['Interval'],d:parseFloat(obj['Total Distance (GPS)'])||0,el:obj['Total Elapsed Time'],sp:obj['Avg Split (GPS)'],
      v:parseFloat(obj['Avg Speed (GPS)'])||0,sr:parseFloat(obj['Avg Stroke Rate'])||0,
      hr:isNaN(parseFloat(obj['Avg Heart Rate']))?null:parseFloat(obj['Avg Heart Rate']),
      lt:parseFloat(obj['Start GPS Lat.']),ln:parseFloat(obj['Start GPS Lon.'])};
  }).filter(function(r){return r.n&&r.n!=='(Interval)';});
  var psH=(lines[ps_start+2]||'').split(',').map(function(h){return h.trim();});
  var strokes=[];var psRows=lines.slice(ps_start+4);
  for(var i=0;i<psRows.length;i+=15){
    var cells=(psRows[i]||'').split(',');if(!cells[0]||cells[0]==='(Interval)')continue;
    var obj={};psH.forEach(function(h,j){obj[h]=cells[j]?(cells[j].trim()):null;});
    var hrV=parseFloat(obj['Heart Rate']);var lt=parseFloat(obj['GPS Lat.']),ln=parseFloat(obj['GPS Lon.']);
    if(isNaN(lt)||isNaN(ln))continue;
    strokes.push({e:obj['Elapsed Time'],s:parseFloat(obj['Speed (GPS)'])||null,r:parseFloat(obj['Stroke Rate'])||null,h:isNaN(hrV)?null:hrV,lt:lt,ln:ln,i:parseInt(obj['Interval'])||null});
  }
  var dm=meta.startTime?meta.startTime.match(/(\d{2})\/(\d{2})\/(\d{4})/):null;
  var dateStr=dm?(dm[3]+dm[1]+dm[2]):String(Date.now());
  var hasHR=strokes.some(function(s){return s.h!=null&&!isNaN(s.h);});
  return{date:dateStr,startTime:meta.startTime||'',sessionType:meta.type||'Unknown',programName:meta.name||'',
    avgSpeed:parseFloat(ss['Avg Speed (GPS)'])||0,totalDist:parseFloat(ss['Total Distance (GPS)'])||0,
    elapsed:ss['Total Elapsed Time']||'',avgStrokeRate:parseFloat(ss['Avg Stroke Rate'])||0,
    avgHR:isNaN(parseFloat(ss['Avg Heart Rate']))?null:parseFloat(ss['Avg Heart Rate']),
    startLat:intervals[0]?intervals[0].lt:0,startLon:intervals[0]?intervals[0].ln:0,hasHR:hasHR,intervals:intervals,strokes:strokes};
}

function handleFileUpload(evtOrFiles) {
  var files = evtOrFiles && evtOrFiles.target
    ? Array.from(evtOrFiles.target.files)
    : Array.isArray(evtOrFiles) ? evtOrFiles
    : evtOrFiles ? Array.from(evtOrFiles) : [];
  if (!files.length) return;
  var added = 0;

  function next(i) {
    if (i >= files.length) {
      if (added > 0) {
        SESSIONS.sort(function(a,b){return a.date.localeCompare(b.date);});
        SEL = SESSIONS[SESSIONS.length-1].date;
        saveToStorage();
        showToast('🦭 '+added+' session'+(added>1?'s':'')+' saved! Fetching conditions…','success');
        fetchAllWeather(function(){ fetchAllTides(function(){ refresh(); }); });
      }
      ['fi','file-input','file-input2'].forEach(function(id){
        var el=document.getElementById(id); if(el)el.value='';
      });
      return;
    }
    var file=files[i];
    var name=(file.name||'').toLowerCase();
    if (name.endsWith('.fit')) {
      file.arrayBuffer().then(function(buf){
        parseFIT(buf, file.name, function(err, s){
          if(err){ showToast('⚠️ Could not parse '+file.name+': '+(err.message||err),'error'); }
          else if(s){
            if(!SESSIONS.some(function(x){return x.date===s.date;})){
              SESSIONS.push(s); saveSessionDetail(s); added++;
            } else { showToast('Session '+dateLabel(s.date)+' already saved','warn'); }
          }
          next(i+1);
        });
      }).catch(function(){showToast('⚠️ Could not read '+file.name,'error');next(i+1);});
    } else {
      file.text().then(function(text){
        try{
          var s=parseCSV(text);
          if(s&&!SESSIONS.some(function(x){return x.date===s.date;})){
            SESSIONS.push(s);
            saveSessionDetail(s); /* persist strokes */
            added++;
          }
          else if(s){showToast('Session '+dateLabel(s.date)+' already saved','warn');}
        }catch(err){console.error('CSV parse error',err);showToast('⚠️ Could not parse '+file.name,'error');}
        next(i+1);
      });
    }
  }
  next(0);
}

// Keep a copy of the embedded seeds so we can restore if user clears
/* ═══════════════════════════════════════════
   WEATHER — Open-Meteo Historical API
   Free, no key needed, works for ocean coords
   Fetches hourly wind speed + direction + wave
   height for the hour matching session start.
   Cached in localStorage under pawddle_wx_<date>
═══════════════════════════════════════════ */
var WX_CACHE_PREFIX='pawddle_wx_';

function windDirLabel(deg){
  var dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg/22.5)%16];
}
function mpsToMph(mps){return (mps*2.237).toFixed(1);}

function fetchWeather(session, callback){
  var cacheKey=WX_CACHE_PREFIX+session.date;
  // Check cache
  try{
    var cached=localStorage.getItem(cacheKey);
    if(cached){var wx=JSON.parse(cached);callback(null,wx);return;}
  }catch(e){}

  // Parse session date + hour
  var y=session.date.slice(0,4);
  var mo=session.date.slice(4,6);
  var d=session.date.slice(6,8);
  var dateStr=y+'-'+mo+'-'+d;

  // Use session start lat/lon if available, else startLat/startLon
  var lat=session.startLat||36.964;
  var lon=session.startLon||-122.003;

  // Determine if open water (lon < -122.01 roughly = more exposed)
  // We'll fetch both surface wind and wave height (GFS Wave model)
  var url='https://archive-api.open-meteo.com/v1/archive'
    +'?latitude='+lat.toFixed(4)
    +'&longitude='+lon.toFixed(4)
    +'&start_date='+dateStr
    +'&end_date='+dateStr
    +'&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,wave_height,wave_direction,wave_period'
    +'&wind_speed_unit=mph'
    +'&timezone=America%2FLos_Angeles';

  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      // Parse start hour from startTime e.g. "04/30/2026 18:34:39"
      var hourMatch=session.startTime.match(/(\d{2}):(\d{2}):\d{2}$/);
      var startHour=hourMatch?parseInt(hourMatch[1]):12;
      // Also grab the next 2 hours for session duration
      var hours=data.hourly;
      var times=hours.time||[];
      var idx=times.findIndex(function(t){
        return parseInt(t.slice(11,13))===startHour;
      });
      if(idx<0)idx=startHour; // fallback

      function avg2(arr,i){
        if(!arr||!arr.length)return null;
        var vals=[arr[i],arr[i+1],arr[i+2]].filter(function(v){return v!=null;});
        return vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
      }
      function pick(arr,i){return arr&&arr[i]!=null?arr[i]:null;}

      var wx={
        windSpeed: avg2(hours.wind_speed_10m,idx),       // mph
        windDir:   pick(hours.wind_direction_10m,idx),    // degrees
        windGust:  avg2(hours.wind_gusts_10m,idx),        // mph
        waveHeight:avg2(hours.wave_height,idx),           // metres (may be null inland)
        waveDir:   pick(hours.wave_direction,idx),
        wavePeriod:avg2(hours.wave_period,idx),
        hour:      startHour,
        fetchedAt: Date.now(),
      };
      // Cache
      try{localStorage.setItem(cacheKey,JSON.stringify(wx));}catch(e){}
      callback(null,wx);
    })
    .catch(function(err){callback(err,null);});
}

function fetchAllWeather(callback){
  var sessions=SESSIONS.filter(function(s){return !s._wx;});
  if(!sessions.length){callback();return;}
  var BATCH=3,DELAY=400,done=0,total=sessions.length;
  function runBatch(start){
    var batch=sessions.slice(start,start+BATCH);
    if(!batch.length){callback();return;}
    var batchDone=0;
    batch.forEach(function(s){
      fetchWeather(s,function(err,wx){
        if(!err&&wx) s._wx=wx;
        done++;batchDone++;
        if(batchDone===batch.length){
          if(done>=total)callback();
          else setTimeout(function(){runBatch(start+BATCH);},DELAY);
        }
      });
    });
  }
  runBatch(0);
}

function wxBadge(session){
  var wx=session._wx;
  if(!wx)return '<span style="font-size:10px;color:var(--gm)">loading…</span>';
  var html='<span style="font-size:11px;font-weight:700;color:var(--ink)">';
  html+='💨 '+wx.windSpeed.toFixed(1)+' mph '+windDirLabel(wx.windDir);
  if(wx.windGust&&wx.windGust>wx.windSpeed+3) html+=' (gusts '+wx.windGust.toFixed(0)+')';
  if(wx.waveHeight!=null&&wx.waveHeight>0.05) html+=' · 🌊 '+wx.waveHeight.toFixed(2)+'m';
  html+='</span>';
  return html;
}

function windDirRelative(windDeg, headingDeg) {
  /* Returns angle between wind direction FROM and paddling heading
     0 = straight headwind, 180 = tailwind, 90 = crosswind */
  var diff = ((windDeg - headingDeg) + 360) % 360;
  return diff > 180 ? 360 - diff : diff;
}

function paddlingHeading(session) {
  /* Estimate outbound heading from the first third of GPS strokes (more reliable than endpoints) */
  var strokes = (session.strokes||[]).filter(function(s){
    return s.lt && s.ln && Math.abs(s.lt) > 1;
  });
  if (strokes.length < 10) return null;
  /* Use first third of stroke positions to get outbound heading */
  var seg = strokes.slice(0, Math.max(10, Math.floor(strokes.length / 3)));
  var dlat = seg[seg.length-1].lt - seg[0].lt;
  var dlon = (seg[seg.length-1].ln - seg[0].ln) * Math.cos(seg[0].lt * Math.PI / 180);
  if (Math.abs(dlat) < 0.0001 && Math.abs(dlon) < 0.0001) {
    /* Too little movement — fall back to overall heading */
    var last = strokes[strokes.length-1];
    dlat = last.lt - strokes[0].lt;
    dlon = (last.ln - strokes[0].ln) * Math.cos(strokes[0].lt * Math.PI / 180);
  }
  return (Math.atan2(dlon, dlat) * 180 / Math.PI + 360) % 360;
}

function swellDifficultyLabel(angleDeg, heightM, periodS) {
  /* Returns {label, severity: 0-3, note} */
  var h = heightM || 0;
  var p = periodS || 0;
  if (h < 0.15) return { label: 'Calm', severity: 0, note: 'Negligible swell' };

  /* Swell energy proxy: height² × period */
  var energy = h * h * p;
  var hFt    = (h * 3.281).toFixed(1);
  var hLabel = hFt + ' ft';
  if (p > 0) hLabel += ' @ ' + p.toFixed(0) + 's';

  var angle = ((angleDeg % 360) + 360) % 360;
  if (angle > 180) angle = 360 - angle;   /* 0=head-on, 90=side, 180=following */

  if (angle <= 30) {
    /* Head-on or nearly head-on */
    var sev = energy > 2 ? 3 : energy > 0.5 ? 2 : 1;
    return { label: 'Head swell', severity: sev,
      note: hLabel + ' swell — paddling into it. Expect significant resistance and hull pounding.' };
  } else if (angle >= 150) {
    /* Following */
    var sev = energy > 3 ? 2 : 1;
    return { label: 'Following swell', severity: Math.max(0,sev-1),
      note: hLabel + ' following swell — can help on outbound, watch for broaching on return.' };
  } else if (angle >= 60 && angle <= 120) {
    /* Side swell — most fatiguing for stability */
    var sev = energy > 1.5 ? 3 : energy > 0.4 ? 2 : 1;
    return { label: 'Side swell', severity: sev,
      note: hLabel + ' side swell — constant brace/stabilisation effort. Significantly higher energy cost than flat water.' };
  } else if (angle < 60) {
    var sev = energy > 1 ? 2 : 1;
    return { label: 'Quartering head swell', severity: sev,
      note: hLabel + ' quartering into swell — harder outbound, some relief on the return.' };
  } else {
    var sev = energy > 1 ? 1 : 0;
    return { label: 'Quartering following swell', severity: sev,
      note: hLabel + ' quartering following swell — manageable, slight speed boost downwind leg.' };
  }
}

function wxExposureNote(session) {
  var wx = session._wx;
  if (!wx) return '';
  var windMph  = wx.windSpeed || 0;
  var heading  = paddlingHeading(session);
  var notes    = [];

  /* Wind analysis */
  if (windMph > 15) {
    if (heading != null) {
      var wRel = windDirRelative(wx.windDir || 0, heading);
      var wType = wRel < 40 ? 'headwind' : wRel > 140 ? 'tailwind' : 'crosswind';
      notes.push('Strong ' + wType + ' (' + Math.round(windMph) + ' mph ' + windDirLabel(wx.windDir) + ')');
    } else {
      notes.push('Strong wind (' + Math.round(windMph) + ' mph ' + windDirLabel(wx.windDir) + ')');
    }
  } else if (windMph > 8) {
    notes.push('Moderate wind (' + Math.round(windMph) + ' mph ' + windDirLabel(wx.windDir) + ')');
  }

  /* Wave/swell analysis */
  if (wx.waveHeight != null && wx.waveHeight > 0.1) {
    if (heading != null && wx.waveDir != null) {
      var swellAngle = windDirRelative(wx.waveDir, heading);
      var diff = swellDifficultyLabel(swellAngle, wx.waveHeight, wx.wavePeriod);
      notes.push(diff.note);
    } else {
      var hFt = (wx.waveHeight * 3.281).toFixed(1) + ' ft';
      if (wx.wavePeriod) hFt += ' @ ' + wx.wavePeriod.toFixed(0) + 's';
      notes.push(hFt + ' swell — ' + windDirLabel(wx.waveDir) + ' direction');
    }
  }

  /* Combined difficulty rating */
  var totalSeverity = 0;
  if (windMph > 20) totalSeverity += 2;
  else if (windMph > 12) totalSeverity += 1;
  if (wx.waveHeight && wx.waveHeight > 0.5) totalSeverity += 2;
  else if (wx.waveHeight && wx.waveHeight > 0.2) totalSeverity += 1;
  var diffLabel = totalSeverity >= 4 ? '🔴🔴 Extreme' : totalSeverity >= 3 ? '🔴 Hard'
    : totalSeverity >= 2 ? '⚠️ Moderate' : totalSeverity >= 1 ? 'Manageable' : 'Flat water';
  notes.push('Overall: ' + diffLabel);
  if (!notes.length) notes.push('Light conditions — good comparison day');
  return notes.join(' · ');
}

/* ═══════════════════════════════════════════
   SESSION TAGS — manual overrides
   Stored in localStorage: pawddle_tags
   Structure: { "20260430": "bungee", "20260507": null }
   null = remove the auto-detected tag entirely
   string = override with this focus id
═══════════════════════════════════════════ */

var SESSION_TAGS={};

function loadTags(){
  try{
    var raw=_store[TAGS_KEY];
    if(!raw)return;
    var stored=typeof raw==='string'?JSON.parse(raw):raw;
    if(stored){SESSION_TAGS=stored;}
  }catch(e){}
}
function setSessionTag(date, focusId){
  // focusId = null removes override (back to auto), '' = untagged, or a PROGRAM id
  if(focusId===undefined||focusId==='auto'){
    delete SESSION_TAGS[date];
  } else {
    SESSION_TAGS[date]=focusId;
  }
  saveTags();
  refresh();
}


/* Tag editor UI — rendered inside session detail */
function renderTagEditor(session){
  var hasOverride = SESSION_TAGS.hasOwnProperty(session.date);
  var autoFocus   = PROGRAM[getDOW(session.date)] || null;
  var currentVal  = hasOverride
    ? (SESSION_TAGS[session.date] === null ? '' : (SESSION_TAGS[session.date] || ''))
    : 'auto';

  function opt(val, label) {
    return '<option value="'+escHtml(val)+'"'+(currentVal===val?' selected':'')+'>'+escHtml(label)+'</option>';
  }

  var options = opt('auto', autoFocus ? 'Auto: '+autoFocus.shortLabel : 'Auto: untagged');
  options += opt('', '— No focus tag —');
  FOCUS_OPTIONS.forEach(function(p) {
    if (!p.id) return;
    options += opt(p.id, (p.icon ? p.icon+' ' : '')+p.label);
  });

  var onchange = 'setSessionTag(\'' + session.date + '\',this.value)';
  return '<div style="display:flex;align-items:center;gap:10px;background:var(--lilac2);border:1.5px solid var(--lav-lt);border-radius:10px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap">'
    +'<span style="font-size:11px;font-weight:800;color:var(--plum)">🏷 Session tag:</span>'
    +'<select id="tag-select" onchange="'+onchange+'" '
    +'style="font-family:var(--font);font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;border:1.5px solid var(--lav);background:var(--white);color:var(--ink);cursor:pointer">'
    +options+'</select>'
    +(hasOverride
      ? '<span style="font-size:10px;font-weight:700;color:#f5a623">⚡ overridden</span>'
      : '<span style="font-size:10px;font-weight:600;color:var(--gm)">auto-detected</span>')
    +'</div>';
}
function renderWeatherCard(session){
  var wx = session._wx;
  var heading = paddlingHeading(session);
  /* Open water = wave data available and meaningful (not suppressed by land) */
  var hasWave = wx && wx.waveHeight != null && wx.waveHeight > 0.1;
  var isOpenWater = hasWave || (session.startLon && Math.abs(session.startLon) > 10);

  var html = '<div class="card dnd-card" data-card-id="weather">';
  html += '<div class="ct-title">🌬️ Session Conditions</div>';
  html += '<div class="ct-sub">Open-Meteo ERA5 reanalysis · hourly at session GPS · ';
  html += (isOpenWater ? '<b style="color:#3a7abf">open water</b>' : 'nearshore') + '</div>';

  if (!wx) {
    html += '<div style="font-size:12px;font-weight:600;color:var(--gm);padding:8px 0">Fetching weather data…</div>';
    html += '</div>'; return html;
  }

  var windColor = wx.windSpeed > 15 ? '#c0406a' : wx.windSpeed > 8 ? '#c9973d' : '#2e7a4a';
  var windRel   = (heading != null && wx.windDir != null)
    ? windDirRelative(wx.windDir, heading) : null;
  var windTypeLabel = windRel != null
    ? (windRel < 40 ? '↑ headwind' : windRel > 140 ? '↓ tailwind' : '↔ crosswind') : '';

  /* ── Wind row ── */
  html += '<div class="sg g4" style="margin-bottom:12px">';
  html += '<div class="sc"><div class="sl">Wind Speed</div>'
        + '<div class="sv" style="color:'+windColor+'">'+(wx.windSpeed!=null?wx.windSpeed.toFixed(1):'—')
        + '<span class="su2"> mph</span></div>'
        + (windTypeLabel ? '<div style="font-size:9px;font-weight:800;color:'+windColor+';margin-top:1px">'+windTypeLabel+'</div>' : '')
        + '</div>';
  html += '<div class="sc"><div class="sl">Wind Direction</div>'
        + '<div class="sv" style="font-size:16px">'+(wx.windDir!=null ? windDirLabel(wx.windDir) : '—')+'</div>'
        + (wx.windGust != null ? '<div style="font-size:9px;font-weight:700;color:var(--gm)">Gust: '+wx.windGust.toFixed(0)+' mph</div>' : '')
        + '</div>';

  /* ── Wave row (open water only) ── */
  if (hasWave) {
    var swellDiff = null;
    if (heading != null && wx.waveDir != null) {
      var swellAngle = windDirRelative(wx.waveDir, heading);
      swellDiff = swellDifficultyLabel(swellAngle, wx.waveHeight, wx.wavePeriod);
    }
    var sevColors = ['#2e7a4a','#c9973d','#c0406a','#8a1a3a'];
    var sevLabels = ['','⚠️','🔴','🔴🔴'];
    var sevColor  = swellDiff ? sevColors[swellDiff.severity] : '#3a7abf';

    html += '<div class="sc"><div class="sl">Wave Height</div>'
          + '<div class="sv" style="color:'+sevColor+'">'+(wx.waveHeight*3.281).toFixed(1)
          + '<span class="su2"> ft</span></div>'
          + '<div style="font-size:9px;font-weight:700;color:var(--gm)">'+(wx.waveHeight*100).toFixed(0)+' cm</div>'
          + '</div>';
    html += '<div class="sc"><div class="sl">Wave Period</div>'
          + '<div class="sv">'+(wx.wavePeriod!=null?wx.wavePeriod.toFixed(0):'—')
          + '<span class="su2"> s</span></div>'
          + (wx.waveDir!=null ? '<div style="font-size:9px;font-weight:700;color:var(--gm)">From '+windDirLabel(wx.waveDir)+'</div>' : '')
          + '</div>';
    html += '</div>'; /* close sg */

    /* ── Swell difficulty analysis ── */
    if (swellDiff) {
      var bgCol  = ['#f0faf4','#fff8ec','#fff0f3','#fce8ee'][swellDiff.severity];
      var bdCol  = ['#a8d5b5','#f5c87a','#e8a0b0','#c0406a'][swellDiff.severity];
      html += '<div style="background:'+bgCol+';border:1.5px solid '+bdCol+';border-radius:10px;padding:10px 14px;margin-top:4px">';
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">';
      html += '<span style="font-size:11px;font-weight:900;color:'+sevColor+'">'
            + (sevLabels[swellDiff.severity]||'') + ' ' + swellDiff.label + '</span>';
      if (heading != null) {
        var swellAngle2 = windDirRelative(wx.waveDir, heading);
        html += '<span style="font-size:10px;font-weight:700;color:var(--gm)">'
              + Math.round(swellAngle2) + '° off bow</span>';
      }
      html += '</div>';
      html += '<div style="font-size:11px;font-weight:600;color:var(--gt);line-height:1.5">'
            + swellDiff.note + '</div>';

      /* Return-leg analysis — always shown when heading known */
      if (heading != null && wx.waveDir != null) {
        var returnHeading = (heading + 180) % 360;
        var returnSwellAngle = windDirRelative(wx.waveDir, returnHeading);
        var returnAngle = returnSwellAngle; /* alias for compat */
        var returnDiff    = swellDifficultyLabel(returnAngle, wx.waveHeight, wx.wavePeriod);
        if (returnDiff.label !== swellDiff.label) {
          html += '<div style="font-size:10px;font-weight:700;color:var(--gm);margin-top:6px;padding-top:6px;border-top:1px solid '+bdCol+'">'
                + '↩ Return leg: <b>' + returnDiff.label + '</b> — ' + returnDiff.note + '</div>';
        }
      }
      html += '</div>';
    }
  } else {
    html += '</div>'; /* close sg */
    if (isOpenWater) {
      html += '<div style="font-size:11px;font-weight:600;color:var(--gm);padding:4px 0">No significant swell</div>';
    }
  }

  /* ── Exposure note ── */
  var note = wxExposureNote(session);
  if (note) {
    html += '<div style="font-size:10px;font-weight:700;color:var(--gt);margin-top:8px;padding-top:8px;'
          + 'border-top:1px solid var(--lav-lt);line-height:1.6">' + note + '</div>';
  }

  html += '</div>';
  return html;
}




/* ═══════════════════════════════════════════════════════
   SESSION TRIM
   Adds a "Trim session" card to session detail.
   Shows the speed profile with draggable start/end handles.
   Trimming slices s.strokes and recomputes avgSpeed,
   totalDist, elapsed, avgHR, avgStrokeRate.
═══════════════════════════════════════════════════════ */

function renderTrimCard(s) {
  if (!s.strokes || s.strokes.length < 4) return '';
  var cardId = 'trim-' + s.date;
  return '<div class="card dnd-card" data-card-id="trim">'
    + '<div class="ct-title">✂️ Trim Session</div>'
    + '<div class="ct-sub">Drag the handles to remove warm-up and cool-down</div>'
    + '<canvas id="' + cardId + '" height="110" style="width:100%;display:block;border-radius:8px;cursor:crosshair"></canvas>'
    + '<div class="trim-controls">'
    +   '<div class="trim-stat"><span class="trim-stat-label">Start</span><span class="trim-stat-val" id="trim-start-' + s.date + '">0:00</span></div>'
    +   '<div class="trim-btns">'
    +     '<button class="btn-pill btn-pill-sm" onclick="applyTrim(\'' + s.date + '\')">✂️ Apply trim</button>'
    +     '<button class="btn-pill btn-pill-sm" style="margin-left:6px" onclick="resetTrim(\'' + s.date + '\')">↺ Reset</button>'
    +   '</div>'
    +   '<div class="trim-stat trim-stat-r"><span class="trim-stat-label">End</span><span class="trim-stat-val" id="trim-end-' + s.date + '">—</span></div>'
    + '</div>'
    + '</div>';
}

/* Trim state per session date */
var _trimState = {};  /* { date: { startIdx, endIdx } } */

function getTrimState(s) {
  if (!_trimState[s.date]) {
    _trimState[s.date] = { startIdx: 0, endIdx: (s.strokes||[]).length - 1 };
  }
  return _trimState[s.date];
}

function drawTrimChart(s) {
  var c = document.getElementById('trim-' + s.date);
  if (!c) return;
  var strokes = (s.strokes || []).filter(function(x) { return x.s && x.s > 0.1; });
  if (!strokes.length) return;

  var W = 0, el = c;
  while (el && W === 0) { W = el.offsetWidth; el = el.parentElement; }
  if (!W) W = 600;
  var H = 110;
  c.width = W; c.height = H;

  var state = getTrimState(s);
  /* Clamp to strokes length */
  state.endIdx = Math.min(state.endIdx, strokes.length - 1);

  var ctx = c.getContext('2d');
  var pad = { t: 8, r: 12, b: 8, l: 12 };
  var cW = W - pad.l - pad.r;
  var cH = H - pad.t - pad.b;
  var n = strokes.length;

  var speeds = strokes.map(function(x) { return x.s; });
  var maxSP = Math.max.apply(null, speeds) * 1.1 || 5;
  var xOf = function(i) { return pad.l + (n < 2 ? cW / 2 : i / (n-1) * cW); };
  var yOf = function(v) { return pad.t + cH - (v / maxSP) * cH; };

  var f = getFocus(s);
  var col = f ? f.color : '#9b8bb4';

  /* Background */
  ctx.fillStyle = '#f7f4fb';
  ctx.fillRect(0, 0, W, H);

  /* Trimmed-out zones (greyed) */
  var x0 = xOf(0);
  var xs = xOf(state.startIdx);
  var xe = xOf(state.endIdx);
  var x1 = xOf(n - 1);

  ctx.fillStyle = 'rgba(180,170,200,0.25)';
  ctx.fillRect(x0, pad.t, xs - x0, cH);
  ctx.fillStyle = 'rgba(180,170,200,0.25)';
  ctx.fillRect(xe, pad.t, x1 - xe, cH);

  /* Speed gradient fill — full range, dimmed outside trim */
  function drawSpeedLine(from, to, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    var gr = ctx.createLinearGradient(0, pad.t, 0, pad.t + cH);
    gr.addColorStop(0, col + '44');
    gr.addColorStop(1, col + '00');
    ctx.beginPath();
    for (var i = from; i <= to; i++) {
      var x = xOf(i), y = yOf(strokes[i].s);
      if (i === from) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(xOf(to), pad.t + cH);
    ctx.lineTo(xOf(from), pad.t + cH);
    ctx.closePath();
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.beginPath();
    for (var i = from; i <= to; i++) {
      var x = xOf(i), y = yOf(strokes[i].s);
      if (i === from) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  }

  /* Full line dim */
  drawSpeedLine(0, n - 1, 0.3);
  /* Active range bright */
  if (state.startIdx <= state.endIdx) {
    drawSpeedLine(state.startIdx, state.endIdx, 1);
  }

  /* Handle lines */
  function drawHandle(xi, label, isStart) {
    var x = xOf(xi);
    ctx.strokeStyle = isStart ? '#5cb87a' : '#c0406a';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + cH); ctx.stroke();
    ctx.setLineDash([]);
    /* Knob */
    var ky = H / 2;
    ctx.fillStyle = isStart ? '#5cb87a' : '#c0406a';
    ctx.beginPath(); ctx.arc(x, ky, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 8px Nunito,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x, ky);
  }

  drawHandle(state.startIdx, '▶', true);
  drawHandle(state.endIdx,   '■', false);

  /* Update labels */
  var startEl = document.getElementById('trim-start-' + s.date);
  var endEl   = document.getElementById('trim-end-'   + s.date);
  if (startEl) startEl.textContent = strokes[state.startIdx].e ? strokes[state.startIdx].e.split('.')[0] : '0:00';
  if (endEl)   endEl.textContent   = strokes[state.endIdx].e   ? strokes[state.endIdx].e.split('.')[0]   : '—';
}

function attachTrimHandlers(s) {
  var c = document.getElementById('trim-' + s.date);
  if (!c) return;
  var strokes = (s.strokes || []).filter(function(x) { return x.s && x.s > 0.1; });
  if (!strokes.length) return;

  var dragging = null; /* 'start' | 'end' */

  function strokeIdxAt(clientX) {
    var rect = c.getBoundingClientRect();
    var pad = 12;
    var cW = c.width - pad * 2;
    var t = Math.max(0, Math.min(1, (clientX - rect.left - pad) / cW));
    return Math.round(t * (strokes.length - 1));
  }

  function onDown(clientX) {
    var state = getTrimState(s);
    var rect  = c.getBoundingClientRect();
    var pad2  = 12;
    var cW    = c.width - pad2 * 2;
    var n     = strokes.length;
    var xOf   = function(i) { return rect.left + pad2 + (n < 2 ? cW / 2 : i / (n-1) * cW); };
    var xs    = xOf(state.startIdx);
    var xe    = xOf(state.endIdx);
    /* Pick nearest handle */
    dragging = Math.abs(clientX - xs) < Math.abs(clientX - xe) ? 'start' : 'end';
  }

  function onMove(clientX) {
    if (!dragging) return;
    var state = getTrimState(s);
    var idx   = strokeIdxAt(clientX);
    if (dragging === 'start') {
      state.startIdx = Math.min(idx, state.endIdx - 1);
    } else {
      state.endIdx = Math.max(idx, state.startIdx + 1);
    }
    drawTrimChart(s);
  }

  function onUp() { dragging = null; }

  c.addEventListener('mousedown',  function(e) { onDown(e.clientX); });
  window.addEventListener('mousemove', function(e) { if (dragging) onMove(e.clientX); });
  window.addEventListener('mouseup',   onUp);
  c.addEventListener('touchstart', function(e) { e.preventDefault(); onDown(e.touches[0].clientX); }, { passive: false });
  window.addEventListener('touchmove', function(e) { if (dragging) { e.preventDefault(); onMove(e.touches[0].clientX); } }, { passive: false });
  window.addEventListener('touchend',  onUp);
}

function applyTrim(date) {
  var s = SESSIONS.find(function(x) { return x.date === date; });
  if (!s || !s.strokes) return;
  var strokes = s.strokes.filter(function(x) { return x.s && x.s > 0.1; });
  var state   = getTrimState(s);

  var trimmed = strokes.slice(state.startIdx, state.endIdx + 1);
  if (trimmed.length < 2) { showToast('Trim range too short', 'warn'); return; }

  /* Recompute session stats from trimmed strokes */
  var speeds = trimmed.map(function(x) { return x.s; }).filter(Boolean);
  var hrs    = trimmed.map(function(x) { return x.h; }).filter(function(h) { return h != null && h > 0; });
  var srs    = trimmed.map(function(x) { return x.r; }).filter(function(r) { return r != null && r > 0; });

  s.strokes       = trimmed;
  s.avgSpeed      = speeds.length ? speeds.reduce(function(a,b){return a+b;},0)/speeds.length : s.avgSpeed;
  s.avgHR         = hrs.length   ? Math.round(hrs.reduce(function(a,b){return a+b;},0)/hrs.length) : s.avgHR;
  s.avgStrokeRate = srs.length   ? Math.round(srs.reduce(function(a,b){return a+b;},0)/srs.length) : s.avgStrokeRate;
  s.hasHR         = hrs.length > 0;

  /* Elapsed from first/last stroke elapsed time */
  var firstE = trimmed[0].e || '0:00:00.0';
  var lastE  = trimmed[trimmed.length-1].e || firstE;
  function parseSecs(eStr) {
    var p = (eStr||'0:00:00.0').split(':');
    return parseInt(p[0]||0)*3600 + parseInt(p[1]||0)*60 + parseFloat(p[2]||0);
  }
  var durationSecs = parseSecs(lastE) - parseSecs(firstE);
  if (durationSecs > 0) {
    var h=Math.floor(durationSecs/3600), m=Math.floor((durationSecs%3600)/60), ss2=Math.floor(durationSecs%60);
    s.elapsed = h+':'+String(m).padStart(2,'0')+':'+String(ss2).padStart(2,'0')+'.0';
    s.totalDist = s.avgSpeed * durationSecs / 3600;
  }

  /* Recompute midpoint GPS */
  var gps = trimmed.filter(function(x) { return x.lt && x.ln; });
  if (gps.length) {
    var mid = gps[Math.floor(gps.length/2)];
    s.midLat = mid.lt; s.midLon = mid.ln;
  }

  /* Median speed (robust vs outliers) */
  if (speeds.length >= 3) {
    var sorted = speeds.slice().sort(function(a,b){return a-b;});
    var n = sorted.length;
    s.avgSpeed = n%2 ? sorted[Math.floor(n/2)] : (sorted[n/2-1]+sorted[n/2])/2;
    s.totalDist = s.avgSpeed * durationSecs / 3600;
  }

  /* Advance startTime by trim offset */
  if (trimmed[0] && trimmed[0].e) {
    try {
      var startElapsed = parseSecs(trimmed[0].e);
      var origParts = s.startTime ? s.startTime.match(/(\d+):(\d+):(\d+)$/) : null;
      if (origParts && startElapsed > 0) {
        var origSecs = (+origParts[1])*3600 + (+origParts[2])*60 + (+origParts[3]);
        var newSecs  = origSecs + startElapsed;
        var nh=Math.floor(newSecs/3600)%24, nm=Math.floor((newSecs%3600)/60), ns2=Math.floor(newSecs%60);
        s.startTime = s.startTime.replace(/(\d+):(\d+):(\d+)$/,
          String(nh).padStart(2,'0')+':'+String(nm).padStart(2,'0')+':'+String(ns2).padStart(2,'0'));
      }
    } catch(e) {}
  }

  /* Reset trim state, save index + trimmed strokes */
  delete _trimState[date];
  saveToStorage();
  saveSessionDetail(s);
  recompute();
  refresh();
  showToast('Session trimmed ✓', 'success');
}

function resetTrim(date) {
  delete _trimState[date];
  var s = SESSIONS.find(function(x) { return x.date === date; });
  if (!s) return;
  /* Reload original strokes from Supabase */
  sbGet(sessionDetailKey(date), sbToken(), function(err, val) {
    if (!err && val && val.strokes) {
      s.strokes   = val.strokes;
      s.intervals = val.intervals || s.intervals || [];
    }
    recompute();
    refresh();
    showToast('Session reset to original', 'success');
  });
}
