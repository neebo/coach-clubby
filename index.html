/* ── Pick closest station to a lat/lon ── */
function closestTideStation(lat, lon) {
  if (!lat || !lon) return TIDE_STATIONS['9413745']; /* default Santa Cruz */
  var best = null, bestDist = Infinity;
  Object.keys(TIDE_STATIONS).forEach(function(id) {
    var st = TIDE_STATIONS[id];
    var dlat = st.lat - lat, dlon = st.lon - lon;
    var dist = Math.sqrt(dlat*dlat + dlon*dlon);
    if (dist < bestDist) { bestDist = dist; best = st; }
  });
  return best || TIDE_STATIONS['9413745'];
}

/* ── Compute height from harmonic constituents for a given station ── */
function tideHeightAt(utcMs, station) {
  var st = station || TIDE_STATIONS['9413745'];
  var hrs = (utcMs - TIDE_EPOCH_MS) / 3600000;
  var h = st.datum;
  var c = st.c;
  for (var name in c) {
    var amp = c[name][0], phase = c[name][1];
    var speed = TIDE_SPEED[name];
    if (speed && amp) h += amp * Math.cos((speed * hrs - phase) * DEG);
  }
  return h;
}

/* ── Compute tide data for a single session ── */
function computeTidesForSession(session) {
  var y  = +session.date.slice(0,4);
  var mo = +session.date.slice(4,6) - 1;
  var d  = +session.date.slice(6,8);

  /* Pick station based on session GPS */
  var lat = session.midLat || session.startLat || null;
  var lon = session.midLon || session.startLon || null;
  var station = closestTideStation(lat, lon);

  var m = session.startTime ? session.startTime.match(/(\d{2}):(\d{2}):\d{2}$/) : null;
  var sh = m ? +m[1] : 12, sm = m ? +m[2] : 0;

  /* Session start in UTC (assume local time is UTC-7 PDT, adjust if needed) */
  var utcOffset = session.utcOffset !== undefined ? session.utcOffset : 7;
  var startUtc = Date.UTC(y, mo, d, sh + utcOffset, sm);

  /* Scan full local day every 6 min */
  var t0 = Date.UTC(y, mo, d, utcOffset, 0);
  var samples = [];
  for (var i = 0; i <= 240; i++) {
    var t = t0 + i * 6 * 60000;
    samples.push({ t: t, h: tideHeightAt(t, station) });
  }

  /* Find high/low events */
  var events = [];
  for (var j = 1; j < samples.length - 1; j++) {
    var prev = samples[j-1].h, cur = samples[j].h, next = samples[j+1].h;
    if ((cur >= prev && cur >= next && cur - Math.min(prev,next) > 0.15) ||
        (cur <= prev && cur <= next && Math.max(prev,next) - cur > 0.15)) {
      var isHigh = cur >= prev && cur >= next;
      var evtDate = new Date(samples[j].t);
      events.push({
        type:   isHigh ? 'H' : 'L',
        height: Math.round(cur * 100) / 100,
        time:   String(evtDate.getUTCHours()).padStart(2,'0') + ':'
               + String(evtDate.getUTCMinutes()).padStart(2,'0'),
      });
    }
  }

  /* Interpolate height at session start */
  var interpHeight = null;
  if (startUtc >= t0 && startUtc <= t0 + 240 * 6 * 60000) {
    var idx2 = Math.round((startUtc - t0) / (6 * 60000));
    idx2 = Math.max(0, Math.min(239, idx2));
    var frac = ((startUtc - t0) / (6 * 60000)) - Math.floor((startUtc - t0) / (6 * 60000));
    interpHeight = samples[idx2].h * (1 - frac) + (samples[idx2+1] ? samples[idx2+1].h * frac : samples[idx2].h * frac);
    interpHeight = Math.round(interpHeight * 100) / 100;
  }

  /* Rising or falling at session start */
  var trend = null;
  if (startUtc >= t0 + 6 * 60000) {
    var idxA = Math.round((startUtc - t0) / (6 * 60000));
    idxA = Math.max(1, Math.min(239, idxA));
    trend = samples[idxA].h > samples[idxA - 1].h ? 'rising' : 'falling';
  }

  return {
    station:     station.name,
    interpHeight: interpHeight,
    trend:        trend,
    events:       events,
    samples:      samples,
  };
}


/* ═══════════════════════════════════════════════════════════
   USER SEGMENTS — custom zones stored in Supabase
   Each zone: { id, label, color, latLo, latHi, lonLo, lonHi }
   lonLo/lonHi optional — if absent, only lat bounds used
═══════════════════════════════════════════════════════════ */

var ZONES_COLORS = ['#7c6fa0','#c08bc0','#9bbdd4','#7dbfa8','#e8a4bd','#b09dd4','#e8c4a4','#a4c4e8','#c4e8a4','#e8d4a4'];

function loadZones() {
  try {
    var raw = _store[ZONES_KEY];
    if (!raw) { USER_ZONES = []; return; }
    var arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
    USER_ZONES = Array.isArray(arr) ? arr : [];
    /* Rebuild WW_VIS for any new zones */
    USER_ZONES.forEach(function(z) {
      if (WW_VIS[z.id] === undefined) WW_VIS[z.id] = true;
    });
  } catch(e) { USER_ZONES = []; }
}

function saveZones() {
  _store[ZONES_KEY] = USER_ZONES;
  sbScheduleWrite(ZONES_KEY, USER_ZONES);
}

/* ── Detect launch location clusters from session GPS ──
   Groups sessions whose startLat/startLon fall within a ~200m radius.
   Returns clusters with ≥5 sessions as zone suggestions. */
function detectLaunchClusters() {
  var CLUSTER_DEG = 0.002; /* ~200m */
  var sessions = SESSIONS.filter(function(s) {
    return s.startLat && s.startLon && Math.abs(s.startLat) > 1;
  });
  if (sessions.length < 2) return [];

  var clusters = [];
  sessions.forEach(function(s) {
    /* Find existing cluster within radius */
    var found = null;
    clusters.forEach(function(c) {
      var dlat = c.lat - s.startLat, dlon = c.lon - s.startLon;
      if (Math.sqrt(dlat*dlat + dlon*dlon) < CLUSTER_DEG) found = c;
    });
    if (found) {
      found.sessions.push(s);
      /* Update centroid */
      found.lat = found.sessions.reduce(function(a,x){return a+x.startLat;},0) / found.sessions.length;
      found.lon = found.sessions.reduce(function(a,x){return a+x.startLon;},0) / found.sessions.length;
    } else {
      clusters.push({ lat: s.startLat, lon: s.startLon, sessions: [s] });
    }
  });

  /* Return clusters with ≥5 sessions, sorted by count descending */
  return clusters.filter(function(c) { return c.sessions.length >= 5; })
    .sort(function(a,b) { return b.sessions.length - a.sessions.length; });
}

/* ── Suggest zone bounds for a launch cluster ──
   Looks at all strokes from sessions in the cluster and returns
   a lat/lon bounding box that covers common GPS tracks. */
function suggestZoneBounds(cluster) {
  var PADDING = 0.003; /* ~300m padding around tracks */
  var lats = [], lons = [];
  cluster.sessions.forEach(function(s) {
    (s.strokes||[]).forEach(function(st) {
      if (st.lt && st.ln && Math.abs(st.lt) > 1) {
        lats.push(st.lt); lons.push(st.ln);
      }
    });
  });
  if (!lats.length) {
    /* Fall back to just the launch location */
    return {
      latLo: cluster.lat - PADDING, latHi: cluster.lat + PADDING,
      lonLo: cluster.lon - PADDING*1.2, lonHi: cluster.lon + PADDING*1.2,
    };
  }
  lats.sort(function(a,b){return a-b;}); lons.sort(function(a,b){return a-b;});
  /* Use 5th–95th percentile to exclude GPS outliers */
  var p5  = Math.floor(lats.length * 0.05);
  var p95 = Math.floor(lats.length * 0.95);
  return {
    latLo: lats[p5]   - PADDING * 0.3,
    latHi: lats[p95]  + PADDING * 0.3,
    lonLo: lons[p5]   - PADDING * 0.4,
    lonHi: lons[p95]  + PADDING * 0.4,
  };
}

/* ── Render the My Segments section in Plans & Settings ── */
function renderSegmentManager(el) {
  var clusters = detectLaunchClusters();
  /* Clusters that don't already have a zone */
  var suggested = clusters.filter(function(c) {
    return !USER_ZONES.some(function(z) {
      return Math.abs(z.latLo - (c.lat - 0.003)) < 0.005;
    });
  });

  var html = '<div class="card">';
  html += '<div class="ct-title">🗺️ My Segments</div>';
  html += '<div class="ct-sub">Custom GPS zones for speed comparison across sessions. Zones are matched by latitude/longitude bounds.</div>';

  /* ── Suggestions from launch clusters ── */
  if (suggested.length) {
    html += '<div style="margin-bottom:16px">';
    html += '<div style="font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--gm);margin-bottom:8px">💡 Detected launch locations</div>';
    suggested.forEach(function(c, i) {
      var bounds = suggestZoneBounds(c);
      var color  = ZONES_COLORS[i % ZONES_COLORS.length];
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;'
            + 'background:var(--lilac2);border-radius:10px;border:1.5px solid var(--lav-lt);margin-bottom:6px;flex-wrap:wrap;gap:8px">';
      html += '<div>';
      html += '<div style="font-size:var(--fs-body);font-weight:800;color:var(--ink)">'
            + c.sessions.length + ' sessions near ' + c.lat.toFixed(4) + ', ' + c.lon.toFixed(4) + '</div>';
      html += '<div style="font-size:var(--fs-caption);font-weight:600;color:var(--gm);margin-top:2px">'
            + 'Covers ' + ((bounds.latHi - bounds.latLo) * 111).toFixed(1) + ' km × '
            + ((bounds.lonHi - bounds.lonLo) * 85).toFixed(1) + ' km</div>';
      html += '</div>';
      html += '<button onclick="createZoneFromCluster(' + i + ')" '
            + 'style="font-family:var(--font);font-size:var(--fs-small);font-weight:800;padding:6px 14px;'
            + 'border-radius:var(--r-pill);border:none;background:var(--plum);color:var(--white);cursor:pointer">+ Add as zone</button>';
      html += '</div>';
    });
    html += '</div>';
  }

function saveZoneEditor(idx) {
  var label = (document.getElementById('ze-label')||{}).value || '';
  var latLo = parseFloat((document.getElementById('ze-latLo')||{}).value);
  var latHi = parseFloat((document.getElementById('ze-latHi')||{}).value);
  var lonLoRaw = (document.getElementById('ze-lonLo')||{}).value || '';
  var lonHiRaw = (document.getElementById('ze-lonHi')||{}).value || '';
  var color = (document.getElementById('ze-color')||{}).value || ZONES_COLORS[0];

  if (!label || isNaN(latLo) || isNaN(latHi) || latHi <= latLo) {
    showToast('Please enter a name and valid lat min/max (min < max)', 'warn');
    return;
  }

  var zone = {
    id:    'uz_' + Date.now(),
    label: label.trim(),
    color: color,
    latLo: +latLo.toFixed(6),
    latHi: +latHi.toFixed(6),
    lonLo: lonLoRaw !== '' ? +parseFloat(lonLoRaw).toFixed(6) : null,
    lonHi: lonHiRaw !== '' ? +parseFloat(lonHiRaw).toFixed(6) : null,
  };

  if (idx >= 0) {
    zone.id = USER_ZONES[idx].id; /* preserve existing id */
    USER_ZONES[idx] = zone;
  } else {
    USER_ZONES.push(zone);
  }

  /* Init WW_VIS for new zone */
  if (WW_VIS[zone.id] === undefined) WW_VIS[zone.id] = true;

  saveZones();
  recompute();
  renderPlansPage(document.getElementById('ct'));
  showToast('Zone saved ✓', 'success');
}

function editZone(idx) {
  openZoneEditor(idx);
}

function deleteZone(idx) {
  if (!confirm('Remove zone "' + USER_ZONES[idx].label + '"?')) return;
  delete WW_VIS[USER_ZONES[idx].id];
  USER_ZONES.splice(idx, 1);
  saveZones();
  recompute();
  renderPlansPage(document.getElementById('ct'));
  showToast('Zone removed', 'success');
}

function drawDownwindTrend(g){
  var c=document.getElementById('ft-'+g.focus.id);if(!c)return;
  var ctx=c.getContext('2d'),W=c.offsetWidth,H=140;c.width=W;c.height=H;
  var f=g.focus;
  var sess=g.sessions; // oldest first
  var n=sess.length;
  var pad={t:22,r:18,b:28,l:50},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;

  /* Collect efficiency + avg speed per session */
  var data=sess.map(function(s){
    var dw=detectDownwindRuns(s);
    return {date:s.date,eff:dw?dw.eff:null,spd:dw?dw.avgSpd:null,sr:dw?dw.avgSR:null};
  }).filter(function(d){return d.eff!==null;});
  if(data.length<1) return;

  var effs=data.map(function(d){return d.eff;});
  var spds=data.map(function(d){return d.spd;});
  var minE=Math.min.apply(null,effs)*0.95, maxE=Math.max.apply(null,effs)*1.05;
  /* Extend range to show target line at 12 */
  maxE=Math.max(maxE,12.5); minE=Math.min(minE,9.5);

  var nd=data.length;
  var xOf=function(i){return pad.l+(nd<2?cW/2:i/(nd-1)*cW);};
  var yOf=function(v){return pad.t+cH-((v-minE)/(maxE-minE))*cH;};

  drawGrid(ctx,W,H,pad,minE,maxE,3);

  /* Target line at efficiency=12 */
  if(12>=minE&&12<=maxE){
    var ty=yOf(12);
    ctx.beginPath();ctx.strokeStyle='rgba(92,184,122,0.5)';ctx.lineWidth=1.5;ctx.setLineDash([6,4]);
    ctx.moveTo(pad.l,ty);ctx.lineTo(W-pad.r,ty);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(92,184,122,0.8)';ctx.font='bold 9px Nunito';ctx.textAlign='left';
    ctx.fillText('target 12',pad.l+4,ty-3);
  }

  /* Avg speed (secondary, dashed, right axis implied by colour) */
  if(spds.length>=2){
    var minS=Math.min.apply(null,spds)*0.97,maxS=Math.max.apply(null,spds)*1.02;
    var yS=function(v){return pad.t+cH-((v-minS)/(maxS-minS))*cH;};
    ctx.beginPath();ctx.strokeStyle=f.color+'55';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);ctx.lineJoin='round';
    data.forEach(function(d,i){if(i===0)ctx.moveTo(xOf(i),yS(d.spd));else ctx.lineTo(xOf(i),yS(d.spd));});
    ctx.stroke();ctx.setLineDash([]);
  }

  /* Efficiency line + fill */
  if(nd>1){
    var gr=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);
    gr.addColorStop(0,f.color+'33');gr.addColorStop(1,f.color+'00');
    ctx.beginPath();
    data.forEach(function(d,i){if(i===0)ctx.moveTo(xOf(i),yOf(d.eff));else ctx.lineTo(xOf(i),yOf(d.eff));});
    ctx.lineTo(xOf(nd-1),pad.t+cH);ctx.lineTo(xOf(0),pad.t+cH);ctx.closePath();
    ctx.fillStyle=gr;ctx.fill();
    ctx.beginPath();ctx.strokeStyle=f.color;ctx.lineWidth=2.5;ctx.lineJoin='round';
    data.forEach(function(d,i){if(i===0)ctx.moveTo(xOf(i),yOf(d.eff));else ctx.lineTo(xOf(i),yOf(d.eff));});
    ctx.stroke();
  }

  /* Data points */
  data.forEach(function(d,i){
    var x=xOf(i),y=yOf(d.eff);
    var effCol=d.eff>12?'var(--mint-dk)':d.eff>10.5?f.color:'#a03060';
    ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);
    ctx.fillStyle=effCol;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.fill();ctx.stroke();
    ctx.fillStyle='#3d2f5a';ctx.font='bold 10px Nunito';ctx.textAlign='center';
    ctx.fillText(d.eff.toFixed(2),x,y-12);
    xLbl(ctx,H,x,dateLabel(d.date));
  });

  /* Legend */
  ctx.fillStyle=f.color;ctx.font='bold 9px Nunito';ctx.textAlign='right';
  ctx.fillText('— efficiency (speed÷SR×100)',W-pad.r,pad.t-6);
  ctx.fillStyle=f.color+'88';
  ctx.fillText('- - avg run speed',W-pad.r,pad.t+5);
}

function _loadUserData(cb) {

              CRAFTS_KEY, LAYOUT_KEY, OV_WIDGET_KEY, STRIP_KEY, FOCUS_ORDER_KEY, ZONES_KEY];
  var loaded = 0;
  _store = {};
  keys.forEach(function(k) {
    sbGet(k, sbToken(), function(err2, val) {
      if (!err2 && val !== null) _store[k] = val;
      if (++loaded === keys.length) {
        console.log('[boot] _loadUserData complete. Keys with data:',
          Object.keys(_store).filter(function(k){var v=_store[k];return v!=null&&(Array.isArray(v)?v.length:Object.keys(v||{}).length)>0;}));
        cb();
      }
    });
  });
}

function renderWeekPlanWidget(ss) {
  var today    = new Date();
  var todayDow = today.getDay();
  var ds = today.getFullYear()
         + String(today.getMonth()+1).padStart(2,'0')
         + String(today.getDate()).padStart(2,'0');
  var weekKey  = isoWeek(ds);
  var plan     = WEEKLY_PLANS[weekKey];
  var dayOrder = [1,2,3,4,5,6,0];
  var DOW_SHORT= ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var sessThisWeek = {};
  ss.forEach(function(s){
    if (isoWeek(s.date) === weekKey) sessThisWeek[getDOW(s.date)] = s;
  });
  var html = '<div class="week-plan-strip">'
    + '<div class="wps-title">\uD83D\uDCC5 This Week\'s Program'
    + '<span style="font-size:var(--fs-caption);font-weight:600;color:var(--gm);font-style:normal;'
    + 'text-transform:none;letter-spacing:0;margin-left:6px">'
    + weekMonday(weekKey) + '</span></div>';
  if (!plan || !plan.days || !Object.keys(plan.days).length) {
    html += '<div style="font-size:var(--fs-body);font-weight:600;color:var(--gm);text-align:center;padding:8px 0">'
      + 'No program set for this week. '
      + '<button onclick="nav(\'plans\')" style="font-family:var(--font);font-size:var(--fs-small);font-weight:800;'
      + 'padding:4px 12px;border-radius:999px;border:1.5px solid var(--lav);'
      + 'background:var(--lilac);color:var(--plum);cursor:pointer">Set up weekly plan \u2192</button>'
      + '</div></div>';
    return html;
  }
  html += '<div class="week-plan-days">';
  dayOrder.forEach(function(dow){
    var dayPlan = (plan.days||{})[dow];
    var sess    = sessThisWeek[dow];
    var isToday = (dow === todayDow);
    var base    = PROGRAM[dow] || {};
    var opt     = (typeof FOCUS_OPTIONS!=='undefined' && dayPlan)
                  ? FOCUS_OPTIONS.filter(function(o){ return o.id===dayPlan.id; })[0]||{} : {};
    var sty     = (typeof FOCUS_STYLES!=='undefined' && dayPlan && FOCUS_STYLES[dayPlan.id])
                  ? FOCUS_STYLES[dayPlan.id] : {};
    var col     = sty.color   || base.color   || '#b09dd4';
    var colLt   = sty.colorLt || base.colorLt || '#f0eaf9';
    var icon    = opt.icon  || sty.icon  || base.icon  || '';
    var label   = opt.label || base.shortLabel || '';
    if (!dayPlan || !dayPlan.id) {
      html += '<div class="wpd" style="background:var(--cloud);color:var(--gm)">'
        + '<div class="wpd-dow">'+DOW_SHORT[dow]+(isToday?' \u25CF':'')+'</div>'
        + '<div class="wpd-icon" style="opacity:.25">\u2014</div>'
        + '<div class="wpd-label" style="opacity:.4">Rest</div>'
        + '</div>';
      return;
    }
    var dateAttr = sess ? ' onclick="selSess(\''+sess.date+'\')"' : '';
    html += '<div class="wpd'+(sess?' has-session':'')+(isToday?' today':'')+'"'
      + dateAttr + ' style="background:'+colLt+';color:'+col+'">'
      + '<div class="wpd-dow" style="color:'+col+'">'+DOW_SHORT[dow]+(isToday?' \u25CF':'')+'</div>'
      + '<div class="wpd-icon">'+icon+'</div>'
      + '<div class="wpd-label">'+escHtml(label)+'</div>'
      + (sess ? '<div class="wpd-speed">'+sess.avgSpeed.toFixed(2)+'</div>' : '')
      + (sess ? '<div style="font-size:var(--fs-label);font-weight:700;margin-top:1px;opacity:.7">\u2713 done</div>' : '')
      + '</div>';
  });
  html += '</div></div>';
  return html;
}

function drawGPSMap(s, strokes, canvasEl) {
  var c = canvasEl||document.getElementById(s._mapId||('sess-map-'+s.date));
  if (!c) return;
  var W=0,wEl=c; while(wEl&&W===0){W=wEl.offsetWidth;wEl=wEl.parentElement;} if(!W)W=600;
  var H=260; c.width=W; c.height=H;
  var ctx=c.getContext('2d');
  ctx.fillStyle='#e8f0f8'; ctx.fillRect(0,0,W,H);

  else{var nl=(latSpan*aspectRatio)/lonScale,lonMid=(minLon+maxLon)/2;minLon=lonMid-nl/2;maxLon=lonMid+nl/2;lonSpan=nl;}
  var pad=28,dW=W-pad*2,dH=H-pad*2;

    ctx.beginPath();ctx.moveTo(gx,pad);ctx.lineTo(gx,pad+dH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pad,gy);ctx.lineTo(pad+dW,gy);ctx.stroke();}
  var speeds=strokes.map(function(st){return st.s||0;}),maxSpd=Math.max.apply(null,speeds)||5;
  var f=getFocus(s),baseCol=(f&&f.color)?f.color:'#7c6fa0';

    var r0=180,g0=180,b0=190,r1=parseInt(baseCol.slice(1,3)||'7c',16),g1=parseInt(baseCol.slice(3,5)||'6f',16),b1=parseInt(baseCol.slice(5,7)||'a0',16);
    ctx.beginPath();ctx.moveTo(toX(st0.ln),toY(st0.lt));ctx.lineTo(toX(st1.ln),toY(st1.lt));
    ctx.strokeStyle='rgb('+(Math.round(r0+(r1-r0)*t))+','+(Math.round(g0+(g1-g0)*t))+','+(Math.round(b0+(b1-b0)*t))+')';
    ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}

}

function showToast(msg, type) {
  var t = document.createElement('div');
  t.textContent = msg;

    + 'background:' + (type==='error'?'#c0406a':type==='warn'?'#c9973d':'#2e7a4a') + ';'

}

function isoWeek(d) {
  var date = new Date(d); date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 4 - (date.getDay()||7));
  var yearStart = new Date(date.getFullYear(),0,1);
  var wk = Math.ceil((((date-yearStart)/86400000)+1)/7);
  return date.getFullYear()+'W'+String(wk).padStart(2,'0');
}

function weekMonday(isoWk) {
  var yr = +isoWk.slice(0,4), wk = +isoWk.slice(5);
  var jan4 = new Date(yr, 0, 4);
  var dayOfWeek = (jan4.getDay()||7);
  var monday = new Date(jan4.getTime() - (dayOfWeek-1)*86400000 + (wk-1)*7*86400000);
  return monday;
}

/* ── attachFocusDrag ── */
var FOCUS_ORDER = null;
function attachFocusDrag(container) {
  Array.from(container.querySelectorAll('.focus-group-wrap')).forEach(function(wrap) {
    var handle = wrap.querySelector(':scope > .drag-handle');
    if (!handle) return;
    handle.addEventListener('mousedown', function(e){ e.preventDefault(); startFocusDrag(wrap,container,e.clientY); });
    handle.addEventListener('touchstart', function(e){ e.preventDefault(); startFocusDrag(wrap,container,e.touches[0].clientY); },{passive:false});
  });
}
function startFocusDrag(srcWrap, container, startY) {
  var srcRect = srcWrap.getBoundingClientRect(), offsetY = startY - srcRect.top;
  srcWrap.classList.add('dnd-dragging');
  var ghost = srcWrap.cloneNode(true); ghost.id = 'dnd-ghost';
  ghost.style.cssText = 'position:fixed;z-index:9999;width:'+srcRect.width+'px;opacity:.85;pointer-events:none;'
    + 'box-shadow:0 8px 32px rgba(0,0,0,.2);border-radius:14px;top:'+(startY-offsetY)+'px;left:'+srcRect.left+'px;';
  document.body.appendChild(ghost);
  function onMove(y) {
    ghost.style.top = (y-offsetY) + 'px';
    var target = null;
    Array.from(container.querySelectorAll('.focus-group-wrap:not(.dnd-dragging)')).forEach(function(w){
      var r = w.getBoundingClientRect(); if(y>=r.top&&y<=r.bottom) target=w;
    });
    if (target) {
      var ti=Array.from(container.children).indexOf(target), si=Array.from(container.children).indexOf(srcWrap);
      if(ti>si) container.insertBefore(srcWrap,target.nextSibling); else container.insertBefore(srcWrap,target);
    }
  }
  function onEnd() {
    srcWrap.classList.remove('dnd-dragging');
    var g=document.getElementById('dnd-ghost'); if(g) g.remove();
    FOCUS_ORDER = Array.from(container.querySelectorAll('.focus-group-wrap')).map(function(w){return w.dataset.focusId;}).filter(Boolean);
    saveFocusOrder();
    document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu);
    document.removeEventListener('touchmove',tm); document.removeEventListener('touchend',tu);
  }
  function mm(e){onMove(e.clientY);} function mu(){onEnd();}
  function tm(e){e.preventDefault();onMove(e.touches[0].clientY);} function tu(){onEnd();}
  document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
  document.addEventListener('touchmove',tm,{passive:false}); document.addEventListener('touchend',tu);
}

/* ── attachOvDrag (overview widget DnD) ── */
function attachOvDrag(container) {
  Array.from(container.querySelectorAll('.ov-widget-wrap')).forEach(function(wrap) {
    var handle = wrap.querySelector(':scope > .drag-handle');
    if (!handle) return;

function startOvDrag(srcWrap, container, startY) {

/* ── Minimal renderSessionCards (DnD card layout) ── */
function defaultCardOrder() { return ['legs','tide','weather','map','trim','speed','intervals','notes']; }
function getCardOrder() {
  try {
    var r=_store[LAYOUT_KEY]; if(!r)return defaultCardOrder();
    var o=typeof r==='string'?JSON.parse(r):r;
    return Array.isArray(o)&&o.length?o:defaultCardOrder();
  } catch(e){return defaultCardOrder();}
}
function renderSessionCards(s, containerEl) {
  var order=getCardOrder();
  var f=getFocus(s);
  var isDownwind=f&&f.id==='long-z2';
  containerEl.innerHTML='';
  order.forEach(function(id){
    var h='';
    if(id==='legs') h=isDownwind?renderDownwindCard(s):renderLegsCard(s);
    else if(id==='tide') h=renderTideCard(s);
    else if(id==='weather') h=renderWeatherCard(s);
    else if(id==='notes') h=renderNotesEditor(s);
    else if(id==='map') h=renderGPSMap(s);
    else if(id==='trim') h=renderTrimCard(s);
    else if(id==='speed') h='<div class="card dnd-card" data-card-id="speed">'
      +'<div class="ct-title">Speed profile</div>'
      +'<div class="ct-sub">Per-stroke speed'+(s.hasHR?' · ♥ HR':'')+'</div>'
      +'<canvas id="sc-'+s.date+'" height="175" style="width:100%;display:block"></canvas></div>';
    else if(id==='intervals'&&s.intervals&&s.intervals.length>=2) h=buildIntervalsTable(s);

    handle.className='drag-handle'; handle.title='Drag to reorder'; handle.textContent='⠇';
    wrap.appendChild(handle);
    var frag=document.createElement('div'); frag.innerHTML=h;
    while(frag.firstChild) wrap.appendChild(frag.firstChild);
    containerEl.appendChild(wrap);
  });
  attachDragHandlers(containerEl, s);
  var _drawCards = function(){
    var sc=document.getElementById('sc-'+s.date); if(sc) drawSessChart(s);
    /* Draw GPS map — _mapId set by renderGPSMap during card build */
    if(s._mapId&&s._mapStrokes&&s._mapStrokes.length){
      var mc=document.getElementById(s._mapId);
      if(mc) drawGPSMap(s,s._mapStrokes,mc);
    } else {
      /* Fallback: find map canvas and draw from strokes */
      var mapC=document.getElementById('sess-map-'+s.date);
      if(mapC&&s.strokes&&s.strokes.length){
        var gps=(s.strokes||[]).filter(function(st){return st.lt&&st.ln&&Math.abs(st.lt)>1;});
        if(gps.length){s._mapStrokes=gps;s._mapId='sess-map-'+s.date;drawGPSMap(s,gps,mapC);}

    var firstCard = containerEl.querySelector('.card');
    if(firstCard){

/* ── Strip cell data ── */
function getStripCellData(id) {

    }
    case 'sr': {
      var avgSR=ss.reduce(function(a,s){return a+(s.avgStrokeRate||0);},0)/n;

      return {label:'Avg HR',value:avgHR.toFixed(0),sub:'bpm · '+hrSess.length+' sessions'};
    }
    case 'sessions': return {label:'Sessions',value:String(n),sub:'total uploaded'};
    case 'tide': {

      if(!ts.length) return {label:'Tide',value:'—',sub:'computing…'};
      var lt=ts[ts.length-1];
      return {label:'Last Tide',value:lt._tide.interpHeight.toFixed(1)+'ft',sub:lt._tide.trend||''};
    }
    default: return null;
  }

/* ── FIT parser (native, no CDN) ── */
function _parseFITBuffer(view, bytes, filename) {
  var headerSize=bytes[0], dataSize=view.getUint32(4,true);
  var pos=headerSize, end=headerSize+dataSize;
  var definitions={}, sessions=[], records=[], laps=[];
  var EPOCH=631065600000;
  function readVal(p,sz,base,be){
    try{
      if(sz===1){var v=bytes[p];return v===0xFF?null:v;}
      if(sz===2){var v=view.getUint16(p,!be);return v===0xFFFF?null:v;}
      if(sz===4){var v=view.getUint32(p,!be);return v===0xFFFFFFFF?null:v;}
      return bytes[p];
    }catch(e){return null;}
  }
  while(pos<end&&pos<bytes.length){
    var hdr=bytes[pos];
    if(hdr&0x80){pos++;continue;}
    var isDef=!!(hdr&0x40),hasDev=!!(hdr&0x20),localNum=hdr&0x0F; pos++;
    if(isDef){
      pos++;
      var be=bytes[pos]===1; pos++;
      var gn=be?view.getUint16(pos,false):view.getUint16(pos,true); pos+=2;
      var fc=bytes[pos++], fields=[];
      for(var fi=0;fi<fc;fi++){fields.push({num:bytes[pos],size:bytes[pos+1],base:bytes[pos+2]});pos+=3;}
      if(hasDev){var dc=bytes[pos++];pos+=dc*3;}
      definitions[localNum]={gn:gn,be:be,fields:fields};
    } else {
      var def=definitions[localNum]; if(!def){pos++;continue;}
      var rowSz=0; for(var fi=0;fi<def.fields.length;fi++) rowSz+=def.fields[fi].size;
      if(pos+rowSz>bytes.length){pos+=rowSz;continue;}
      var row={};
      for(var fi=0;fi<def.fields.length;fi++){var f=def.fields[fi];row[f.num]=readVal(pos,f.size,f.base,def.be);pos+=f.size;}
      if(def.gn===20)records.push(row);
      else if(def.gn===18)sessions.push(row);
    }
  }
  /* Convert to session object */
  function sc2d(sc){if(sc==null)return null;if(sc>0x7FFFFFFF)sc-=0x100000000;return sc*(180/Math.pow(2,31));}
  function ts2d(ts){return ts!=null?new Date(EPOCH+ts*1000):null;}
  function secsToStr(s){s=Math.round(s||0);return Math.floor(s/3600)+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.0';}
  var sum=sessions[0]||{};
  var startTs=sum[253]||sum[2]||null, endTs=null;
  var recs=records.map(function(r){
    var lat=sc2d(r[0]),lon=sc2d(r[1]);
    var spd=r[6]!=null&&r[6]>0?r[6]/1000:null;
    var ts=r[253];
    return{lt:lat,ln:lon,s:spd?spd*2.23694:null,r:r[4]||null,h:r[3]||null,
           e:ts!=null?secsToStr((ts-(startTs||ts))):null,i:1};
  });
  var speeds=recs.filter(function(r){return r.s&&r.s>0.3;}).map(function(r){return r.s;});
  var avgSpd=speeds.length?speeds.reduce(function(a,b){return a+b;})/speeds.length:0;
  var tsArr=records.map(function(r){return r[253];}).filter(Boolean);
  var elapsedSecs=tsArr.length>=2?(Math.max.apply(null,tsArr)-Math.min.apply(null,tsArr)):0;
  var firstGPS=recs.find(function(r){return r.lt&&r.ln;});
  var dateKey=startTs?String(ts2d(startTs).getFullYear())+String(ts2d(startTs).getMonth()+1).padStart(2,'0')+String(ts2d(startTs).getDate()).padStart(2,'0'):'00000000';
  var startTime=startTs?ts2d(startTs).toLocaleString('en-US',{hour12:false}).replace(',',''):'';
  return{date:dateKey,startTime:startTime,sessionType:'Paddling',programName:filename||'',
    avgSpeed:avgSpd,totalDist:avgSpd*elapsedSecs/3600,elapsed:secsToStr(elapsedSecs),
    avgStrokeRate:0,avgHR:null,hasHR:false,intervals:[],strokes:recs,_source:'fit',
    startLat:firstGPS?firstGPS.lt:null,startLon:firstGPS?firstGPS.ln:null};
}





/* ── Detect session legs from GPS track ── */
function detectLegs(s) {
  var strokes = (s.strokes||[]).filter(function(st){
    return st.lt && st.ln && Math.abs(st.lt) > 1;
  });
  if (strokes.length < 20) return [];
  /* Split into outbound/return by finding the turnaround point (max distance from start) */
  var s0 = strokes[0];
  var maxDist = 0, turnIdx = 0;
  strokes.forEach(function(st, i) {
    var dlat = st.lt - s0.lt, dlon = (st.ln - s0.ln) * Math.cos(s0.lt * Math.PI/180);
    var d = Math.sqrt(dlat*dlat + dlon*dlon);
    if (d > maxDist) { maxDist = d; turnIdx = i; }
  });
  if (turnIdx < 5 || turnIdx > strokes.length - 5) return [];
  var legs = [strokes.slice(0, turnIdx+1), strokes.slice(turnIdx)];
  return legs.map(function(leg, i) {
    var speeds = leg.map(function(st){return st.s||0;}).filter(function(v){return v>0.3;});
    var srs    = leg.map(function(st){return st.r||0;}).filter(Boolean);
    var hrs    = leg.map(function(st){return st.h||0;}).filter(Boolean);
    var avgSpd = speeds.length ? speeds.reduce(function(a,b){return a+b;})/speeds.length : 0;
    var avgSR  = srs.length   ? srs.reduce(function(a,b){return a+b;})/srs.length : 0;
    var avgHR  = hrs.length   ? hrs.reduce(function(a,b){return a+b;})/hrs.length : null;
    var dist   = avgSpd * leg.length / 600; /* rough estimate: N strokes at ~10/min */
    var elapsed = leg.length > 1
      ? (function(){var e=leg[leg.length-1].e||'0:00:00.0',s2=leg[0].e||'0:00:00.0';return e;}())
      : '—';
    return { leg: i+1, avgSpeed: +avgSpd.toFixed(3), avgSR: +avgSR.toFixed(1),
             avgHR: avgHR ? +avgHR.toFixed(0) : null, dist: +dist.toFixed(2), elapsed: elapsed };
  });
}

/* ── Render legs card (flatwater sessions) ── */
function renderLegsCard(s) {
  var legs = detectLegs(s);
  if (!legs || !legs.length) {
    return '<div class="card dnd-card" data-card-id="legs">'
      + '<div class="ct-title">🚣 Legs</div>'
      + '<div class="ct-sub" style="padding:12px 0;color:var(--gm)">Not enough GPS data to detect legs.</div>'
      + '</div>';
  }
  var f = getFocus(s), col = f ? f.color : 'var(--plum)';
  var rows = legs.map(function(lg) {
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--lav-lt)">'
      + '<div style="font-size:10px;font-weight:800;color:var(--gm);width:18px">' + lg.leg + '</div>'
      + '<div style="flex:1">'
      + '<div style="font-size:12px;font-weight:800;color:' + col + '">' + lg.avgSpeed.toFixed(2) + ' mph</div>'
      + '<div style="font-size:10px;color:var(--gm)">' + lg.dist.toFixed(2) + ' mi · ' + lg.elapsed + '</div>'
      + '</div>'
      + '<div style="font-size:10px;font-weight:700;color:var(--gt)">' + lg.avgSR.toFixed(0) + ' spm</div>'
      + (lg.avgHR ? '<div style="font-size:10px;font-weight:700;color:#c0406a">' + lg.avgHR + ' bpm</div>' : '')
      + '</div>';
  }).join('');
  return '<div class="card dnd-card" data-card-id="legs">'
    + '<div class="ct-title">🚣 Session Legs</div>'
    + '<div class="ct-sub">' + legs.length + ' legs detected from GPS</div>'
    + rows + '</div>';
}

/* ── Detect downwind runs ── */
function detectDownwindRuns(s) {
  var strokes = (s.strokes||[]).filter(function(st){
    return st.lt && st.ln && st.s && st.s > 0.3;
  });
  if (strokes.length < 10) return [];
  /* Find stretches where speed is above session median */
  var speeds = strokes.map(function(st){return st.s;}).sort(function(a,b){return a-b;});
  var median = speeds[Math.floor(speeds.length/2)];
  var runs = [], inRun = false, runStart = 0;
  strokes.forEach(function(st, i) {
    if (st.s > median * 1.1 && !inRun) { inRun = true; runStart = i; }
    else if (st.s <= median * 1.1 && inRun) {
      inRun = false;
      if (i - runStart >= 5) runs.push(strokes.slice(runStart, i));
    }
  });
  if (inRun && strokes.length - runStart >= 5) runs.push(strokes.slice(runStart));
  return runs.slice(0, 8).map(function(run, i) {
    var speeds2 = run.map(function(st){return st.s;});
    var avgSpd  = speeds2.reduce(function(a,b){return a+b;})/speeds2.length;
    var maxSpd  = Math.max.apply(null, speeds2);
    var srs     = run.map(function(st){return st.r||0;}).filter(Boolean);
    var avgSR   = srs.length ? srs.reduce(function(a,b){return a+b;})/srs.length : 0;
    return { run: i+1, avgSpeed: +avgSpd.toFixed(3), maxSpeed: +maxSpd.toFixed(3),
             avgSR: +avgSR.toFixed(1), count: run.length };
  });
}

/* ── Render downwind card (long-z2 sessions) ── */
function renderDownwindCard(s) {
  var runs = detectDownwindRuns(s);
  var f = getFocus(s), col = (f && f.color) ? f.color : '#9bbdd4';

  if (!runs || !runs.length) {
    return '<div class="card dnd-card" data-card-id="legs">'
      + '<div class="ct-title">🌊 Downwind Runs</div>'
      + '<div class="ct-sub" style="padding:12px 0;color:var(--gm)">No significant downwind runs detected.</div>'
      + '</div>';
  }

  var best = runs.reduce(function(m, r){ return r.avgSpeed > m.avgSpeed ? r : m; });
  var rows = runs.map(function(r) {
    var isBest = r.run === best.run;
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;'
      + 'border-bottom:1px solid var(--lav-lt);'
      + (isBest ? 'background:' + col + '11;border-radius:6px;padding:7px 8px;margin:-7px -8px 0;' : '') + '">'
      + '<div style="font-size:10px;font-weight:800;color:var(--gm);width:22px">R' + r.run + '</div>'
      + '<div style="flex:1">'
      + '<div style="font-size:12px;font-weight:800;color:' + col + '">' + r.avgSpeed.toFixed(2) + ' mph avg</div>'
      + '<div style="font-size:10px;color:var(--gm)">Peak: ' + r.maxSpeed.toFixed(2) + ' mph · ' + r.count + ' strokes</div>'
      + '</div>'
      + '<div style="font-size:10px;font-weight:700;color:var(--gt)">' + r.avgSR.toFixed(0) + ' spm</div>'
      + (isBest ? '<span style="font-size:9px;font-weight:900;color:' + col + '">★ best</span>' : '')
      + '</div>';
  }).join('');

  return '<div class="card dnd-card" data-card-id="legs">'
    + '<div class="ct-title">🌊 Downwind Runs</div>'
    + '<div class="ct-sub">' + runs.length + ' runs detected · best avg ' + best.avgSpeed.toFixed(2) + ' mph</div>'
    + '<canvas id="ww-chart-' + s.date + '" height="120" style="width:100%;display:block;margin-bottom:10px"></canvas>'
    + rows + '</div>';
}





/* ── Session card drag-and-drop ── */
function addDragHandle(cardHtml) {
  /* No-op helper kept for compat — handles are now created via createElement */
  return cardHtml;
}

function attachDragHandlers(containerEl, s) {
  Array.from(containerEl.querySelectorAll('.dnd-card-wrap')).forEach(function(wrap) {
    var handle = wrap.querySelector(':scope > .drag-handle');
    if (!handle) return;
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      startDrag(wrap, containerEl, s, e.clientY);
    });
    handle.addEventListener('touchstart', function(e) {
      e.preventDefault();
      startDrag(wrap, containerEl, s, e.touches[0].clientY);
    }, {passive: false});
  });
}

function startDrag(srcWrap, containerEl, s, startY) {
  var srcRect = srcWrap.getBoundingClientRect();
  var offsetY = startY - srcRect.top;
  srcWrap.classList.add('dnd-dragging');

  var ghost = srcWrap.cloneNode(true);
  ghost.id = 'card-dnd-ghost';
  ghost.style.cssText = 'position:fixed;z-index:9999;width:' + srcRect.width + 'px;'
    + 'opacity:.85;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.2);'
    + 'border-radius:14px;top:' + (startY - offsetY) + 'px;left:' + srcRect.left + 'px;';
  document.body.appendChild(ghost);

  function onMove(y) {
    ghost.style.top = (y - offsetY) + 'px';
    var target = null;
    Array.from(containerEl.querySelectorAll('.dnd-card-wrap:not(.dnd-dragging)')).forEach(function(w) {
      var r = w.getBoundingClientRect();
      if (y >= r.top && y <= r.bottom) target = w;
    });
    if (target) {
      var ti = Array.from(containerEl.children).indexOf(target);
      var si = Array.from(containerEl.children).indexOf(srcWrap);
      if (ti > si) containerEl.insertBefore(srcWrap, target.nextSibling);
      else containerEl.insertBefore(srcWrap, target);
    }
  }

  function onEnd() {
    srcWrap.classList.remove('dnd-dragging');
    var g = document.getElementById('card-dnd-ghost');
    if (g) g.remove();
    var order = Array.from(containerEl.querySelectorAll('.dnd-card-wrap'))
      .map(function(w) { return w.dataset.cardId; }).filter(Boolean);
    saveLayout(order);
    document.removeEventListener('mousemove', mm);
    document.removeEventListener('mouseup',   mu);
    document.removeEventListener('touchmove', tm);
    document.removeEventListener('touchend',  tu);
  }

  function mm(e) { onMove(e.clientY); }
  function mu()  { onEnd(); }
  function tm(e) { e.preventDefault(); onMove(e.touches[0].clientY); }
  function tu()  { onEnd(); }
  document.addEventListener('mousemove', mm);
  document.addEventListener('mouseup',   mu);
  document.addEventListener('touchmove', tm, {passive: false});
  document.addEventListener('touchend',  tu);
}


















function loadAllSessionDetailsBatched(sessions, cb) {
  if (!sessions || !sessions.length) { if(cb)cb(); return; }
  /* Filter to sessions that don't have strokes yet */
  var needed = sessions.filter(function(s){ return !s.strokes || !s.strokes.length; });
  console.log('[details] Loading strokes for', needed.length, 'of', sessions.length, 'sessions');
  if (!needed.length) { if(cb)cb(); return; }

  var BATCH = 5, DELAY = 300, done = 0, total = needed.length;

  function runBatch(start) {
    var batch = needed.slice(start, start + BATCH);
    if (!batch.length) { console.log('[details] All done'); if(cb)cb(); return; }
    var batchDone = 0;
    batch.forEach(function(s) {
      sbGet(sessionDetailKey(s.date), sbToken(), function(err, detail) {
        if (!err && detail && detail.strokes) {
          s.strokes   = detail.strokes;
          s.intervals = detail.intervals || [];
        } else {
          s.strokes   = s.strokes   || [];
          s.intervals = s.intervals || [];
        }
        done++; batchDone++;
        if (batchDone === batch.length) {
          if (done >= total) { console.log('[details] All done'); if(cb)cb(); }
          else setTimeout(function(){ runBatch(start + BATCH); }, DELAY);
        }
      });
    });
  }
  runBatch(0);
}
