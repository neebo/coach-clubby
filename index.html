<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--cloud);color:var(--ink);}
:root{
  --fs-label: 9px; --fs-caption: 10px; --fs-small: 11px; --fs-body: 12px;
  --fs-ui: 13px; --fs-card-title: 14px; --fs-page-title: 21px;
  --fs-stat: 24px; --fs-insight: 19px;
  --lav:#c9b8e8; --lav-lt:#ede8f7; --lav-md:#b09dd4;
  --lilac:#f0eaf9; --lilac2:#faf7fe;
  --plum:#6b5c8c; --blush:#f5d6e0; --blush-dk:#e8a4bd;
  --mint:#d4eedf; --mint-dk:#5cb87a;
  --butter:#fdf0cc; --butter-dk:#c9973d;
  --cloud:#f7f4fb; --gt:#6e6080; --gm:#a898bb; --ink:#3d2f5a; --white:#ffffff;
  --sh:0 2px 12px rgba(140,110,180,.10);
  --r-pill:999px; --r-lg:18px; --r-md:12px;
  --font:'Nunito',sans-serif;
}

/* ── Layout ── */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.hdr{display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;
  background:var(--white);border-bottom:2px solid var(--lav-lt);flex-shrink:0;z-index:100;}
.logo{font-size:var(--fs-card-title);font-weight:900;color:var(--plum);display:flex;align-items:center;gap:6px;}
.logo-sub{font-size:var(--fs-small);font-weight:700;color:var(--gm);letter-spacing:.3px;}
.storage-badge{font-size:var(--fs-label);font-weight:800;padding:3px 8px;border-radius:var(--r-pill);
  background:var(--lilac);color:var(--plum);cursor:pointer;transition:background .15s;}
.storage-badge:hover{background:var(--lav-lt);}
.istrip{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:stretch;
  background:var(--lilac);border-bottom:2px solid var(--lav-lt);
  overflow-x:auto;-webkit-overflow-scrolling:touch;user-select:none;position:relative;}
.ic{flex:0 0 auto;min-width:110px;padding:10px 16px;border-right:1.5px solid var(--lav-lt);
  position:relative;cursor:default;transition:background .15s;}
.ic:last-child{border-right:none;}
.ic.ic-dragging{opacity:.3;}
.ic-edit-end{flex:0 0 44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:.4;font-size:14px;transition:opacity .15s;}
.ic-edit-end:hover{opacity:.9;}
.il{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--gm);margin-bottom:3px;}
.iv{font-size:var(--fs-insight);font-weight:900;color:var(--plum);line-height:1.1;}
.is{font-size:var(--fs-caption);font-weight:600;color:var(--gm);margin-top:2px;}
.body{display:flex;flex:1;overflow:hidden;}
.sb{width:220px;flex-shrink:0;background:var(--white);border-right:2px solid var(--lav-lt);
  display:flex;flex-direction:column;overflow:hidden;}
.sb-nav{display:flex;flex-direction:column;gap:4px;padding:12px 10px;}
.nb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);
  font-size:var(--fs-body);font-weight:700;color:var(--gt);cursor:pointer;transition:all .15s;border:none;
  background:none;font-family:var(--font);text-align:left;width:100%;}
.nb:hover{background:var(--lilac);color:var(--plum);}
.nb.active{background:var(--lilac);color:var(--plum);font-weight:800;}
.sb-div{height:1px;background:var(--lav-lt);margin:6px 10px;}
.add-sess{display:block;margin:0 10px;padding:9px 12px;background:var(--lilac);
  border-radius:var(--r-md);font-size:var(--fs-body);font-weight:800;color:var(--plum);
  cursor:pointer;text-align:center;border:1.5px solid var(--lav-lt);}
.add-sess:hover{background:var(--lav-lt);}
.clear-btn{margin:6px 10px 10px;padding:7px 12px;font-size:var(--fs-caption);font-weight:700;
  color:var(--gm);cursor:pointer;text-align:center;border-radius:var(--r-md);border:none;
  background:none;font-family:var(--font);}
.clear-btn:hover{background:var(--blush);color:#8a3055;}
.ct{flex:1;overflow-y:auto;padding:20px;}
.view{max-width:900px;margin:0 auto;}
.pt{font-size:var(--fs-page-title);font-weight:900;color:var(--plum);margin-bottom:4px;}
.ps{font-size:var(--fs-body);color:var(--gt);margin-bottom:14px;line-height:1.5;}

/* ── Cards ── */
.card{background:var(--white);border-radius:var(--r-lg);border:2px solid var(--lav-lt);
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh);}
.ct-title{font-size:var(--fs-card-title);font-weight:800;color:var(--plum);margin-bottom:3px;}
.ct-sub{font-size:var(--fs-small);font-weight:600;color:var(--gt);margin-bottom:12px;}

/* ── Stat grids ── */
.sg{display:grid;gap:12px;margin-bottom:16px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.sc{background:var(--white);border-radius:var(--r-md);border:2px solid var(--lav-lt);
  padding:14px 16px;box-shadow:var(--sh);}
.sl{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--gm);margin-bottom:4px;}
.sv{font-size:var(--fs-stat);font-weight:900;color:var(--plum);line-height:1.1;}
.su2{font-size:var(--fs-body);font-weight:700;color:var(--gm);}
.sn{font-size:var(--fs-caption);font-weight:600;color:var(--gm);margin-top:3px;}

/* ── Tables ── */
.tw{overflow-x:auto;border-radius:var(--r-lg);border:2px solid var(--lav-lt);margin-bottom:16px;}
table{border-collapse:collapse;width:100%;}
th{padding:9px 13px;font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1px;color:var(--gm);background:var(--lilac);text-align:left;
  border-bottom:2px solid var(--lav-lt);}
td{padding:9px 13px;font-size:var(--fs-body);border-bottom:1px solid var(--lav-lt);}
tr:last-child td{border-bottom:none;}
tr.sess-row:hover td{background:var(--lilac);}
.td-spd{font-weight:900;color:var(--plum);}
.td-hr{font-weight:700;color:#c0406a;}

/* ── Focus pills & badges ── */
.focus-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:var(--r-pill);font-size:var(--fs-caption);font-weight:800;}
.badge{display:inline-flex;align-items:center;font-size:var(--fs-caption);
  font-weight:800;padding:2px 8px;border-radius:var(--r-pill);margin-top:4px;}
.b-up{background:var(--mint);color:#2d7a4a;}
.b-dn{background:var(--blush);color:#8a3055;}

/* ── Notices ── */
.notice{padding:10px 14px;border-radius:var(--r-md);font-size:var(--fs-body);
  font-weight:600;margin-bottom:14px;}
.n-orange{background:#fff3e0;color:#8a5c00;border:1.5px solid #ffe0a0;}
.n-blue{background:#e3f0ff;color:#1a5ca0;border:1.5px solid #b3d4ff;}
.n-green{background:var(--mint);color:#2d7a4a;border:1.5px solid var(--mint-dk);}

/* ── Sidebar session items ── */
.si{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--lav-lt);
  border-left:3px solid transparent;transition:all .15s;}
.si:hover,.si.active{background:var(--lilac);border-left-color:var(--plum);}
.si-spd{font-size:var(--fs-card-title);font-weight:900;line-height:1;}
.si-date{font-size:var(--fs-body);font-weight:700;color:var(--ink);margin-top:2px;}
.si-meta{font-size:var(--fs-caption);font-weight:600;color:var(--gm);margin-top:1px;}

/* ── Charts ── */
canvas{display:block;width:100%;}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:var(--fs-caption);font-weight:700;}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* ── Bar chart ── */
.bb{height:8px;background:var(--lav-lt);border-radius:4px;overflow:hidden;}
.bf{height:100%;border-radius:4px;transition:width .3s;}

/* ── Auth tabs ── */
.tabs{display:flex;background:var(--lav-lt);padding:4px;border-radius:var(--r-pill);
  width:100%;margin-bottom:24px;}
.tab{flex:1;text-align:center;padding:9px 8px;font-size:var(--fs-body);font-weight:700;
  color:var(--gm);background:none;border:none;border-radius:calc(var(--r-pill) - 3px);
  cursor:pointer;font-family:var(--font);transition:all .15s;}
.tab.active{background:var(--white);color:var(--plum);font-weight:800;
  box-shadow:0 1px 5px rgba(140,110,180,.14);}
.tab:hover:not(.active){color:var(--plum);}

/* ── Segment compare ── */
.seg-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.seg-tab{padding:6px 14px;border-radius:var(--r-pill);font-size:var(--fs-small);
  font-weight:800;border:1.5px solid var(--lav);background:var(--white);
  color:var(--gt);cursor:pointer;font-family:var(--font);}
.seg-tab.active{background:var(--plum);color:var(--white);border-color:var(--plum);}
.compare-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:var(--lilac);border-radius:var(--r-md);border:1.5px solid var(--lav-lt);
  margin-bottom:14px;flex-wrap:wrap;}
.wleg{padding:8px 12px;border-radius:var(--r-md);cursor:pointer;
  border:1.5px solid transparent;transition:all .15s;font-size:var(--fs-small);}
.wleg.active,.wleg:hover{border-color:var(--lav);}
.zone-bar{height:12px;border-radius:6px;margin:2px 0;}

/* ── Date filter ── */
.date-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.df-chip{padding:4px 12px;border-radius:var(--r-pill);font-size:var(--fs-caption);
  font-weight:800;border:1.5px solid var(--lav);background:var(--white);
  color:var(--gt);cursor:pointer;font-family:var(--font);}
.df-chip.active{background:var(--plum);color:var(--white);border-color:var(--plum);}

/* ── DnD — unified ── */
.dnd-card-wrap,.ov-widget-wrap,.focus-group-wrap{position:relative;}
.dnd-card-wrap>.drag-handle,.ov-widget-wrap>.drag-handle,.focus-group-wrap>.drag-handle,.ic>.drag-handle{
  position:absolute;top:14px;right:14px;z-index:20;font-size:18px;line-height:1;
  color:var(--lav-md);cursor:grab;user-select:none;opacity:0;transition:opacity .15s,color .15s;padding:4px;border-radius:4px;}
.dnd-card-wrap:hover>.drag-handle,.ov-widget-wrap:hover>.drag-handle,
.focus-group-wrap:hover>.drag-handle,.ic:hover>.drag-handle{opacity:.5;}
.dnd-card-wrap>.drag-handle:hover,.ov-widget-wrap>.drag-handle:hover,
.focus-group-wrap>.drag-handle:hover,.ic>.drag-handle:hover{opacity:1;color:var(--plum);background:var(--lilac2);}
.dnd-card-wrap>.drag-handle:active,.ov-widget-wrap>.drag-handle:active,
.focus-group-wrap>.drag-handle:active,.ic>.drag-handle:active{cursor:grabbing;}
.dnd-card-wrap.dnd-dragging,.ov-widget-wrap.dnd-dragging,.focus-group-wrap.dnd-dragging,.ic.dnd-dragging{
  opacity:.35;outline:2px dashed var(--lav-md);outline-offset:2px;border-radius:14px;}
#dnd-ghost>.drag-handle{display:none;}

/* ── Overview widget DnD ── */
.ov-widget-wrap{margin-bottom:16px;}
.ov-widget-wrap>.drag-handle{position:absolute;top:10px;right:10px;font-size:16px;}

/* ── Focus group DnD ── */
.focus-group-wrap{position:relative;margin-bottom:0;}

/* ── Strip editor ── */
.strip-editor{position:fixed;top:62px;left:0;right:0;background:var(--white);
  border-bottom:2px solid var(--lav-lt);z-index:150;padding:14px 24px 18px;
  box-shadow:0 8px 32px rgba(140,110,180,.15);}
.strip-editor-title{font-size:var(--fs-label);font-weight:800;color:var(--plum);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;}
.strip-chips{display:flex;flex-wrap:wrap;gap:8px;}
.strip-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;
  border-radius:var(--r-pill);font-size:var(--fs-small);font-weight:700;
  border:1.5px solid var(--lav);background:var(--lilac2);color:var(--plum);
  cursor:pointer;transition:all .15s;}
.strip-chip.on{background:var(--plum);color:var(--white);border-color:var(--plum);}
.strip-chip:hover{transform:translateY(-1px);}

/* ── Weekly plan strip ── */
.week-plan-strip{background:linear-gradient(135deg,var(--lilac2) 0%,var(--white) 100%);
  border:2px solid var(--lav-lt);border-radius:var(--r-lg);padding:14px 16px 14px;
  margin-top:4px;margin-bottom:18px;}
.wps-title{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--gm);display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.week-plan-days{display:flex;flex-direction:row;gap:6px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;padding:4px 2px 6px;scrollbar-width:none;}
.week-plan-days::-webkit-scrollbar{display:none;}
.wpd{flex:0 0 calc((100% - 6*6px)/7);min-width:68px;border-radius:10px;padding:8px 6px;
  text-align:center;border:1.5px solid transparent;transition:all .15s;box-sizing:border-box;}
.wpd.today{border-color:currentColor;box-shadow:0 2px 10px rgba(0,0,0,.1);transform:translateY(-1px);}
.wpd.has-session{cursor:pointer;}
.wpd.has-session:hover{transform:translateY(-2px);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.wpd-dow{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.wpd-icon{font-size:18px;line-height:1.2;margin-bottom:2px;}
.wpd-label{font-size:var(--fs-caption);font-weight:700;line-height:1.3;}
.wpd-speed{font-size:var(--fs-small);font-weight:900;margin-top:3px;}

/* ── Session detail ── */
.sess-hdr{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.craft-sel{font-family:var(--font);font-size:var(--fs-small);font-weight:700;
  padding:5px 10px;border-radius:var(--r-md);border:1.5px solid var(--lav);
  background:var(--white);color:var(--ink);cursor:pointer;}
#sess-map{width:100%;display:block;}

/* ── Map ── */
#sess-map{width:100%;display:block;}

/* ── Plans page ── */
.plan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px;}
.plan-day{border-radius:var(--r-md);border:1.5px solid var(--lav-lt);padding:10px 8px;background:var(--white);}
.plan-day-label{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--gm);margin-bottom:6px;}

/* ── Buttons ── */
.btn-pill{font-family:var(--font);font-size:var(--fs-small);font-weight:800;
  padding:7px 16px;border-radius:var(--r-pill);border:1.5px solid var(--lav);
  background:var(--white);color:var(--plum);cursor:pointer;transition:opacity .15s;}
.btn-pill:hover{opacity:.8;}
.btn-pill-sm{font-size:var(--fs-caption);padding:4px 12px;}
.btn-up{background:none;border:none;font-family:var(--font);font-size:var(--fs-body);
  font-weight:800;color:var(--plum);cursor:pointer;padding:8px 16px;
  border-radius:var(--r-pill);transition:background .15s;}
.btn-up.active{background:var(--white);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.btn-up:hover{background:#b09dd4;color:var(--white);transform:translateY(-1px);}

/* ── Mobile ── */
@media(max-width:640px){
  .sb{display:none;}
  .mob-nav{display:flex!important;}
  .mob-fab{display:flex!important;}
  .pt{font-size:calc(var(--fs-page-title) - 3px);}
  .g4{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(2,1fr);}
  .week-plan-days .wpd{min-width:60px;}
  .ic-edit-end{display:none;}
  .istrip{display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;}
  .ic{flex:0 0 auto;min-width:100px;}
  .il{font-size:8px;}
  .strip-editor{padding:10px 14px 14px;}
  .tabs{margin-bottom:16px;} .tab{font-size:var(--fs-caption);padding:6px 8px;}
}
@media(min-width:641px) and (max-width:900px){
  .sb{width:64px;}
  .nb span{display:none;}
  .logo-sub{display:none;}
  .add-sess{font-size:0;padding:10px;}
}

/* ── Mobile nav ── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;
  background:var(--white);border-top:2px solid var(--lav-lt);z-index:200;
  justify-content:space-around;align-items:center;}
.mob-nb{display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:var(--fs-label);font-weight:800;color:var(--gm);cursor:pointer;
  padding:4px 12px;border-radius:var(--r-md);transition:color .15s;}
.mob-nb.active{color:var(--plum);}
.mob-fab{display:none;position:fixed;bottom:68px;right:16px;z-index:199;
  width:52px;height:52px;border-radius:50%;background:var(--plum);
  color:var(--white);font-size:24px;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(107,92,140,.4);cursor:pointer;border:none;font-family:var(--font);}

/* ── Animations ── */
@keyframes su{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes auth-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ── Utility ── */
.section-label{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--plum);margin-bottom:8px;}
.meta-text{font-size:var(--fs-caption);font-weight:600;color:var(--gm);}
.divider{border-top:1.5px solid var(--lav-lt);margin:14px 0;}


/* ── Mobile nav inner layout ── */
.mob-nav-inner{display:flex;height:56px;}
.mob-nb{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:var(--fs-label);font-weight:800;
  color:var(--gm);cursor:pointer;padding:4px 8px;border-radius:var(--r-md);
  transition:color .15s;border:none;background:none;font-family:var(--font);}
.mob-nb.active{color:var(--plum);}
.mob-nb-icon{font-size:20px;line-height:1;}
.mob-nb-label{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:.5px;}

/* ── Sessions drawer (mobile) ── */
.sess-drawer{
  display:none;position:fixed;bottom:56px;left:0;right:0;
  max-height:60vh;overflow-y:auto;background:var(--white);
  border-top:2px solid var(--lav-lt);z-index:198;
  box-shadow:0 -4px 20px rgba(140,110,180,.15);}

/* ── Header right ── */
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px;}

/* ── Sidebar nav items ── */
.sb-title{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--gm);padding:10px 12px 4px;display:block;}
.nb-icon{font-size:16px;line-height:1;flex-shrink:0;}
.nb-label{font-size:var(--fs-body);font-weight:700;line-height:1.2;}
.nb-meta{font-size:var(--fs-label);font-weight:600;color:var(--gm);}

/* ── Trim card ── */
.trim-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  flex-wrap: wrap;
  gap: 8px;
}
.trim-stat { text-align: center; min-width: 60px; }
.trim-stat-r { text-align: right; }
.trim-stat-label {
  display: block;
  font-size: var(--fs-label);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gm);
}
.trim-stat-val {
  font-size: var(--fs-card-title);
  font-weight: 900;
  color: var(--plum);
}
.trim-btns { display: flex; align-items: center; }
</style>
</head>
<body>

var STORAGE_KEY='pawddle_sessions';

function saveToStorage(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(SESSIONS));
    updateStorageBadge();
  }catch(e){
    console.warn('localStorage save failed:',e);
    showToast('⚠️ Could not save — run via http://localhost:8000 to enable persistence','warn');
  }
}

function loadFromStorage(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      var stored=JSON.parse(raw);
      if(stored&&stored.length){
        // Merge: stored sessions take priority; seed sessions fill in any missing
        var storedDates=new Set(stored.map(function(s){return s.date;}));
        var seedOnly=SESSIONS.filter(function(s){return !storedDates.has(s.date);});
        SESSIONS=stored.concat(seedOnly);
        SESSIONS.sort(function(a,b){return a.date.localeCompare(b.date);});
        return true;
      }
    }
  }catch(e){
    console.warn('localStorage load failed:',e);
  }
  // First load — save seeds to storage
  saveToStorage();
  return false;
}

function deleteSession(date){
  SESSIONS=SESSIONS.filter(function(s){return s.date!==date;});
  if(SEL===date)SEL=SESSIONS.length?SESSIONS[SESSIONS.length-1].date:null;
  saveToStorage();
  PAGE=SEL?'session':'overview';
  refresh();
}

function clearAllStorage(){
  if(!confirm('Delete all saved sessions? The 5 pre-loaded sessions will remain.'))return;
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  // Reset to seeds
  SESSIONS=SEED_SESSIONS.map(function(s){return Object.assign({},s);});
  saveToStorage();
  SEL=SESSIONS[SESSIONS.length-1].date;
  refresh();
}

function updateStorageBadge(){
  var el=document.getElementById('storage-badge');
  if(!el)return;
  var n=SESSIONS.length;
  el.textContent=n+' session'+(n!==1?'s':'')+' saved';
  el.style.display='inline-flex';
}

function showToast(msg,type){

  if(existing)existing.remove();

  t.id='toast';
  t.style.cssText='position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 18px;border-radius:12px;font-family:Nunito,sans-serif;font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,0.15);transition:opacity .3s;'
    +(type==='warn'?'background:#fef3dc;color:#7a4a00;border:1.5px solid #f5a623;'
    :type==='error'?'background:#f5d6e0;color:#8a3055;border:1.5px solid #e8a4bd;'
    :'background:#d4eedf;color:#2e6e45;border:1.5px solid #5cb87a;');
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove();},300);},3000);
}

function recompute(){
  if(!SESSIONS.length){COMPUTED=null;return;}
  SESSIONS.sort(function(a,b){return a.date.localeCompare(b.date);});
  var dates=SESSIONS.map(function(s){return s.date;});
  var cellCount=new Map();
  SESSIONS.forEach(function(s){
    var seen=new Set();
    s.strokes.forEach(function(st){
      if(st.lt&&st.ln){var c=cellKey(st.lt,st.ln);if(!seen.has(c)){seen.add(c);cellCount.set(c,(cellCount.get(c)||0)+1);}}
    });
  });
  var corrThresh=Math.max(2,SESSIONS.length>=4?SESSIONS.length-1:2);

  function statsFor(strokes){
    var spds=strokes.map(function(s){return s.s;}).filter(function(v){return v!=null&&v>0.3;});
    var srs=strokes.map(function(s){return s.r;}).filter(function(v){return v!=null;});
    var hrs=strokes.map(function(s){return s.h;}).filter(function(v){return v!=null;});
    if(spds.length<3)return null;
    spds.sort(function(a,b){return a-b;});
    var n=spds.length;
    var mean=spds.reduce(function(a,b){return a+b;},0)/n;
    var median=n%2?spds[Math.floor(n/2)]:(spds[n/2-1]+spds[n/2])/2;
    var p25=spds[Math.floor(n*0.25)],p75=spds[Math.floor(n*0.75)];
    var std=Math.sqrt(spds.reduce(function(a,v){return a+(v-mean)*(v-mean);},0)/n);
    var hist=new Array(HIST_BINS.length-1).fill(0);
    spds.forEach(function(v){for(var i=0;i<HIST_BINS.length-1;i++){if(v>=HIST_BINS[i]&&v<HIST_BINS[i+1]){hist[i]++;break;}}});
    return{n:n,avg:mean,med:median,p25:p25,p75:p75,std:std,hist:hist,
      sr:srs.length?srs.reduce(function(a,b){return a+b;},0)/srs.length:null,
      hr:hrs.length?hrs.reduce(function(a,b){return a+b;},0)/hrs.length:null};
  }

  var corridor={};
  SESSIONS.forEach(function(s){
    var match=s.strokes.filter(function(st){
      return st.lt&&st.ln&&st.lt>=CORR_LAT_LO&&st.lt<=CORR_LAT_HI&&(cellCount.get(cellKey(st.lt,st.ln))||0)>=corrThresh;
    });
    var st=statsFor(match);
    if(st&&st.n>=5)corridor[s.date]=st;
  });

  var segments=ZONE_DEFS.map(function(zone){
    var sessions={};
    SESSIONS.forEach(function(s){
      var match=s.strokes.filter(function(st){
        return st.lt&&st.ln&&st.lt>=zone.latLo&&st.lt<zone.latHi&&(cellCount.get(cellKey(st.lt,st.ln))||0)>=2;
      });
      var st=statsFor(match);
      if(st&&st.n>=8)sessions[s.date]=st;
    });
    return{id:zone.id,label:zone.label,color:zone.color,sessions:sessions};
  });

  var byFocus={};
  SESSIONS.forEach(function(s){
    var f=getFocus(s);
    if(!f)return;
    if(!byFocus[f.id])byFocus[f.id]=[];
    byFocus[f.id].push(s);
  });

  COMPUTED={dates:dates,cellCount:cellCount,corridor:corridor,segments:segments,byFocus:byFocus};
}

function refresh(){
  recompute();
  updateInsights();

  render();
}

function updateInsights(){
  var ss=SESSIONS;
  if(!ss.length)return;
  var hrSess=ss.filter(function(s){return s.hasHR;});
  setEl('i-sess',ss.length);
  setEl('i-range',dateLabel(ss[0].date)+' → '+dateLabel(ss[ss.length-1].date));
  setEl('i-hrm',hrSess.length+' of '+ss.length);
  setEl('i-hrm-sub',hrSess.length?'♥ '+hrSess.map(function(s){return dateLabel(s.date);}).join(', '):'connect HRM');
  if(!COMPUTED)return;
  var bungee=COMPUTED.byFocus['bungee']||[];
  if(bungee.length>=2){
    var bf=bungee[0],bl=bungee[bungee.length-1];
    var bp=((bl.avgSpeed-bf.avgSpeed)/bf.avgSpeed*100);
    setEl('i-bungee',bl.avgSpeed.toFixed(2)+' mph');
    setEl('i-bungee-sub','latest · vs '+dateLabel(bf.date));
    var bb=document.getElementById('i-bungee-badge');
    if(bb){bb.className='badge '+(bp>=0?'b-up':'b-dn');bb.textContent=(bp>=0?'▲ ':'▼ ')+Math.abs(bp).toFixed(1)+'% bungee-to-bungee';}
  } else if(bungee.length===1){
    setEl('i-bungee',bungee[0].avgSpeed.toFixed(2)+' mph');
    setEl('i-bungee-sub',dateLabel(bungee[0].date)+' · 1 session so far');
    var bb2=document.getElementById('i-bungee-badge');
    if(bb2){bb2.className='badge b-neu';bb2.textContent='need more Thu sessions';}
  }
  var tue=COMPUTED.byFocus['intervals']||[];
  if(tue.length){setEl('i-tue',tue[tue.length-1].avgSpeed.toFixed(2)+' mph');setEl('i-tue-sub',dateLabel(tue[tue.length-1].date)+(tue.length>1?' · '+tue.length+' sessions':''));}
  var sat=COMPUTED.byFocus['long-z2']||[];
  if(sat.length){setEl('i-sat',sat[sat.length-1].avgSpeed.toFixed(2)+' mph');setEl('i-sat-sub',dateLabel(sat[sat.length-1].date)+(sat.length>1?' · '+sat.length+' sessions':''));}
  updateStorageBadge();
}

document.addEventListener('click',function(e){

function nav(p){

function selSess(date){

  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('active');});

  var el=document.querySelector('.si[data-date="'+date+'"]');if(el)el.classList.add('active');
  render();
}

/* ═══════════════════════════════════════════
   CANVAS HELPERS
═══════════════════════════════════════════ */
function drawGrid(ctx,W,H,pad,minV,maxV,steps){
  steps=steps||4;var cH=H-pad.t-pad.b;
  ctx.strokeStyle='rgba(180,155,212,0.09)';ctx.lineWidth=1;
  for(var g=0;g<=steps;g++){
    var y=pad.t+(g/steps)*cH;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#a898bb';ctx.font='bold 10px Nunito';ctx.textAlign='right';
    ctx.fillText((maxV-(g/steps)*(maxV-minV)).toFixed(2),pad.l-5,y+4);
  }
}
function xLbl(ctx,H,x,label){ctx.fillStyle='#a898bb';ctx.font='bold 10px Nunito';ctx.textAlign='center';ctx.fillText(label,x,H-5);}
function bungee_diamond(ctx,x,y,r){ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();}
function datePill(date){var c=dateColor(date);return '<span class="pill" style="background:'+c+'22;color:'+c+'">'+dateLabel(date)+'</span>';}
function focusPill(s){var f=getFocus(s);if(!f)return '<span class="pill" style="background:var(--lav-lt);color:var(--plum)">'+s.sessionType+'</span>';return '<span class="focus-tag" style="background:'+f.colorLt+';color:'+f.color+';border-color:'+f.color+'40">'+f.icon+' '+f.shortLabel+'</span>';}

    +'<div class="sc"><div class="sl">Best Bungee</div><div class="sv">'+(bestB?bestB.avgSpeed.toFixed(2):'—')+'<span class="su2"> mph</span></div><div class="sn">Thu sessions only</div></div>'

function drawOvSpeed(ss){
  var c=document.getElementById('ov-c');if(!c)return;
  var ctx=c.getContext('2d');var W=c.offsetWidth,H=175;c.width=W;c.height=H;
  var pad={t:22,r:18,b:30,l:50},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  var speeds=ss.map(function(s){return s.avgSpeed;});
  var minV=Math.min.apply(null,speeds)*0.95,maxV=Math.max.apply(null,speeds)*1.03;
  var n=ss.length;
  var xOf=function(i){return pad.l+(n<2?cW/2:i/(n-1)*cW);};
  var yOf=function(v){return pad.t+cH-((v-minV)/(maxV-minV))*cH;};
  drawGrid(ctx,W,H,pad,minV,maxV);
  var groups={};
  ss.forEach(function(s){var f=getFocus(s);var k=f?f.id:'other';if(!groups[k])groups[k]=[];groups[k].push(s);});
  Object.keys(groups).forEach(function(k){
    var grp=groups[k];if(grp.length<2)return;
    var f=getFocus(grp[0]);
    ctx.beginPath();ctx.strokeStyle=(f?f.color:'#b09dd4')+'77';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
    grp.forEach(function(s,gi){var i=ss.indexOf(s);if(gi===0)ctx.moveTo(xOf(i),yOf(s.avgSpeed));else ctx.lineTo(xOf(i),yOf(s.avgSpeed));});
    ctx.stroke();ctx.setLineDash([]);
  });
  ss.forEach(function(s,i){
    var x=xOf(i),y=yOf(s.avgSpeed),f=getFocus(s),col=f?f.color:dateColor(s.date);
    ctx.beginPath();
    if(f&&f.bungee)bungee_diamond(ctx,x,y,9);else ctx.arc(x,y,7,0,Math.PI*2);
    ctx.fillStyle=col;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.fill();ctx.stroke();
    ctx.fillStyle='#3d2f5a';ctx.font='bold 10px Nunito';ctx.textAlign='center';
    ctx.fillText(s.avgSpeed.toFixed(2),x,y-13);xLbl(ctx,H,x,dateLabel(s.date));
  });
}

function renderByFocus(el){
  if(!COMPUTED||!SESSIONS.length){el.innerHTML='<div class="view"><div class="pt">🎯 By Focus Type</div><div class="ps">Upload sessions to see focus-type analysis.</div></div>';return;}
  var ss=filteredSessions().slice().reverse();
  var seen={};var groupList=[];
  ss.forEach(function(s){var f=getFocus(s);if(!f||seen[f.id])return;seen[f.id]=true;groupList.push({focus:f,sessions:ss.filter(function(x){var xf=getFocus(x);return xf&&xf.id===f.id;}).slice().reverse()});});
  var html='<div class="view"><div class="pt">🎯 Sessions by Focus Type</div><div class="ps">Only compare sessions of the same type. Bungee Thursdays are isolated — a speed dip there is <em>by design</em>.</div>';
  groupList.forEach(function(g){
    var f=g.focus,sess=g.sessions,ref=sess[0];
    var hasTrend=sess.length>=2;
    var trendPct=hasTrend?pct(sess[sess.length-1].avgSpeed,ref.avgSpeed):null;
    html+='<div class="card">';
    html+='<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">';
    html+='<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">';
    html+='<span class="focus-tag" style="background:'+f.colorLt+';color:'+f.color+';border-color:'+f.color+'40;font-size:12px;padding:4px 12px">'+f.icon+' '+f.label+'</span>';
    if(f.bungee)html+='<span class="badge b-warn">🔴 resistance — lower speed expected</span>';
    html+='</div><div style="font-size:11px;font-weight:600;color:var(--gm);max-width:580px;line-height:1.6">'+f.desc+'</div>';
    if(f.note)html+='<div style="font-size:11px;font-weight:700;color:'+f.color+';margin-top:4px">⚠ '+f.note+'</div>';
    html+='</div>';
    if(hasTrend){
      html+='<div style="text-align:right;flex-shrink:0">';
      html+='<div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--gm)">Trend</div>';
      html+='<span class="badge '+(+trendPct>=0?'b-up':'b-dn')+'" style="font-size:13px;padding:4px 12px">'+(+trendPct>=0?'▲ ':'▼ ')+Math.abs(trendPct)+'%</span>';
      html+='<div style="font-size:10px;color:var(--gm);margin-top:3px">'+dateLabel(ref.date)+' → '+dateLabel(sess[sess.length-1].date)+'</div></div>';
    }
    html+='</div>';
    if(hasTrend)html+='<canvas id="ft-'+f.id+'" height="125" style="margin:12px 0"></canvas>';
    html+='<div class="tw" style="margin-bottom:0"><table>';
    html+='<tr><th>#</th><th>Date</th><th>Dist</th><th>Duration</th><th>Avg Speed</th><th>SR</th><th>HR</th>'+(hasTrend?'<th>vs first</th>':'')+'</tr>';
    sess.forEach(function(s,i){
      var p=hasTrend&&i>0?pct(s.avgSpeed,ref.avgSpeed):null;
      var corrStr=COMPUTED.corridor[s.date]?' <span style="font-size:9px;color:var(--gm)">(corr. '+COMPUTED.corridor[s.date].avg.toFixed(2)+')</span>':'';
      html+='<tr class="sess-row" data-date="'+s.date+'" style="cursor:pointer">';
      html+='<td style="color:var(--gm)">'+(i+1)+'</td>';
      html+='<td>'+datePill(s.date)+' '+dateLabel(s.date)+'</td>';
      html+='<td>'+s.totalDist.toFixed(2)+' mi</td>';
      html+='<td>'+s.elapsed.split('.')[0]+'</td>';
      html+='<td style="font-weight:900;color:'+f.color+'">'+s.avgSpeed.toFixed(2)+' mph'+corrStr+'</td>';
      html+='<td>'+s.avgStrokeRate.toFixed(0)+' spm'+(f.srTargets?' <span style="font-size:9px;color:var(--gm)">tgt '+f.srTargets.easy+'/'+f.srTargets.hard+'</span>':'')+'</td>';
      html+='<td class="td-hr">'+(s.avgHR?s.avgHR.toFixed(0)+' bpm':'—')+'</td>';
      if(hasTrend)html+='<td><span class="badge '+(i===0?'b-neu':+p>=0?'b-up':'b-dn')+'">'+(i===0?'baseline':(+p>=0?'▲ ':'▼ ')+Math.abs(p)+'%')+'</span></td>';
      html+='</tr>';
    });
    html+='</table></div></div>';
  });
  html+='</div>';
  el.innerHTML=html;
  setTimeout(function(){groupList.filter(function(g){return g.sessions.length>=2;}).forEach(function(g){drawFocusTrend(g);});},30);

function drawFocusTrend(g){
  var c=document.getElementById('ft-'+g.focus.id);if(!c)return;
  var ctx=c.getContext('2d');var W=c.offsetWidth,H=125;c.width=W;c.height=H;
  var sess=g.sessions,n=sess.length,f=g.focus;
  var pad={t:18,r:18,b:28,l:50},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  var speeds=sess.map(function(s){return s.avgSpeed;});
  var corrV=sess.map(function(s){return COMPUTED&&COMPUTED.corridor[s.date]?COMPUTED.corridor[s.date].avg:null;}).filter(function(v){return v;});
  var allV=speeds.concat(corrV);
  var minV=Math.min.apply(null,allV)*0.96,maxV=Math.max.apply(null,allV)*1.03;
  var xOf=function(i){return pad.l+(n<2?cW/2:i/(n-1)*cW);};
  var yOf=function(v){return pad.t+cH-((v-minV)/(maxV-minV))*cH;};
  drawGrid(ctx,W,H,pad,minV,maxV,3);
  if(corrV.length>=2){
    ctx.beginPath();ctx.strokeStyle=f.color+'44';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);
    sess.forEach(function(s,i){var cv=COMPUTED&&COMPUTED.corridor[s.date]?COMPUTED.corridor[s.date].avg:null;if(!cv)return;if(i===0)ctx.moveTo(xOf(i),yOf(cv));else ctx.lineTo(xOf(i),yOf(cv));});
    ctx.stroke();ctx.setLineDash([]);
  }
  if(n>1){
    var gr=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);gr.addColorStop(0,f.color+'22');gr.addColorStop(1,f.color+'00');
    ctx.beginPath();sess.forEach(function(s,i){if(i===0)ctx.moveTo(xOf(i),yOf(s.avgSpeed));else ctx.lineTo(xOf(i),yOf(s.avgSpeed));});
    ctx.lineTo(xOf(n-1),pad.t+cH);ctx.lineTo(xOf(0),pad.t+cH);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
    ctx.beginPath();ctx.strokeStyle=f.color;ctx.lineWidth=2.5;ctx.lineJoin='round';
    sess.forEach(function(s,i){if(i===0)ctx.moveTo(xOf(i),yOf(s.avgSpeed));else ctx.lineTo(xOf(i),yOf(s.avgSpeed));});ctx.stroke();
  }
  sess.forEach(function(s,i){
    var x=xOf(i),y=yOf(s.avgSpeed);
    ctx.beginPath();if(f.bungee)bungee_diamond(ctx,x,y,8);else ctx.arc(x,y,7,0,Math.PI*2);
    ctx.fillStyle=f.color;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.fill();ctx.stroke();
    ctx.fillStyle='#3d2f5a';ctx.font='bold 10px Nunito';ctx.textAlign='center';
    ctx.fillText(s.avgSpeed.toFixed(2),x,y-12);xLbl(ctx,H,x,dateLabel(s.date));
  });
}

/* ═══════════════════════════════════════════
   SESSION DETAIL
═══════════════════════════════════════════ */
function renderSession(el){
  var s=null;
  for(var i=0;i<SESSIONS.length;i++){if(SESSIONS[i].date===SEL){s=SESSIONS[i];break;}}
  if(!s)s=SESSIONS[SESSIONS.length-1];
  if(!s){el.innerHTML='<div class="view"><div class="pt">Select a session</div></div>';return;}

function drawSessChart(s){
  var c=document.getElementById('sc');if(!c)return;
  var ctx=c.getContext('2d');var W=c.offsetWidth,H=175;c.width=W;c.height=H;
  var strokes=s.strokes.filter(function(x){return x.s&&x.s>0.3;});if(!strokes.length)return;
  var pad={t:20,r:18,b:26,l:50},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  var speeds=strokes.map(function(x){return x.s;});
  var hrs=strokes.map(function(x){return x.h;}).filter(function(h){return h!=null;});
  var hasHR=hrs.length>0;
  var maxSP=Math.max.apply(null,speeds)*1.05;
  var minHR=hasHR?Math.min.apply(null,hrs)*0.97:60,maxHR=hasHR?Math.max.apply(null,hrs)*1.02:200;
  var n=strokes.length;
  var xOf=function(i){return pad.l+(n<2?cW/2:i/(n-1)*cW);};
  var yOf=function(v){return pad.t+cH-(v/maxSP)*cH;};
  var yHR=function(h){return pad.t+cH-((h-minHR)/(maxHR-minHR))*cH;};
  drawGrid(ctx,W,H,pad,0,maxSP);
  if(hasHR){ctx.beginPath();ctx.strokeStyle='rgba(192,64,106,0.33)';ctx.lineWidth=1.5;ctx.lineJoin='round';var stHR=false;strokes.forEach(function(s2,i){if(s2.h==null)return;var x=xOf(i),y=yHR(s2.h);if(stHR)ctx.lineTo(x,y);else ctx.moveTo(x,y);stHR=true;});ctx.stroke();}
  var f=getFocus(s);var col=f?f.color:'#9b8bb8';
  var gr=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);gr.addColorStop(0,col+'22');gr.addColorStop(1,col+'00');
  ctx.beginPath();strokes.forEach(function(s2,i){if(i===0)ctx.moveTo(xOf(i),yOf(s2.s));else ctx.lineTo(xOf(i),yOf(s2.s));});
  ctx.lineTo(xOf(n-1),pad.t+cH);ctx.lineTo(xOf(0),pad.t+cH);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineJoin='round';
  strokes.forEach(function(s2,i){if(i===0)ctx.moveTo(xOf(i),yOf(s2.s));else ctx.lineTo(xOf(i),yOf(s2.s));});ctx.stroke();
  if(s.intervals.length>1){
    var cur=strokes[0]?strokes[0].i:null;
    strokes.forEach(function(s2,i){if(s2.i!==cur){var x=xOf(i);ctx.strokeStyle='rgba(180,155,212,0.35)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+cH);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(124,111,160,0.45)';ctx.font='bold 9px Nunito';ctx.textAlign='center';ctx.fillText('I'+s2.i,x,pad.t+9);cur=s2.i;}});
  }
}

function drawCorrChart(dates,corr){
  var c=document.getElementById('corr-c');if(!c)return;

  if(n>1){ctx.beginPath();ctx.strokeStyle='rgba(180,155,212,0.25)';ctx.lineWidth=1;ctx.setLineDash([4,4]);dates.forEach(function(d,i){if(i===0)ctx.moveTo(xOf(i),yOf(corr[d].med));else ctx.lineTo(xOf(i),yOf(corr[d].med));});ctx.stroke();ctx.setLineDash([]);}

    ctx.fillStyle=col;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.fill();ctx.stroke();

  var pad={t:14,r:8,b:24,l:40},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  var all=[];sdates.forEach(function(d){all.push(seg.sessions[d].p25,seg.sessions[d].p75);});if(!all.length)return;
  var minV=Math.min.apply(null,all)*0.97,maxV=Math.max.apply(null,all)*1.02;var n=sdates.length;
  var xOf=function(i){return pad.l+(n<2?cW/2:i/(n-1)*cW);};
  var yOf=function(v){return pad.t+cH-((v-minV)/(maxV-minV))*cH;};
  drawGrid(ctx,W,H,pad,minV,maxV,3);
  sdates.forEach(function(d,i){var s=seg.sessions[d];ctx.fillStyle=seg.color+'1a';ctx.fillRect(xOf(i)-8,yOf(s.p75),16,yOf(s.p25)-yOf(s.p75));});
  if(n>1){ctx.beginPath();ctx.strokeStyle=seg.color;ctx.lineWidth=2;ctx.lineJoin='round';sdates.forEach(function(d,i){if(i===0)ctx.moveTo(xOf(i),yOf(seg.sessions[d].avg));else ctx.lineTo(xOf(i),yOf(seg.sessions[d].avg));});ctx.stroke();}
  sdates.forEach(function(d,i){
    var s=seg.sessions[d];var f=getFocus(SESSIONS.filter(function(x){return x.date===d;})[0]);
    var x=xOf(i),y=yOf(s.avg);
    ctx.beginPath();if(f&&f.bungee)bungee_diamond(ctx,x,y,6);else ctx.arc(x,y,5,0,Math.PI*2);
    ctx.fillStyle=dateColor(d);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.fill();ctx.stroke();
    ctx.fillStyle='#3d2f5a';ctx.font='bold 9px Nunito';ctx.textAlign='center';ctx.fillText(s.avg.toFixed(2),x,y-9);xLbl(ctx,H,x,dateLabel(d));
  });
}
function parseCSV(text){
  var lines=text.split('\n');var meta={};var ss_start,is_start,ps_start;
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(l.indexOf('Start Time:')>=0)meta.startTime=(l.split(',')[1]||'').trim();
    if(l.indexOf('Type:')==0)meta.type=(l.split(',')[1]||'').trim();
    if(l.indexOf('Name:')==0)meta.name=(l.split(',')[1]||'').trim().replace(/^"|"$/g,'');
    if(l.indexOf('Session Summary:')>=0)ss_start=i;
    if(l.indexOf('Interval Summaries:')>=0)is_start=i;
    if(l.indexOf('Per-Stroke Data:')>=0){ps_start=i;break;}
  }
  if(ss_start==null||is_start==null||ps_start==null)return null;
  var ssH=(lines[ss_start+2]||'').split(',');var ssD=(lines[ss_start+4]||'').split(',');
  var ss={};ssH.forEach(function(h,i){ss[h.trim()]=ssD[i]?(ssD[i].trim()):null;});
  var intH=(lines[is_start+2]||'').split(',').map(function(h){return h.trim();});
  var intervals=lines.slice(is_start+4,ps_start-2).filter(function(l){return l.trim()&&l.indexOf('(')<0;}).map(function(row){
    var cells=row.split(',');var obj={};intH.forEach(function(h,i){obj[h]=cells[i]?(cells[i].trim()):null;});
    return{n:obj['Interval'],d:parseFloat(obj['Total Distance (GPS)'])||0,el:obj['Total Elapsed Time'],sp:obj['Avg Split (GPS)'],
      v:parseFloat(obj['Avg Speed (GPS)'])||0,sr:parseFloat(obj['Avg Stroke Rate'])||0,
      hr:isNaN(parseFloat(obj['Avg Heart Rate']))?null:parseFloat(obj['Avg Heart Rate']),
      lt:parseFloat(obj['Start GPS Lat.']),ln:parseFloat(obj['Start GPS Lon.'])};
  }).filter(function(r){return r.n&&r.n!=='(Interval)';});
  var psH=(lines[ps_start+2]||'').split(',').map(function(h){return h.trim();});
  var strokes=[];var psRows=lines.slice(ps_start+4);
  for(var i=0;i<psRows.length;i+=15){
    var cells=(psRows[i]||'').split(',');if(!cells[0]||cells[0]==='(Interval)')continue;
    var obj={};psH.forEach(function(h,j){obj[h]=cells[j]?(cells[j].trim()):null;});
    var hrV=parseFloat(obj['Heart Rate']);var lt=parseFloat(obj['GPS Lat.']),ln=parseFloat(obj['GPS Lon.']);
    if(isNaN(lt)||isNaN(ln))continue;
    strokes.push({e:obj['Elapsed Time'],s:parseFloat(obj['Speed (GPS)'])||null,r:parseFloat(obj['Stroke Rate'])||null,h:isNaN(hrV)?null:hrV,lt:lt,ln:ln,i:parseInt(obj['Interval'])||null});
  }
  var dm=meta.startTime?meta.startTime.match(/(\d{2})\/(\d{2})\/(\d{4})/):null;
  var dateStr=dm?(dm[3]+dm[1]+dm[2]):String(Date.now());
  var hasHR=strokes.some(function(s){return s.h!=null&&!isNaN(s.h);});
  return{date:dateStr,startTime:meta.startTime||'',sessionType:meta.type||'Unknown',programName:meta.name||'',
    avgSpeed:parseFloat(ss['Avg Speed (GPS)'])||0,totalDist:parseFloat(ss['Total Distance (GPS)'])||0,
    elapsed:ss['Total Elapsed Time']||'',avgStrokeRate:parseFloat(ss['Avg Stroke Rate'])||0,
    avgHR:isNaN(parseFloat(ss['Avg Heart Rate']))?null:parseFloat(ss['Avg Heart Rate']),
    startLat:intervals[0]?intervals[0].lt:0,startLon:intervals[0]?intervals[0].ln:0,hasHR:hasHR,intervals:intervals,strokes:strokes};
}

// Keep a copy of the embedded seeds so we can restore if user clears
/* ═══════════════════════════════════════════
   WEATHER — Open-Meteo Historical API
   Free, no key needed, works for ocean coords
   Fetches hourly wind speed + direction + wave
   height for the hour matching session start.
   Cached in localStorage under pawddle_wx_<date>
═══════════════════════════════════════════ */
var WX_CACHE_PREFIX='pawddle_wx_';

function windDirLabel(deg){
  var dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg/22.5)%16];
}
function mpsToMph(mps){return (mps*2.237).toFixed(1);}

function fetchWeather(session, callback){
  var cacheKey=WX_CACHE_PREFIX+session.date;
  // Check cache
  try{
    var cached=localStorage.getItem(cacheKey);
    if(cached){var wx=JSON.parse(cached);callback(null,wx);return;}
  }catch(e){}

  // Parse session date + hour
  var y=session.date.slice(0,4);
  var mo=session.date.slice(4,6);
  var d=session.date.slice(6,8);
  var dateStr=y+'-'+mo+'-'+d;

  // Use session start lat/lon if available, else startLat/startLon
  var lat=session.startLat||36.964;
  var lon=session.startLon||-122.003;

  // Determine if open water (lon < -122.01 roughly = more exposed)
  // We'll fetch both surface wind and wave height (GFS Wave model)
  var url='https://archive-api.open-meteo.com/v1/archive'
    +'?latitude='+lat.toFixed(4)
    +'&longitude='+lon.toFixed(4)
    +'&start_date='+dateStr
    +'&end_date='+dateStr
    +'&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,wave_height,wave_direction,wave_period'
    +'&wind_speed_unit=mph'
    +'&timezone=America%2FLos_Angeles';

  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      // Parse start hour from startTime e.g. "04/30/2026 18:34:39"
      var hourMatch=session.startTime.match(/(\d{2}):(\d{2}):\d{2}$/);
      var startHour=hourMatch?parseInt(hourMatch[1]):12;
      // Also grab the next 2 hours for session duration
      var hours=data.hourly;
      var times=hours.time||[];
      var idx=times.findIndex(function(t){
        return parseInt(t.slice(11,13))===startHour;
      });
      if(idx<0)idx=startHour; // fallback

      function avg2(arr,i){
        if(!arr||!arr.length)return null;
        var vals=[arr[i],arr[i+1],arr[i+2]].filter(function(v){return v!=null;});
        return vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
      }
      function pick(arr,i){return arr&&arr[i]!=null?arr[i]:null;}

      var wx={
        windSpeed: avg2(hours.wind_speed_10m,idx),       // mph
        windDir:   pick(hours.wind_direction_10m,idx),    // degrees
        windGust:  avg2(hours.wind_gusts_10m,idx),        // mph
        waveHeight:avg2(hours.wave_height,idx),           // metres (may be null inland)
        waveDir:   pick(hours.wave_direction,idx),
        wavePeriod:avg2(hours.wave_period,idx),
        hour:      startHour,
        fetchedAt: Date.now(),
      };
      // Cache
      try{localStorage.setItem(cacheKey,JSON.stringify(wx));}catch(e){}
      callback(null,wx);
    })
    .catch(function(err){callback(err,null);});
}

function fetchAllWeather(callback){
  var pending=SESSIONS.length;
  if(!pending){callback();return;}
  SESSIONS.forEach(function(s){
    fetchWeather(s,function(err,wx){
      if(!err&&wx) s._wx=wx;
      pending--;
      if(pending===0)callback();
    });
  });
}

function wxBadge(session){
  var wx=session._wx;
  if(!wx)return '<span style="font-size:10px;color:var(--gm)">loading…</span>';
  var html='<span style="font-size:11px;font-weight:700;color:var(--ink)">';
  html+='💨 '+wx.windSpeed.toFixed(1)+' mph '+windDirLabel(wx.windDir);
  if(wx.windGust&&wx.windGust>wx.windSpeed+3) html+=' (gusts '+wx.windGust.toFixed(0)+')';
  if(wx.waveHeight!=null&&wx.waveHeight>0.05) html+=' · 🌊 '+wx.waveHeight.toFixed(2)+'m';
  html+='</span>';
  return html;
}

function wxExposureNote(session){
  var wx=session._wx;
  if(!wx)return '';
  var isOpenWater=session.startLon<-122.01;
  var windMph=wx.windSpeed||0;
  var notes=[];
  if(windMph>12) notes.push('strong headwind/tailwind likely');
  else if(windMph>6) notes.push('moderate wind effect');
  else notes.push('light wind — good comparison day');
  if(wx.waveHeight!=null&&wx.waveHeight>0.3) notes.push('chop present');
  if(isOpenWater) notes.push('open water exposure');
  return notes.join(' · ');
}

/* ═══════════════════════════════════════════
   LEG DETECTION
   For any session with enough GPS coverage,
   detect the turnaround point (farthest extent
   along primary axis of travel) and split into
   faster vs slower leg. Works for both E-W
   open-water paddles and N-S harbour runs.
═══════════════════════════════════════════ */
function detectLegs(session) {
  var strokes = session.strokes.filter(function(s) {
    return s.lt && s.ln && s.s && s.s > 0.3;
  });
  if (strokes.length < 60) return null; // too short

  var n = strokes.length;
  var smoothWin = Math.min(40, Math.floor(n / 6));

  // Smooth lat and lon
  function rollingMean(arr, win) {
    return arr.map(function(_, i) {
      var i0 = Math.max(0, i - win); var i1 = Math.min(n - 1, i + win);
      var sum = 0; var cnt = 0;
      for (var j = i0; j <= i1; j++) { sum += arr[j]; cnt++; }
      return sum / cnt;
    });
  }

  var lats = strokes.map(function(s) { return s.lt; });
  var lons = strokes.map(function(s) { return s.ln; });
  var smoothLat = rollingMean(lats, smoothWin);
  var smoothLon = rollingMean(lons, smoothWin);

  var latRange = Math.max.apply(null, smoothLat) - Math.min.apply(null, smoothLat);
  var lonRange = Math.max.apply(null, smoothLon) - Math.min.apply(null, smoothLon);

  // Adjust for approximate metres (1 deg lat ≈ 111km, 1 deg lon ≈ 88km at this lat)
  var latRangeM = latRange * 111000;
  var lonRangeM = lonRange * 88000;

  var useLon = lonRangeM > latRangeM;
  var coord = useLon ? smoothLon : smoothLat;
  var startVal = coord[0];
  var endVal = coord[n - 1];

  // Find turnaround: if going west (lon decreasing), find min; going east find max
  // Going away from shore = decreasing lon (moving west) OR decreasing lat (moving south)
  var goingDecreasing = startVal > endVal;
  var turnIdx;
  if (goingDecreasing) {
    // Find minimum
    var minVal = coord[0]; turnIdx = 0;
    for (var i = 1; i < n; i++) { if (coord[i] < minVal) { minVal = coord[i]; turnIdx = i; } }
  } else {
    var maxVal = coord[0]; turnIdx = 0;
    for (var i = 1; i < n; i++) { if (coord[i] > maxVal) { maxVal = coord[i]; turnIdx = i; } }
  }

  // Require turnaround between 20% and 80% of session to be meaningful
  var pct = turnIdx / n;
  if (pct < 0.15 || pct > 0.85) return null;

  var outStrokes = strokes.slice(0, turnIdx);
  var inStrokes  = strokes.slice(turnIdx);

  function legStats(leg) {
    var speeds = leg.map(function(s) { return s.s; }).filter(function(v) { return v != null && v > 0.3; });
    var srs    = leg.map(function(s) { return s.r; }).filter(function(v) { return v != null; });
    if (!speeds.length) return null;
    speeds.sort(function(a,b){return a-b;});
    var mean = speeds.reduce(function(a,b){return a+b;},0) / speeds.length;
    var p95  = speeds[Math.floor(speeds.length * 0.95)]; // 95th pct as "effective max" (excludes GPS spikes)
    var trueMax = speeds[speeds.length - 1];
    return {
      avg:    mean,
      p95:    p95,
      max:    trueMax,
      sr:     srs.length ? srs.reduce(function(a,b){return a+b;},0)/srs.length : null,
      n:      speeds.length,
      pct:    Math.round(pct * 100),
    };
  }

  var outStats = legStats(outStrokes);
  var inStats  = legStats(inStrokes);
  if (!outStats || !inStats) return null;

  // Label legs: "outbound" (away from start) and "inbound" (return)
  // Faster leg gets the "tailwind" label context
  var outFaster = outStats.avg >= inStats.avg;

  return {
    turnPct:   Math.round(pct * 100),
    axis:      useLon ? 'E–W' : 'N–S',
    outbound:  outStats,
    inbound:   inStats,
    outFaster: outFaster,
    deltaAvg:  Math.abs(outStats.avg - inStats.avg),
    deltaMax:  Math.abs(outStats.p95 - inStats.p95),
  };
}

function renderLegsCard(session) {
  var legs = detectLegs(session);
  var html = '<div class="card">';
  html += '<div class="ct-title">🏃 Leg Comparison</div>';

  if (!legs) {
    html += '<div class="ct-sub" style="margin-bottom:0">Not enough directional travel to detect outbound vs return legs — this is normal for harbour interval sessions.</div>';
    html += '</div>';
    return html;
  }

  html += '<div class="ct-sub">Turnaround detected at ' + legs.turnPct + '% of session (' + legs.axis + ' axis) · 95th‑pct speed shown as "effective max" to exclude GPS spikes</div>';

  var faster = legs.outFaster ? legs.outbound : legs.inbound;
  var slower = legs.outFaster ? legs.inbound  : legs.outbound;
  var fasterLabel = legs.outFaster ? 'Outbound' : 'Inbound (return)';
  var slowerLabel = legs.outFaster ? 'Inbound (return)' : 'Outbound';

  // 4-column grid: faster avg | faster max | slower avg | slower max
  html += '<div class="sg g4" style="margin-bottom:14px">';

  html += '<div class="sc" style="border-color:var(--mint-dk)44">';
  html += '<div class="sl" style="color:var(--mint-dk)">⚡ ' + fasterLabel + ' — Avg</div>';
  html += '<div class="sv" style="color:var(--mint-dk)">' + faster.avg.toFixed(2) + '<span class="su2"> mph</span></div>';
  html += '<div class="sn">' + (faster.sr ? faster.sr.toFixed(0) + ' spm avg' : '') + '</div>';
  html += '</div>';

  html += '<div class="sc" style="border-color:var(--mint-dk)44">';
  html += '<div class="sl" style="color:var(--mint-dk)">⚡ ' + fasterLabel + ' — Max</div>';
  html += '<div class="sv" style="color:var(--mint-dk)">' + faster.p95.toFixed(2) + '<span class="su2"> mph</span></div>';
  html += '<div class="sn">true peak: ' + faster.max.toFixed(2) + '</div>';
  html += '</div>';

  html += '<div class="sc" style="border-color:var(--blush-dk)44">';
  html += '<div class="sl" style="color:#a03060">🐢 ' + slowerLabel + ' — Avg</div>';
  html += '<div class="sv" style="color:#a03060">' + slower.avg.toFixed(2) + '<span class="su2"> mph</span></div>';
  html += '<div class="sn">' + (slower.sr ? slower.sr.toFixed(0) + ' spm avg' : '') + '</div>';
  html += '</div>';

  html += '<div class="sc" style="border-color:var(--blush-dk)44">';
  html += '<div class="sl" style="color:#a03060">🐢 ' + slowerLabel + ' — Max</div>';
  html += '<div class="sv" style="color:#a03060">' + slower.p95.toFixed(2) + '<span class="su2"> mph</span></div>';
  html += '<div class="sn">true peak: ' + slower.max.toFixed(2) + '</div>';
  html += '</div>';

  html += '</div>';

  // Gap callout
  html += '<div style="display:flex;align-items:center;gap:12px;background:var(--lilac);border-radius:10px;padding:10px 14px">';
  html += '<span style="font-size:20px">' + (legs.deltaAvg > 1.0 ? '💨' : legs.deltaAvg > 0.4 ? '🌬️' : '〰️') + '</span>';
  html += '<div style="font-size:12px;font-weight:700;color:var(--ink);line-height:1.7">';
  html += '<b>' + fasterLabel + '</b> was <b>' + legs.deltaAvg.toFixed(2) + ' mph faster</b> on average · ';
  if (legs.deltaAvg > 1.0) {
    html += 'Large gap — strong wind or current effect likely. Compare to weather conditions above.';
  } else if (legs.deltaAvg > 0.4) {
    html += 'Moderate gap — some environmental assist or fatigue effect. Check wind direction.';
  } else {
    html += 'Small gap — conditions were fairly balanced across legs.';
  }
  html += '</div></div>';

  // Specific note for Saturday
  if (session.date === '20260509') {
    html += '<div class="notice n-mint" style="margin-top:12px;margin-bottom:0">';
    html += '💡 <b>May 9 data insight:</b> The inbound (return to shore) leg averaged <b>5.92 mph vs 4.23 mph outbound</b> — '
      + 'the return was actually <em>faster</em> despite feeling harder. '
      + 'This suggests you were paddling <em>into</em> the wind on the way out and <em>with</em> it on the return. '
      + 'The resistance you felt going back was likely the turbulence and chop from a tailwind, not headwind resistance. '
      + 'Add a note below to record what the wind felt like on each leg.';
    html += '</div>';
  }

  html += '</div>';
  return html;
}

/* ═══════════════════════════════════════════
   WEATHER — Open-Meteo Historical API
   Free, no key needed, works for ocean coords
   Fetches hourly wind speed + direction + wave
   height for the hour matching session start.
   Cached in localStorage under pawddle_wx_<date>
═══════════════════════════════════════════ */
var WX_CACHE_PREFIX='pawddle_wx_';

function windDirLabel(deg){
  var dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg/22.5)%16];
}
function mpsToMph(mps){return (mps*2.237).toFixed(1);}

function fetchWeather(session, callback){
  var cacheKey=WX_CACHE_PREFIX+session.date;
  // Check cache
  try{
    var cached=localStorage.getItem(cacheKey);
    if(cached){var wx=JSON.parse(cached);callback(null,wx);return;}
  }catch(e){}

  // Parse session date + hour
  var y=session.date.slice(0,4);
  var mo=session.date.slice(4,6);
  var d=session.date.slice(6,8);
  var dateStr=y+'-'+mo+'-'+d;

  // Use session start lat/lon if available, else startLat/startLon
  var lat=session.startLat||36.964;
  var lon=session.startLon||-122.003;

  // Determine if open water (lon < -122.01 roughly = more exposed)
  // We'll fetch both surface wind and wave height (GFS Wave model)
  var url='https://archive-api.open-meteo.com/v1/archive'
    +'?latitude='+lat.toFixed(4)
    +'&longitude='+lon.toFixed(4)
    +'&start_date='+dateStr
    +'&end_date='+dateStr
    +'&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,wave_height,wave_direction,wave_period'
    +'&wind_speed_unit=mph'
    +'&timezone=America%2FLos_Angeles';

  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      // Parse start hour from startTime e.g. "04/30/2026 18:34:39"
      var hourMatch=session.startTime.match(/(\d{2}):(\d{2}):\d{2}$/);
      var startHour=hourMatch?parseInt(hourMatch[1]):12;
      // Also grab the next 2 hours for session duration
      var hours=data.hourly;
      var times=hours.time||[];
      var idx=times.findIndex(function(t){
        return parseInt(t.slice(11,13))===startHour;
      });
      if(idx<0)idx=startHour; // fallback

      function avg2(arr,i){
        if(!arr||!arr.length)return null;
        var vals=[arr[i],arr[i+1],arr[i+2]].filter(function(v){return v!=null;});
        return vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
      }
      function pick(arr,i){return arr&&arr[i]!=null?arr[i]:null;}

      var wx={
        windSpeed: avg2(hours.wind_speed_10m,idx),       // mph
        windDir:   pick(hours.wind_direction_10m,idx),    // degrees
        windGust:  avg2(hours.wind_gusts_10m,idx),        // mph
        waveHeight:avg2(hours.wave_height,idx),           // metres (may be null inland)
        waveDir:   pick(hours.wave_direction,idx),
        wavePeriod:avg2(hours.wave_period,idx),
        hour:      startHour,
        fetchedAt: Date.now(),
      };
      // Cache
      try{localStorage.setItem(cacheKey,JSON.stringify(wx));}catch(e){}
      callback(null,wx);
    })
    .catch(function(err){callback(err,null);});
}

function fetchAllWeather(callback){
  var pending=SESSIONS.length;
  if(!pending){callback();return;}
  SESSIONS.forEach(function(s){
    fetchWeather(s,function(err,wx){
      if(!err&&wx) s._wx=wx;
      pending--;
      if(pending===0)callback();
    });
  });
}

function wxBadge(session){
  var wx=session._wx;
  if(!wx)return '<span style="font-size:10px;color:var(--gm)">loading…</span>';
  var html='<span style="font-size:11px;font-weight:700;color:var(--ink)">';
  html+='💨 '+wx.windSpeed.toFixed(1)+' mph '+windDirLabel(wx.windDir);
  if(wx.windGust&&wx.windGust>wx.windSpeed+3) html+=' (gusts '+wx.windGust.toFixed(0)+')';
  if(wx.waveHeight!=null&&wx.waveHeight>0.05) html+=' · 🌊 '+wx.waveHeight.toFixed(2)+'m';
  html+='</span>';
  return html;
}

function wxExposureNote(session){
  var wx=session._wx;
  if(!wx)return '';
  var isOpenWater=session.startLon<-122.01;
  var windMph=wx.windSpeed||0;
  var notes=[];
  if(windMph>12) notes.push('strong headwind/tailwind likely');
  else if(windMph>6) notes.push('moderate wind effect');
  else notes.push('light wind — good comparison day');
  if(wx.waveHeight!=null&&wx.waveHeight>0.3) notes.push('chop present');
  if(isOpenWater) notes.push('open water exposure');
  return notes.join(' · ');
}

/* ═══════════════════════════════════════════
   TIDES — NOAA CO-OPS API
   Station 9413745: Santa Cruz, Monterey Bay
   (~2.5 mi from session start coords)
   Free, no API key, supports browser CORS,
   historical predictions back many years.
   
   Fetches high/low tide times for the session
   date and finds the tide state at session start.
   Cached in localStorage under pawddle_tide_<date>
═══════════════════════════════════════════ */
var TIDE_CACHE_PREFIX = 'pawddle_tide_';
var NOAA_STATION = '9413745'; // Santa Cruz, Monterey Bay

function fetchTides(session, callback) {
  var cacheKey = TIDE_CACHE_PREFIX + session.date;
  try {
    var cached = localStorage.getItem(cacheKey);
    if (cached) { callback(null, JSON.parse(cached)); return; }
  } catch(e) {}

  var y = session.date.slice(0,4);
  var mo = session.date.slice(4,6);
  var d = session.date.slice(6,8);
  var dateStr = y + mo + d;

  // Get high/low predictions for the day
  var url = 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter'
    + '?begin_date=' + dateStr
    + '&end_date=' + dateStr
    + '&station=' + NOAA_STATION
    + '&product=predictions'
    + '&datum=MLLW'
    + '&time_zone=lst_ldt'
    + '&interval=hilo'
    + '&units=english'
    + '&application=pawddle_progress'
    + '&format=json';

  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.predictions || !data.predictions.length) {
        callback(new Error('No tide data'), null); return;
      }

      // Parse session start time to find tide state
      var hourMatch = session.startTime.match(/(\d{2}):(\d{2}):\d{2}$/);
      var startHour = hourMatch ? parseInt(hourMatch[1]) : 12;
      var startMin  = hourMatch ? parseInt(hourMatch[2]) : 0;
      var startMins = startHour * 60 + startMin;

      // Parse each tide event into minutes-since-midnight
      var events = data.predictions.map(function(p) {
        var parts = p.t.split(' '); // "2026-04-30 14:23"
        var timeParts = (parts[1] || '00:00').split(':');
        var mins = parseInt(timeParts[0]) * 60 + parseInt(timeParts[1]);
        return {
          time: p.t,
          mins: mins,
          height: parseFloat(p.v),
          type: p.type, // "H" or "L"
          label: p.type === 'H' ? 'High' : 'Low',
          timeStr: parts[1] || '',
        };
      });

      // Find the two events bracketing the session start
      var before = null, after = null;
      for (var i = 0; i < events.length; i++) {
        if (events[i].mins <= startMins) before = events[i];
        else if (!after) after = events[i];
      }

      // Determine tide state
      var state = 'unknown';
      var pctThrough = null;
      var nextEvent = null;
      var prevEvent = null;

      if (before && after) {
        var range = after.mins - before.mins;
        pctThrough = Math.round((startMins - before.mins) / range * 100);
        prevEvent = before;
        nextEvent = after;
        if (before.type === 'L' && after.type === 'H') {
          state = 'rising';
        } else if (before.type === 'H' && after.type === 'L') {
          state = 'falling';
        }
      } else if (before) {
        prevEvent = before;
        state = before.type === 'H' ? 'falling' : 'rising';
      } else if (after) {
        nextEvent = after;
        state = after.type === 'H' ? 'rising' : 'falling';
      }

      // Current interpolated height (linear approx between events)
      var interpHeight = null;
      if (before && after) {
        var t = (startMins - before.mins) / (after.mins - before.mins);
        interpHeight = before.height + t * (after.height - before.height);
        interpHeight = Math.round(interpHeight * 10) / 10;
      } else if (before) {
        interpHeight = before.height;
      }

      var result = {
        events: events,
        state: state,           // 'rising' | 'falling' | 'unknown'
        pctThrough: pctThrough, // % through current tide cycle
        interpHeight: interpHeight, // interpolated ft above MLLW at session start
        prevEvent: prevEvent,
        nextEvent: nextEvent,
        fetchedAt: Date.now(),
      };

      try { localStorage.setItem(cacheKey, JSON.stringify(result)); } catch(e) {}
      callback(null, result);
    })
    .catch(function(err) { callback(err, null); });
}

function tideStateIcon(state) {
  if (state === 'rising')  return '📈';
  if (state === 'falling') return '📉';
  return '〰️';
}

function tideStateColor(state) {
  if (state === 'rising')  return '#2e7a4a';
  if (state === 'falling') return '#a03060';
  return 'var(--gm)';
}

function renderTideCard(session) {
  var tide = session._tide;
  var html = '<div class="card">';
  html += '<div class="ct-title">🌊 Tides — Santa Cruz (NOAA #9413745)</div>';
  html += '<div class="ct-sub">MLLW datum · harmonic predictions · ~2.5 mi from session start</div>';

  if (!tide) {
    html += '<div style="font-size:12px;font-weight:600;color:var(--gm);padding:4px 0">Fetching tide data…</div>';
    html += '</div>';
    return html;
  }

  var stateColor = tideStateColor(tide.state);

  // Main state callout
  html += '<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">';
  html += '<div style="font-size:36px;line-height:1">' + tideStateIcon(tide.state) + '</div>';
  html += '<div>';
  html += '<div style="font-size:18px;font-weight:900;color:' + stateColor + '">'
    + (tide.state === 'rising' ? 'Rising' : tide.state === 'falling' ? 'Falling' : 'Unknown')
    + ' tide</div>';
  if (tide.interpHeight !== null) {
    html += '<div style="font-size:13px;font-weight:700;color:var(--ink)">~'
      + tide.interpHeight.toFixed(1) + ' ft above MLLW at session start</div>';
  }
  if (tide.pctThrough !== null && tide.prevEvent && tide.nextEvent) {
    html += '<div style="font-size:11px;font-weight:600;color:var(--gm);margin-top:2px">'
      + tide.pctThrough + '% through '
      + tide.prevEvent.label.toLowerCase() + '-to-'
      + tide.nextEvent.label.toLowerCase() + ' cycle</div>';
  }
  html += '</div></div>';

  // Tide bar showing position in cycle
  if (tide.pctThrough !== null) {
    var barColor = tide.state === 'rising' ? 'var(--mint-dk)' : 'var(--blush-dk)';
    html += '<div style="margin-bottom:14px">';
    html += '<div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--gm);margin-bottom:4px">';
    html += '<span>' + (tide.prevEvent ? tide.prevEvent.label + ' ' + tide.prevEvent.timeStr + ' (' + tide.prevEvent.height.toFixed(1) + ' ft)' : '') + '</span>';
    html += '<span>' + (tide.nextEvent ? tide.nextEvent.label + ' ' + tide.nextEvent.timeStr + ' (' + tide.nextEvent.height.toFixed(1) + ' ft)' : '') + '</span>';
    html += '</div>';
    html += '<div style="height:8px;background:var(--lav-lt);border-radius:999px;position:relative;overflow:visible">';
    html += '<div style="height:100%;width:' + tide.pctThrough + '%;background:' + barColor + ';border-radius:999px;transition:width .5s"></div>';
    html += '<div style="position:absolute;top:-3px;left:' + Math.min(tide.pctThrough, 96) + '%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:' + barColor + ';border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.15)"></div>';
    html += '</div>';
    html += '</div>';
  }

  // Full day tide table
  html += '<div style="display:grid;grid-template-columns:repeat(' + Math.min(tide.events.length, 4) + ',1fr);gap:8px">';
  tide.events.forEach(function(ev) {
    var isNearest = tide.prevEvent && ev.time === tide.prevEvent.time;
    var col = ev.type === 'H' ? 'var(--plum)' : 'var(--gm)';
    html += '<div style="background:' + (isNearest ? 'var(--lilac)' : 'var(--lilac2)') + ';border-radius:8px;padding:10px 12px;border:1.5px solid ' + (isNearest ? 'var(--lav-md)' : 'var(--lav-lt)') + '">';
    html += '<div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:' + col + ';margin-bottom:4px">'
      + ev.label + (isNearest ? ' ◀ before session' : '') + '</div>';
    html += '<div style="font-size:20px;font-weight:900;color:' + col + '">' + ev.height.toFixed(1) + '<span style="font-size:11px;font-weight:600;color:var(--gm)"> ft</span></div>';
    html += '<div style="font-size:11px;font-weight:700;color:var(--ink);margin-top:3px">' + ev.timeStr + '</div>';
    html += '</div>';
  });
  html += '</div>';

  // Context for paddling
  html += '<div style="margin-top:12px;background:var(--lilac);border-radius:10px;padding:10px 14px;font-size:11px;font-weight:700;color:var(--ink);line-height:1.7">';
  html += '<b>Paddling context:</b> ';
  if (tide.state === 'rising' && tide.interpHeight !== null && tide.interpHeight > 3.0) {
    html += 'High-ish rising tide — water levels good for harbour access. Current typically flows into harbour (northward) during rising tide at Santa Cruz, which can give a boost heading out through the harbour mouth.';
  } else if (tide.state === 'rising') {
    html += 'Rising tide — current flows into harbour. Typically helpful going out, resistant coming back through the harbour mouth.';
  } else if (tide.state === 'falling' && tide.interpHeight !== null && tide.interpHeight < 1.5) {
    html += 'Low-ish falling tide — watch for shallow areas near harbour entrance. Outgoing current can create chop at the mouth.';
  } else if (tide.state === 'falling') {
    html += 'Falling tide — current flows out of harbour. Can give a boost returning to shore through the harbour mouth, but resist heading out.';
  } else {
    html += 'Tide state uncertain for this session time. Check the times above.';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function tideCell(session) {

/* ═══════════════════════════════════════════
   LEG DETECTION
   For any session with enough GPS coverage,
   detect the turnaround point (farthest extent
   along primary axis of travel) and split into
   faster vs slower leg. Works for both E-W
   open-water paddles and N-S harbour runs.
═══════════════════════════════════════════ */
/* ═══════════════════════════════════════════
   LEG DETECTION — speed-valley based
   Finds turns / direction changes by looking
   for sustained speed drops in the smoothed
   speed trace. A real "leg boundary" shows as
   a valley where smoothed speed falls well
   below the session's cruising speed and stays
   low for multiple consecutive strokes.
═══════════════════════════════════════════ */

function detectLegs(session) {
  var strokes = session.strokes.filter(function(s) {
    return s.s != null && s.s > 0.3;
  });
  var n = strokes.length;
  if (n < 80) return null;

  /* ── 1. Smooth speed with rolling mean ── */
  var WIN = Math.min(20, Math.floor(n / 10));
  var smoothed = new Array(n);
  for (var i = 0; i < n; i++) {
    var i0 = Math.max(0, i - WIN), i1 = Math.min(n - 1, i + WIN);
    var sum = 0, cnt = 0;
    for (var j = i0; j <= i1; j++) { sum += strokes[j].s; cnt++; }
    smoothed[i] = sum / cnt;
  }

  /* ── 2. Session statistics ── */
  var sorted = smoothed.slice().sort(function(a,b){return a-b;});
  var p25 = sorted[Math.floor(n * 0.25)];
  var p50 = sorted[Math.floor(n * 0.50)];
  var p75 = sorted[Math.floor(n * 0.75)];

  /* Valley threshold: strokes well below p25 are "slow" (rest, turn, stop) */
  var slowThresh = p25 - 0.5 * (p75 - p25);
  /* Minimum valley width: at least 2% of session strokes */
  var minWidth = Math.max(5, Math.floor(n * 0.02));
  /* Valleys must be at least 10% of session from each end */
  var edgeGuard = Math.floor(n * 0.10);

  /* ── 3. Find contiguous "slow" regions ── */
  var valleys = [];
  var inValley = false, vs = 0;
  for (var i = 0; i < n; i++) {
    if (smoothed[i] < slowThresh) {
      if (!inValley) { inValley = true; vs = i; }
    } else {
      if (inValley) {
        inValley = false;
        var ve = i;
        var width = ve - vs;
        var mid = Math.floor((vs + ve) / 2);
        if (width >= minWidth && mid > edgeGuard && mid < n - edgeGuard) {
          var valMin = Infinity;
          for (var j = vs; j < ve; j++) valMin = Math.min(valMin, smoothed[j]);
          valleys.push({ vs: vs, ve: ve, mid: mid, width: width, minSpd: valMin });
        }
      }
    }
  }

  /* ── 4. If no clear valleys, look for the biggest relative dip ── */
  if (valleys.length === 0) {
    /* Find the single lowest sustained point in the middle 60% of the session */
    var searchStart = Math.floor(n * 0.20);
    var searchEnd   = Math.floor(n * 0.80);
    var windowSize  = Math.floor(n * 0.05);
    var minAvg = Infinity, minIdx = -1;
    for (var i = searchStart; i < searchEnd - windowSize; i++) {
      var wsum = 0;
      for (var j = i; j < i + windowSize; j++) wsum += smoothed[j];
      var wavg = wsum / windowSize;
      if (wavg < minAvg) { minAvg = wavg; minIdx = i + Math.floor(windowSize/2); }
    }
    /* Only use if it's meaningfully lower than the session median */
    if (minIdx > 0 && minAvg < p50 * 0.88) {
      valleys.push({ vs: minIdx - windowSize, ve: minIdx + windowSize,
                     mid: minIdx, width: windowSize * 2, minSpd: minAvg });
    }
  }

  if (valleys.length === 0) return null;

  /* ── 5. Pick the main leg boundary ── */
  /* Score = width × depth below threshold */
  var mainValley = valleys.reduce(function(best, v) {
    var score = v.width * (p50 - v.minSpd);
    var bestScore = best.width * (p50 - best.minSpd);
    return score > bestScore ? v : best;
  });

  /* ── 6. Extract leg stats ── */
  var outStrokes = strokes.slice(0, mainValley.mid);
  var inStrokes  = strokes.slice(mainValley.ve);  // start after valley ends

  function legStats(leg) {
    if (leg.length < 10) return null;
    var spds = leg.map(function(s){return s.s;}).filter(function(v){return v>0.3;});
    var srs  = leg.map(function(s){return s.r;}).filter(function(v){return v!=null;});
    if (!spds.length) return null;
    spds.sort(function(a,b){return a-b;});
    var nn = spds.length;
    var avg = spds.reduce(function(a,b){return a+b;},0)/nn;
    var p95 = spds[Math.floor(nn*0.95)];
    var p50 = spds[Math.floor(nn*0.50)];
    return {
      avg: avg,
      p50: p50,
      p95: p95,
      max: spds[nn-1],
      sr: srs.length ? srs.reduce(function(a,b){return a+b;},0)/srs.length : null,
      n: nn,
    };
  }

  var outStats = legStats(outStrokes);
  var inStats  = legStats(inStrokes);
  if (!outStats || !inStats) return null;

  /* ── 7. Identify faster / slower leg ── */
  var outFaster = outStats.avg >= inStats.avg;
  var deltaAvg  = Math.abs(outStats.avg  - inStats.avg);
  var deltaP95  = Math.abs(outStats.p95  - inStats.p95);

  return {
    turnPct:    Math.round(mainValley.mid / n * 100),
    turnIdx:    mainValley.mid,
    valleyMinSpd: Math.round(mainValley.minSpd * 100) / 100,
    valleyWidth:  mainValley.width,
    outbound:   outStats,
    inbound:    inStats,
    outFaster:  outFaster,
    deltaAvg:   deltaAvg,
    deltaP95:   deltaP95,
    allValleys: valleys.length,
  };
}

function renderLegsCard(session) {

  html += '</div>';

  html += '<div class="sc" style="border-color:var(--blush-dk)44">';
  html += '<div class="sl" style="color:#a03060">🐢 ' + slowerLabel + ' · Peak</div>';
  html += '<div class="sv" style="color:#a03060">' + slower.p95.toFixed(2) + '<span class="su2"> mph</span></div>';
  html += '<div class="sn">95th pct · top: ' + slower.max.toFixed(1) + '</div>';
  html += '</div>';

  /* Gap callout */
  var gapIcon = legs.deltaAvg > 1.5 ? '💨' : legs.deltaAvg > 0.5 ? '🌬️' : '〰️';
  var gapNote = legs.deltaAvg > 1.5
    ? 'Large gap — strong wind or current difference between legs. Check conditions above.'
    : legs.deltaAvg > 0.5

  html += '<div style="display:flex;align-items:flex-start;gap:12px;background:var(--lilac);border-radius:10px;padding:10px 14px">';
  html += '<span style="font-size:20px">' + gapIcon + '</span>';
  html += '<div style="font-size:12px;font-weight:700;color:var(--ink);line-height:1.7">';
  html += '<b>' + fasterLabel + '</b> was <b>' + legs.deltaAvg.toFixed(2) + ' mph faster on average</b> · ' + gapNote;
  html += '</div></div>';

  /* May 9 specific insight */

    html += 'The speed data suggests you paddled <em>into</em> a headwind going out and got a tailwind assist coming back — ';
    html += 'the turbulence of paddling downwind can feel like resistance even when you\'re going faster.';
    html += '</div>';
  }

  html += '</div>';
  return html;
}


/* ═══════════════════════════════════════════
   DOWNWIND RUN DETECTION
   For Saturday Long Z2 sessions, identifies
   "hot runs" — sustained periods where smoothed
   speed exceeds the session's 75th percentile.
   These are the wave-connected legs.
   
   Key metric: speed / stroke_rate (efficiency)
   Higher = connecting waves with fewer strokes.
   Goal: same or higher speed at lower SR over time.
═══════════════════════════════════════════ */

function detectDownwindRuns(session) {
  var strokes = session.strokes.filter(function(s) {
    return s.s != null && s.s > 0.3;
  });
  var n = strokes.length;
  if (n < 80) return null;

  /* Smooth speed */
  var WIN = 15;
  var smoothed = new Array(n);
  for (var i = 0; i < n; i++) {
    var i0 = Math.max(0, i - WIN), i1 = Math.min(n - 1, i + WIN);
    var sum = 0, cnt = 0;
    for (var j = i0; j <= i1; j++) { sum += strokes[j].s; cnt++; }
    smoothed[i] = sum / cnt;
  }

  /* Session speed distribution */
  var sorted = smoothed.slice().sort(function(a,b){return a-b;});
  var p50 = sorted[Math.floor(n*0.50)];
  var p75 = sorted[Math.floor(n*0.75)];
  var p90 = sorted[Math.floor(n*0.90)];

  /* Hot-run threshold = p75. Min 8 strokes to count. */
  var hotThresh = p75;
  var minRunLen = 8;

  /* Find contiguous hot runs */
  var runs = [];
  var inRun = false, runStart = 0;
  for (var i = 0; i < n; i++) {
    if (smoothed[i] >= hotThresh) {
      if (!inRun) { inRun = true; runStart = i; }
    } else {
      if (inRun) {
        inRun = false;
        if (i - runStart >= minRunLen) {
          runs.push(makeRun(strokes, runStart, i, runStart / n));
        }
      }
    }
  }
  if (inRun && n - runStart >= minRunLen) {
    runs.push(makeRun(strokes, runStart, n, runStart / n));
  }

  if (!runs.length) return null;

  /* Aggregate across all hot runs */
  var allRunSpds = [], allRunSRs = [];
  runs.forEach(function(r) {
    for (var i = r.start; i < r.end; i++) {
      allRunSpds.push(strokes[i].s);
      if (strokes[i].r != null) allRunSRs.push(strokes[i].r);
    }
  });

  /* Between-run (paddling, waiting for next wave) */
  var restSpds = [], restSRs = [];
  var inRunSet = new Set();
  runs.forEach(function(r){ for(var i=r.start;i<r.end;i++) inRunSet.add(i); });
  for (var i = 0; i < n; i++) {
    if (!inRunSet.has(i)) {
      restSpds.push(strokes[i].s);
      if (strokes[i].r != null) restSRs.push(strokes[i].r);
    }
  }

  allRunSpds.sort(function(a,b){return a-b;});
  var runAvgSpd = avg(allRunSpds);
  var runP95Spd = allRunSpds[Math.floor(allRunSpds.length*0.95)] || allRunSpds[allRunSpds.length-1];
  var runAvgSR  = allRunSRs.length ? avg(allRunSRs) : null;
  var runEff    = runAvgSR ? runAvgSpd / runAvgSR * 100 : null;

  /* Sort runs by efficiency score (longer + higher eff = better wave ride) */
  runs.sort(function(a,b){
    var scoreA = (a.eff||0) * Math.log(a.len+1);
    var scoreB = (b.eff||0) * Math.log(b.len+1);
    return scoreB - scoreA;
  });

  return {
    runs:       runs,
    runCount:   runs.length,
    runStrokes: allRunSpds.length,
    runPct:     Math.round(allRunSpds.length / n * 100),
    avgSpd:     runAvgSpd,
    p95Spd:     runP95Spd,
    avgSR:      runAvgSR,
    eff:        runEff,
    restAvgSpd: avg(restSpds),
    restAvgSR:  restSRs.length ? avg(restSRs) : null,
    p75Thresh:  Math.round(p75*100)/100,
    p90:        Math.round(p90*100)/100,
    sessionP50: Math.round(p50*100)/100,
  };
}

function makeRun(strokes, start, end, pct) {
  var spds = [], srs = [];
  for (var i = start; i < end; i++) {
    spds.push(strokes[i].s);
    if (strokes[i].r != null) srs.push(strokes[i].r);
  }
  spds.sort(function(a,b){return a-b;});
  var avgSpd = avg(spds);
  var p95    = spds[Math.floor(spds.length*0.95)] || spds[spds.length-1];
  var avgSR  = srs.length ? avg(srs) : null;
  var eff    = avgSR ? avgSpd / avgSR * 100 : null;
  return { start:start, end:end, len:end-start, pct:Math.round(pct*100),
           avgSpd:Math.round(avgSpd*100)/100, p95:Math.round(p95*100)/100,
           avgSR:avgSR?Math.round(avgSR*10)/10:null, eff:eff?Math.round(eff*100)/100:null };
}

function avg(arr) {
  if (!arr.length) return 0;
  return arr.reduce(function(a,b){return a+b;},0)/arr.length;
}

/* ── Render downwind card (replaces generic legs card on Saturday sessions) ── */
function renderDownwindCard(session) {
  var dw = detectDownwindRuns(session);

  if (!dw) {

    html += '</div>';
    return html;
  }

  html += '<div class="ct-sub">'
    + dw.runCount + ' hot runs detected (above ' + dw.p75Thresh + ' mph · session P75) · '
